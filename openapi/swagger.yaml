  /api/v1/party-locations:
    get:
      summary: Discover public Party locations
      operationId: discoverPartyLocations
      tags: [Parties]
      security: []
      description: >-
        Location-oriented discovery of eligible active Party sites. Multiple matching sites of
        one Party intentionally appear as separate locations. Country/subdivision predicates
        need no coordinates. Radius or distance ordering requires an explicit numeric origin.
        Strict proximity requires PREMISES precision; approximate mode retains coarse labels.
        Ordered by distance when requested, then native location UUID ascending; otherwise
        UUID ascending. Reads current PostgreSQL locations independently of listing projection catch-up.
        All responses are private, no-store. Management evidence, addresses and revisions stay private.
      parameters:
        - name: geography
          in: query
          required: true
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/GeographicSearchData'
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 21}
        - name: searchAfter
          in: query
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/PartyLocationDiscoveryCursorData'
      responses:
        '200':
          description: Matching public locations.
          content:
            application/json:
              schema:
                type: object
                required: [items, size]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PublicPartyLocationData'}
                  size: {type: integer}
                  searchAfter: {$ref: '#/components/schemas/PartyLocationDiscoveryCursorData'}
        '400':
          description: Invalid geographic predicates, origin or continuation (BAD_QUERY_PARAMETER_VALUE).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: Location read unavailable (PARTY_TEMPORARILY_UNAVAILABLE).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ApiError'}
