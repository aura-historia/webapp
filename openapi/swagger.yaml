            nullable: true
            minLength: 1
            maxLength: 64
            description: Optional verbatim postal assertion, at most 64 UTF-8 bytes.
      description: Exclusive browsing selector. An ADDRESS reference must belong to the current user. No shipping, billing
        or residence assertion.
    BrowsingDestinationView:
      type: object
      additionalProperties: false
      required:
      - version
