                error: INTERNAL_SERVER_ERROR
    patch:
      summary: Update watchlist product settings
      description:
        "Updates settings for a specific watchlist product (e.g., toggle notifications or manually activate/deactivate
        the watchlist entry).

        Returns full personalized product data (`item` and `userState`) after applying the update, including
        for an empty `{}` no-op. `userState.watchlist.watching` reflects whether the entry is active, and
        `userState.watchlist.notifications` reflects the stored notification setting. Hidden and withdrawn
        listings retain their usual redaction.

        Requires a valid user bearer credential. Delegated credentials require `watchlist:write`; no additional
        read scope is required for the response. Responses are not cached.

        "
      operationId: patchWatchlistProduct
      tags:
        - Watchlist
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
          example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: language
          in: query
          required: false
          description:
            "Preferred language for localized content in the response.

            Defaults to `en` when omitted.

            "
          schema:
            $ref: "#/components/schemas/LanguageData"
          example: de
        - name: currency
          in: query
          required: false
          description: Currency for price display in the response. Defaults to `EUR` when omitted.
          schema:
            $ref: "#/components/schemas/CurrencyData"
          example: EUR
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Patch object containing fields to update. An empty object leaves the entry unchanged.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistProductPatch"
            examples:
              enable_notifications:
                summary: Enable notifications
                value:
                  notifications: true
              disable_notifications:
                summary: Disable notifications
                value:
                  notifications: false
              deactivate_watchlist_entry:
                summary: Deactivate this watchlist entry manually
                value:
