                type: string
                format: uri
              example: /api/v1/admin/oauth-clients/oc_7b0gwc1x49e0mvbt3tfexfqgb5
            Cache-Control:
              description: Always set to `no-store` because the response contains the raw secret.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthClientMetadataResponseData"
              example:
                client_id: oc_7b0gwc1x49e0mvbt3tfexfqgb5
                client_secret: aurahistoria_oauth_client_secret_abcdefghijk_abcdefghijklmnopqrstuvwxyz1234567
                client_name: Acceptance OAuth client
                tos_uri: https://client.example/tos
                policy_uri: https://client.example/policy
                client_uri: https://client.example
                logo_uri: https://client.example/logo.png
                redirect_uris:
                  - https://client.example/callback
                scope:
                  - product-listings:write
                client_id_issued_at: 1748539200
        "400":
          description: Bad request — missing, empty, malformed JSON body, invalid redirect URI, or unsupported scope.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty
                empty_redirect_uris:
                  summary: Redirect URIs are required
                  value:
                    status: 400
                    title: Bad Request
                    error: OAUTH_INVALID_CLIENT_METADATA
                    detail: "OAuth client metadata is invalid: OAuth client must have at least one redirect URI"
                insecure_redirect_uri:
                  summary: Redirect URI must use HTTPS
                  value:
                    status: 400
                    title: Bad Request
                    error: OAUTH_INVALID_CLIENT_METADATA
                    detail: "OAuth client metadata is invalid: OAuth redirect URI must use HTTPS: http://client.example/callback"
        "401":
          description: Unauthorized — invalid or missing bearer credentials.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden — the caller is not an administrator or a delegated caller lacks `access-tokens:write`.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
