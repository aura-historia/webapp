  /api/v1/admin/overview:
    get:
      summary: Get the administrator operational overview
      description: |
        Delegated Aura access tokens require `admin-overview:read`; missing scope returns `403 FORBIDDEN`.
        Returns a bounded landing-page summary for authenticated administrators. `schemaVersion` is
        required so clients can select a compatible response decoder. Every counter is read from
        authoritative PostgreSQL by one aggregate statement; OpenSearch and other rebuildable
        projections are not used.

        `listingSources.methodAssignments` counts source-method assignments, not distinct sources,
        so its values may sum to more than `listingSources.total`. ProductListing availability
        counts include only `ACTIVE` listings; `activeWithoutAvailability` identifies active rows
        without a current source availability assertion. Responses contain no PII, secrets, or
        embedded collections and always use `Cache-Control: no-store`.
      operationId: getAdminOverview
      tags:
        - Administration
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: Authoritative operational counters returned successfully.
          headers:
            Cache-Control:
              description: Administrator overview responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewData"
        "401":
          description: Missing or invalid bearer credentials.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: The caller does not have the persisted ADMIN role.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "500":
          description: An invalid authoritative read model or internal overview failure occurred.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: ADMIN_OVERVIEW_INTERNAL_ERROR
        "503":
          description: PostgreSQL or persisted administrator authorization is temporarily unavailable.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: ADMIN_OVERVIEW_TEMPORARILY_UNAVAILABLE
  /api/v1/admin/partnerships:
    get:
      summary: List Partnerships for administration
      description: |
        Delegated Aura access tokens require `partnerships:read`; missing scope returns `403 FORBIDDEN`.
        Lists active Partnerships for authenticated administrators.

        Results use bounded keyset cursor pagination in fixed `created` descending, then
        Partnership ID descending order. Page sizes are clamped to 1–100, with a default
        of 21. The returned `searchAfter` value is a JSON-encoded
        `[created RFC3339 timestamp, Partnership ID]` cursor; it is omitted on the terminal
        page and should be sent with the same filters for the next page.

        Optional `partyId`, `memberUserId`, and `listingSourceId` filters are exact object-ID
        matches and are combined when supplied. Each result is a safe summary containing
        the Partnership ID, Party ID/immutable slug/name, member count, ListingSource-grant
        count, and creation/update timestamps. Member identities, grant identities, Party
        contact data, persistence versions, provider credentials, webhook secrets, and
        crawler-local configuration are never returned. Responses always use
        `Cache-Control: no-store`.
      operationId: adminSearchPartnerships
      tags:
        - Partnerships
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: partyId
          in: query
          required: false
          description: Optional exact Party ID filter.
          schema:
            type: string
          example: pty_4k4snxc3pkecc9yw66heemzyp0
        - name: memberUserId
          in: query
          required: false
          description: Optional exact member User ID filter.
          schema:
            type: string
          example: usr_5kgk59yyskf6fb0gyc9fxn5gwk
        - name: listingSourceId
          in: query
          required: false
          description: Optional exact ListingSource grant ID filter.
          schema:
            type: string
          example: ls_0geqhfpd80f6ga8zv98d2vcd1v
        - name: searchAfter
          in: query
          required: false
          description: JSON-encoded `[created RFC3339 timestamp, Partnership ID]` cursor returned by the previous page.
          schema:
            type: string
          example: '["2026-09-04T12:00:00Z","psh_3q65ndcw7wfxqswjtrv1kfhwd1"]'
        - name: size
          in: query
          required: false
          description: Number of Partnership summaries requested per page. The server clamps values to 1–100.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 21
          example: 21
      responses:
        "200":
          description: Partnership summaries returned successfully.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only read.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartnershipCollectionData"
              example:
                items:
                  - partnershipId: psh_3q65ndcw7wfxqswjtrv1kfhwd1
                    party:
                      partyId: pty_4k4snxc3pkecc9yw66heemzyp0
                      partySlugId: safe-party
                      name: Safe Party
                    memberCount: 2
                    listingSourceGrantCount: 3
                    created: "2026-09-04T12:00:00Z"
                    updated: "2026-09-04T13:00:00Z"
                size: 21
                searchAfter:
                  - "2026-09-04T12:00:00Z"
                  - psh_3q65ndcw7wfxqswjtrv1kfhwd1
        "400":
          description: Bad request - invalid Partnership query parameter.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 400
                title: Bad Request
                error: BAD_QUERY_PARAMETER_VALUE
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - this endpoint requires the `ADMIN` role.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "500":
          description: Internal authentication or Partnership search failure.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PARTNERSHIP_INTERNAL_ERROR
        "503":
          description: Authentication, admin authorization, or Partnership search is temporarily unavailable.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
