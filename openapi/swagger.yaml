    delete:
      summary: Delete a user as admin
      description: "Deletes a user account for authenticated administrators.

        Cognito JWTs and Aura Historia access tokens are accepted; delegated access tokens require `users:write`.

        The caller's persisted user role must be `ADMIN`; this authorization is enforced in the User service.

        PostgreSQL synchronously cascades user-owned access tokens, OAuth authorization codes, watchlist entries,
