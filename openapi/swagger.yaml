              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "404":
          description: Target user was not found.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
