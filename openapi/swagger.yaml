        "400":
          description: Invalid filter, sort, or cursor (`BAD_QUERY_PARAMETER_VALUE`, `BAD_SORT_VALUE`, or `INVALID_OBJECT_ID`).
        "401":
          {
            description: Missing or invalid credentials (`INVALID_CREDENTIALS`).,
          }
        "403":
          description: Administrator authority and delegated `auctions:read` capability required (`FORBIDDEN`).
        "503":
          {
            description: Auction search temporarily unavailable (`AUCTION_TEMPORARILY_UNAVAILABLE`).,
