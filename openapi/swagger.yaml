          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: OAUTH_INTERNAL_ERROR
        "503":
          description: Temporary authentication, authorization, or OAuth client persistence failure.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
