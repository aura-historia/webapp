  /api/v1/admin/parties/{party_id}/location-managers:
    get:
      operationId: listPartyLocationManagers
      summary: List current Party location managers
      tags:
      - Party
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      description: >-
        Administrator-only directory of current explicit grantees and members of active
        Partnerships for this Party. Delegated credentials also require parties:read.
        Suspended/deleted users, revoked grants and dissolved Partnerships are excluded.
        Each user appears once with all independent access reasons; an access filter
        selects users without removing their other reasons. Revoking an explicit grant
        leaves Partnership access intact. Administrator role alone does not create a row.
        Identity is limited to userId, email and optional firstName/lastName. Grant timestamps
        are not stored or returned. Results use keyset pagination ordered by underlying
        user UUID ascending; searchAfter is the last returned strict User TypeID only when
        another row exists. Pages reflect current state, so changes between requests may
        change membership. All responses use Cache-Control: no-store.
      parameters:
      - name: party_id
        in: path
        required: true
        description: Strict Party TypeID.
        schema:
          type: string
          pattern: ^pty_
      - name: userId
        in: query
        description: Exact strict User TypeID. A user with no current access yields an empty page.
        schema:
          type: string
          pattern: ^usr_
      - name: access
        in: query
        description: Include users with this access reason; each item still reports all current reasons.
        schema:
          type: string
          enum: [EXPLICIT, PARTNERSHIP]
      - name: size
        in: query
        description: Requested page size, clamped to 1–100. Defaults to 21.
        schema:
          type: integer
          minimum: 0
          default: 21
      - name: searchAfter
        in: query
        description: Strict User TypeID from the previous page. Continue with the same Party and filters.
        schema:
          type: string
          pattern: ^usr_
      responses:
        '200':
          description: Current location managers; size is the number of returned users.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyLocationManagersPage'
              examples:
                mixedAccess:
                  summary: Independent explicit, Partnership and combined access
                  value:
                    items:
                    - userId: usr_01h455vb4pex5vy7enb1p677vn
                      email: explicit@example.test
                      access: [{type: EXPLICIT}]
                    - userId: usr_01h455vb4pex5vy7enb1p677vp
                      email: member@example.test
                      firstName: Ada
                      access:
                      - type: PARTNERSHIP
                        partnershipIds: [psh_01h455vb4pex5vy7enb1p677vn]
                    - userId: usr_01h455vb4pex5vy7enb1p677vq
                      email: both@example.test
                      firstName: Grace
                      lastName: Hopper
                      access:
                      - type: EXPLICIT
                      - type: PARTNERSHIP
                        partnershipIds: [psh_01h455vb4pex5vy7enb1p677vn]
                    size: 3
                nonterminal:
                  summary: A page with another authorized user after it
                  value:
                    items:
                    - userId: usr_01h455vb4pex5vy7enb1p677vn
                      email: explicit@example.test
                      access: [{type: EXPLICIT}]
                    size: 1
                    searchAfter: usr_01h455vb4pex5vy7enb1p677vn
                noAccess:
                  summary: Selected user has no current access
                  value: {items: [], size: 0}
        '400':
          description: Invalid IDs or query (INVALID_OBJECT_ID or BAD_QUERY_PARAMETER_VALUE).
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/problem+json:
