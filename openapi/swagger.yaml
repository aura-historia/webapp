          schema: { type: string, example: ls_6rd827eqfefsva9teecmwa3ate }
        - $ref: "#/components/parameters/AsyncProductListingIdempotencyKey"
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Same array and item contract as synchronous DELETE; individual invalid items produce report failures, not whole-batch rejection.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/WithdrawProductListingData"
            example:
              - sourceListingId: baroque-violin-001
              - sourceListingId: "  "
              - sourceListingId: baroque-violin-003
      responses:
        "202":
          description: At least one withdrawal confirmed admitted, or an authorized empty array. May include item-level failures; no withdrawal completion implied.
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
              examples:
                partial_admission:
                  summary: Three original withdrawals; indices 0 and 2 confirmed accepted
                  value:
                    submissionId: plis1_example
                    acceptedCount: 2
                    failures:
                      - { index: 1, error: BAD_BODY_VALUE, retryable: false }
                empty_batch:
                  summary: Empty authorized batch; no sends
                  value:
                    {
                      submissionId: plis1_example,
                      acceptedCount: 0,
                      failures: [],
                    }
        "400":
          description: Pre-evaluation invalid request (ApiError), or zero accepted with only item validation/value/size rejections (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
        "401":
          description: Missing or invalid bearer credential; no sends.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Insufficient credential capability; no sends.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Whole-body/front-door limit before evaluation (ApiError), or zero accepted with only encoded-message-size item failures (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
        "500":
          description: Pre-evaluation internal/configuration failure (ApiError), or zero accepted with an item internal/configuration failure and no retryable send outcome (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"
        "503":
          description: Pre-evaluation transient dependency failure (ApiError), or zero accepted with an unconfirmed/retryable send, deadline or blocked outcome (batch report).
          headers:
            Idempotency-Key:
              $ref: "#/components/headers/AsyncProductListingIdempotencyKey"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncProductListingBatchReport"

  /api/v1/webhooks/woocommerce/{listingSourceId}:
    post:
      summary: Ingest a WooCommerce product webhook (Partner API)
      description:
        "Accepts a single WooCommerce product webhook event for a partnership using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        The caller must provide:

        - the bearer token in the `Authorization` header,

        - the WooCommerce topic in `x-wc-webhook-topic`, and

        - the base64-encoded HMAC-SHA256 signature over the exact, untouched request body bytes in `x-wc-webhook-signature`, and

        - optionally, the WooCommerce delivery identifier in `x-wc-webhook-delivery-id`.


        A supplied delivery identifier applies only when an event maps to raw capture. Its provider receipt retains only a

        canonical semantic source-payload SHA-256 evidence digest for 90 days. A captured-observation retry with the same

        digest may be deduplicated during downstream capture; reuse with different evidence fails in the consumer, not as an immediate HTTP `409`.

        Logical receipt expiry permits a new receipt but never removes or rewrites a captured raw revision or its provenance.

        A timestamp-free DELETE establishes a restore barrier. A later UPSERT without a provably newer `date_modified_gmt`

        fails during downstream capture (`WOOCOMMERCE_PROVIDER_SOURCE_ORDER_AMBIGUOUS`), not as an immediate HTTP `409`. Admission does not create a provider receipt or raw revision; investigate the failed FIFO command before reconciliation or redrive.

        The service verifies the signature over untouched body bytes before JSON parsing, then submits mapped observations as `CAPTURE_RAW` to the shared FIFO after bearer/capability checks and source configuration lookup. The consumer checks the current partner/source grant for mapped observations; ignored no-ops check it immediately. Only a matching, confirmed queue acceptance permits `204`; rejected, oversized, unconfirmed, and not-attempted submissions are not acknowledged. The FIFO consumer later commits raw capture with the command receipt; provider receipt and source-order decisions occur during that capture. Authorized ignored create/update events are no-op `204` without queue send or receipt, even when they include a delivery identifier. Retry an uncertain submission with the same signed body, topic, source, actor and delivery identifier where provided; without a delivery identifier, retries cannot recover the original command identity after a lost reply and have no provider receipt-based deduplication guarantee. A lost reply may already have enqueued work; never infer rollback from a non-204.


        Topic-specific payload requirements:

        - every topic requires `id`

        - `product.created` and `product.updated` with `status: publish` capture an UPSERT and require nonblank

        `name` and `permalink`

        - `product.created` and `product.updated` with `status: trash`, `draft`, `pending`, or `private` capture a

        DELETE and require only `id`; missing or unsupported statuses are authorized ignored events and also require

        only `id`

        - `product.deleted` captures a DELETE and requires only `id`


        The listing source identified by `listingSourceId` must have a WooCommerce ingestion configuration

        with a nonblank write-only `webhookSecret` and a configured language.

        A nonblank `price` maps to a `SET` and requires the listing source to have `woocommerceCurrency` configured.

        "
      operationId: postWoocommerceWebhook
      tags:
        - ProductListings
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource that should receive the WooCommerce webhook
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
        - name: x-wc-webhook-topic
          in: header
          required: true
          description:
            "WooCommerce webhook topic that determines how the payload is interpreted.

            Only the listed topic values are accepted.

            "
          schema:
            type: string
            enum:
              - product.created
              - product.updated
              - product.deleted
          example: product.created
        - name: x-wc-webhook-signature
          in: header
          required: true
          description:
            "Base64-encoded HMAC-SHA256 signature of the raw HTTP request body, calculated with the

            WooCommerce ingestion configuration's `webhookSecret`.

            "
          schema:
            type: string
          example: wqW/6B0S9myGxVQ8l3PPX2f6s4HWtY6q9KAr4m+Jv3E=
        - name: x-wc-webhook-delivery-id
          in: header
          required: false
          description: "Optional WooCommerce delivery identifier. For an event that maps to raw capture, its downstream provider receipt retains only a canonical semantic source-payload SHA-256 evidence digest for 90 days and deduplicates retries when applied. Reuse with different evidence fails during consumer capture, not as an immediate HTTP conflict. Logical receipt expiry permits a new receipt but never removes or rewrites a captured raw revision or its provenance. Authorized ignored create/update status events persist no receipt and receive no receipt-based retry-deduplication, even when this header is supplied. When absent, no provider receipt or receipt-based retry-deduplication guarantee is made."
          schema:
            type: string
            minLength: 1
            maxLength: 512
          example: 4d1f0a18-ec5e-4e97-8cf8-ff4edc8b2e31
      requestBody:
        required: true
        description: "Topic-specific WooCommerce product payload.

          Every topic requires `id`. For `product.created` and `product.updated`, `status: publish` captures an UPSERT and requires nonblank `name` and `permalink`; `status: trash`, `draft`, `pending`, or `private` captures a DELETE and requires only `id`. Missing or unsupported create/update statuses are authorized ignored events and require only `id`. `product.deleted` captures a DELETE and requires only `id`; its other fields are optional and ignored when absent.

          WooCommerce `description` and `short_description` are accepted but ignored on all topics. They do not populate Aura's canonical product description and are omitted from persisted `source_payload`; provider-receipt evidence digests use this sanitized payload. The webhook signature is still verified over the exact original request body bytes.

          When present on an event that maps to raw capture, WooCommerce `date_modified_gmt` is the source ordering timestamp. It accepts a no-offset GMT value interpreted as UTC, RFC3339 `Z`, or RFC3339 `+00:00`; malformed or nonzero-offset values return `400 BAD_BODY_VALUE` before submission. Valid timestamps are checked for conflicts only during consumer capture. `product.created` and `product.updated` events with missing or unsupported status are ignored only after capability and source authorization, then acknowledge `204` without parsing `date_modified_gmt` or constructing a provider receipt; a denied ignored event returns `403 FORBIDDEN`. An authorized ignored event persists no provider receipt even if a delivery ID is supplied. Omit it when source order is unavailable; an omitted timestamp provides no source-ordering guarantee.

          "
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/WoocommerceProductWebhookUpsertData"
                - $ref: "#/components/schemas/WoocommerceProductWebhookDeleteData"
            examples:
              created:
                summary: Product created webhook
                value:
                  id: 17
                  name: Test Produkt Titel
                  permalink: http://aura-historia-test.local/product/test-produkt-titel/
                  description: "<p>Hayde yallah test beschreibung</p>

                    "
                  short_description:
                    "<p>Hayde yallah kurze test beschreibung</p>

                    "
                  price: "42.69"
                  status: publish
                  stock_status: instock
                  images: []
              updated:
                summary: Product updated webhook
                value:
                  id: 17
                  name: Test Produkt Titel
                  permalink: http://aura-historia-test.local/product/test-produkt-titel/
                  description: "<p>Hayde yallah test beschreibung</p>

                    "
                  short_description:
                    "<p>Hayde yallah kurze test beschreibung</p>

                    "
                  price: "123.45"
                  status: publish
                  stock_status: instock
                  images: []
              deleted:
                summary: Product deleted webhook
                value:
                  id: 17
      responses:
        "204":
          description:
            "Webhook bearer/capability, source configuration, and exact-body signature are validated. Current partner/source grant authorization for mapped commands happens at consumer execution; ignored no-ops check it before response. A `204` acknowledges either an authorized ignored create/update status (no queue send or receipt) or matching confirmed acceptance of one `CAPTURE_RAW` command by the shared ProductListing FIFO. It does not confirm raw capture, provider receipt persistence, source-order checks, canonical normalization, or search visibility. Those decisions occur when the consumer executes the command. Ignored events do not parse `date_modified_gmt` or construct a provider receipt. When a delivery ID or source timestamp is omitted, no corresponding receipt or source-ordering guarantee is made. The backend returns no response body on success.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description:
            "Bad request — invalid or missing listing source ID, missing body, malformed JSON, unsupported

            WooCommerce topic, an invalid `date_modified_gmt` source timestamp (including a nonzero offset) for an event that maps to raw capture, or a missing field required by the selected capture operation.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_listing_source_id:
                  summary: Missing listing source ID path parameter
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_PATH_PARAMETER_VALUE
                    source:
                      field: listingSourceId
                      type: PATH
                    detail: Missing field 'listingSourceId'.
                invalid_listing_source_id:
                  summary: Invalid listing source ID format
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: listingSourceId
                      type: PATH
                    detail: must be a valid ListingSource ID
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
                missing_topic:
                  summary: WooCommerce topic header is missing
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-topic
                      type: HEADER
        "401":
          description:
            "Unauthorized — missing or invalid bearer credentials use `INVALID_CREDENTIALS`. A missing or invalid

            WooCommerce signature uses `BAD_HEADER_VALUE`.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                invalid_access_token:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                missing_signature:
                  summary: WooCommerce signature header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-signature
                      type: HEADER
                    detail: WooCommerce signature header is required.
                signature_mismatch:
                  summary: WooCommerce signature does not match the request body
                  value:
                    status: 401
                    title: Unauthorized
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-signature
                      type: HEADER
                    detail: WooCommerce signature is invalid.
        "403":
          description: Forbidden — the caller lacks the required ProductListing write capability or exact source partnership grant, including for ignored status events
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the specified listing source does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "413":
          description: Payload too large — the HTTP body limit or encoded SQS message limit was exceeded before confirmed admission. No queue acceptance is claimed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                body_limit:
                  value:
                    status: 413
                    title: Payload Too Large
                    error: BAD_BODY_VALUE
                encoded_message_limit:
                  value:
                    status: 413
                    title: Payload Too Large
                    error: PRODUCT_LISTING_INGESTION_PAYLOAD_TOO_LARGE
        "503":
          description: Service unavailable — authentication or source lookup is temporarily unavailable, or mapped command admission is rejected retryably, unconfirmed, or not attempted (including timeout). A send may already have succeeded when its acknowledgment was lost; retry unchanged. Uses `AUTH_TEMPORARILY_UNAVAILABLE`, `LISTING_SOURCE_TEMPORARILY_UNAVAILABLE`, or `PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                auth_temporarily_unavailable:
                  summary: Authentication is temporarily unavailable
                  value:
                    status: 503
                    title: Service Unavailable
                    error: AUTH_TEMPORARILY_UNAVAILABLE
                listing_source_temporarily_unavailable:
                  summary: ListingSource access is temporarily unavailable
                  value:
                    status: 503
                    title: Service Unavailable
                    error: LISTING_SOURCE_TEMPORARILY_UNAVAILABLE
                product_listing_temporarily_unavailable:
                  summary: ProductListing ingestion queue admission is unavailable or unconfirmed
                  value:
                    status: 503
                    title: Service Unavailable
                    error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error — authentication/source lookup or a non-retryable ingestion setup/encoding failure prevented confirmed admission. A failed response never proves an attempted send was not queued. Uses `AUTH_INTERNAL_ERROR`, `LISTING_SOURCE_INTERNAL_ERROR`, or `PRODUCT_LISTING_INTERNAL_ERROR`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                auth_internal_error:
                  summary: Authentication failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: AUTH_INTERNAL_ERROR
                listing_source_internal_error:
                  summary: ListingSource access failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: LISTING_SOURCE_INTERNAL_ERROR
                product_listing_internal_error:
                  summary: ProductListing ingestion admission failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: PRODUCT_LISTING_INTERNAL_ERROR
  /api/v1/webhooks/loops:
    post:
      summary: Apply a signed Loops preference webhook
      description: >-
        Accepts one Loops webhook signed over the exact received body bytes. No Aura/Cognito bearer is required;
        `webhook-id`, `webhook-timestamp`, and `webhook-signature` must form a valid, recent Loops proof. The
        request body is limited to 64 KiB. The currently supported `webhookSchemaVersion` is `1.0.0`. Supported
        `eventName` values are `contact.unsubscribed`, `contact.deleted`, `email.unsubscribed`,
        `contact.mailingList.subscribed`, `contact.mailingList.unsubscribed`, `email.resubscribed`,
        `email.hardBounced`, and `email.spamReported`. A verified unknown event name is receipted as ignored;
        malformed events and unsupported payload schema versions return an error for provider retry.

        `204` means the receipt and any local preference effects committed, or the authenticated delivery was an
        identical duplicate or a safely ignored event. It does not mean a marketing message was sent or delivered.
        Conflicting delivery identity returns `409`; temporary database/provider-reader failure or the 10-second
        processing budget returns retryable `503`. All responses are `no-store`.
      operationId: postLoopsPreferenceWebhook
      tags: [Newsletter]
      security: []
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Loops delivery identifier used for committed receipt deduplication.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix timestamp covered by the Loops signature; stale proofs are rejected.
          schema: { type: string, pattern: "^[0-9]{1,20}$" }
        - name: webhook-signature
          in: header
          required: true
          description: Loops HMAC-SHA256 signature over delivery ID, timestamp, and exact raw body bytes.
          schema: { type: string, maxLength: 8192 }
      requestBody:
        required: true
        description: Loops webhook payload. The service verifies the signature before parsing or mapping the selected event.
        content:
          application/json:
            schema:
              type: object
              required: [webhookSchemaVersion, eventName, eventTime]
              properties:
                webhookSchemaVersion: { type: string, example: "1.0.0" }
                eventName:
                  type: string
                  description: Supported event names are listed in the operation description; verified unknown names are ignored and receipted.
                eventTime:
                  {
                    type: integer,
                    format: int64,
                    description: Provider event time in Unix seconds.,
                  }
                contactIdentity:
                  type: object
                  description: Required for supported contact and email events; verified unknown event names may be safely ignored without it.
                  required: [id, email]
                  properties:
                    id: { type: string }
                    email: { type: string }
                mailingList:
                  type: object
                  description: Required for supported contact.mailingList events; only the configured marketing list affects consent.
                  required: [id]
                  properties:
                    id: { type: string }
              additionalProperties: true
            example:
              webhookSchemaVersion: "1.0.0"
              eventName: email.unsubscribed
              eventTime: 1791373200
              contactIdentity:
                id: contact_fixture
                email: person@example.test
      responses:
        "204":
          description: Authenticated event receipt and required local effects committed, or identical duplicate/safe ignore. No response body.
          headers:
            Cache-Control:
              schema: { type: string, example: "private, no-store" }
        "400":
          description: Malformed body/event, unsupported payload schema version, or invalid authenticated event time. Uses `LOOPS_WEBHOOK_INVALID_BODY`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                {
                  status: 400,
                  title: Bad Request,
                  error: LOOPS_WEBHOOK_INVALID_BODY,
                }
        "401":
          description: Missing, invalid, stale, or ambiguous Loops proof. The response does not distinguish authentication failures. Uses `LOOPS_WEBHOOK_UNAUTHORIZED`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                {
                  status: 401,
                  title: Unauthorized,
                  error: LOOPS_WEBHOOK_UNAUTHORIZED,
                }
        "409":
          description: A verified delivery identifier was previously committed with different body bytes. Uses `LOOPS_WEBHOOK_CONFLICT`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                { status: 409, title: Conflict, error: LOOPS_WEBHOOK_CONFLICT }
        "413":
          description: Request body exceeds 64 KiB. Uses `LOOPS_WEBHOOK_PAYLOAD_TOO_LARGE`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                {
                  status: 413,
                  title: Payload Too Large,
                  error: LOOPS_WEBHOOK_PAYLOAD_TOO_LARGE,
                }
        "500":
          description: Redacted internal signing-secret or cryptographic configuration failure. Uses `LOOPS_WEBHOOK_INTERNAL_ERROR`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                {
                  status: 500,
                  title: Internal Server Error,
                  error: LOOPS_WEBHOOK_INTERNAL_ERROR,
                }
        "503":
          description: Temporary persistence/provider-reader failure or exceeded processing budget. Retry the delivery. Uses `LOOPS_WEBHOOK_TEMPORARILY_UNAVAILABLE`.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                {
                  status: 503,
                  title: Service Unavailable,
                  error: LOOPS_WEBHOOK_TEMPORARILY_UNAVAILABLE,
                }
  /api/v1/product-listings/by-slug/{productListingTitleSlugId}:
    get:
      summary: Get a single product by title slug
      description: >-
        Retrieves an active ProductListing by its immutable Aura-owned
        `productListingTitleSlugId`, derived from its title. Withdrawn listings
        return `404 PRODUCT_LISTING_NOT_FOUND`; this endpoint never returns `410`.
        Anonymous successful 200 responses without Authorization use
        `public, max-age=0, s-maxage=120, stale-if-error=0`; any request with Authorization and all
        non-200 responses use `private, no-store`.
      operationId: getProductListingByTitleSlug
      tags:
        - ProductListings
      parameters:
        - name: productListingTitleSlugId
          in: path
          required: true
          description: Immutable Aura-owned public locator derived from the listing title
          schema:
            type: string
            minLength: 8
            maxLength: 120
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
            example: museum-cabinet-18-19-century-a1b2c3
        - name: language
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "401":
          description: Supplied bearer credentials are invalid (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The current authenticated user is suspended, deleted or not permitted (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: ProductListing found and returned successfully
          headers:
            Cache-Control:
              description: Anonymous edge freshness is 120 seconds; credential-bearing responses are private and not stored.
              schema: { type: string }
              example: public, max-age=0, s-maxage=120, stale-if-error=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
        "400":
          description: Invalid path or query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ProductListing not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Product detail temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/product-listings/{productListingId}:
    get:
      summary: Get a single product
      description:
        "Retrieves a single product by its `productListingId`. Withdrawn listings return
        `404 PRODUCT_LISTING_NOT_FOUND`; this endpoint never returns `410`.


        `pricing.source` preserves seller-supplied source amounts and currencies. `pricing.display` contains

        HalfUp-converted amounts in the requested currency, and `pricing.valuation` identifies the persisted

        snapshot used. A sold Product may have no main price; then display prices are omitted while its immutable

        `SALE` valuation remains present. Currency defaults to `EUR`.


        Anonymous responses use freshness caching only: no `ETag` or `Last-Modified` validator is emitted because

        current display pricing may change when the selected persisted FX snapshot changes. An anonymous successful
        200 response without Authorization uses `public, max-age=0, s-maxage=120, stale-if-error=0`; any request with Authorization and
        all non-200 responses use `private, no-store`.


        Responses always contain `item`, the product data. A valid user or delegated-user bearer token

        adds optional top-level `userState`; credential-bearing responses are not cached.

        "
      operationId: getProductListing
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique identifier of the ProductListing
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: language
          in: query
          required: false
          description:
            Requested current title and description language. Defaults to `en`; unavailable translations fall back
            to stored content.
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          description: Display currency. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "401":
          description: Supplied bearer credentials are invalid (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The current authenticated user is suspended, deleted or not permitted (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: ProductListing found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
          headers:
            Cache-Control:
              description: Anonymous edge freshness is 120 seconds; credential-bearing responses are private and not stored.
              schema: { type: string }
              example: public, max-age=0, s-maxage=120, stale-if-error=0
            Content-Language:
              description: The language of the returned content
              schema:
                $ref: "#/components/schemas/LanguageData"
              example: de
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: Bad request - invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ProductListing not found, including a withdrawn listing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
        "503":
          description: Product detail or notification state is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
  /api/v1/product-listings/{productListingId}/history:
    get:
      summary: Get ProductListing history
      description:
        "Retrieves immutable domain history for one ProductListing by `productListingId`.

        Each array item is one committed `PRODUCT_LISTING_DISCOVERED` or
        `PRODUCT_LISTING_CHANGED` event, ordered by occurrence time and event ID. A changed
        item contains a deterministic ordered `changes` array; it is never split into synthetic
        entries. Discovery exposes image count, never source image URLs.

        Price snapshots preserve stored source amounts and currencies. Sale observations retain
        their immutable source provenance. Without `currency`, the response is unchanged.
        With `currency`, each monetary discovery price/estimate and each previous/current price/estimate
        change value may include `display` with `currency`, `amount`, `fxRateId` and `capturedAt`.
        The snapshot is the latest persisted capture at or before this entry's `timestamp`, including
        an exact capture-time match. Both sides of a change use that entry's snapshot, even if the
        source currency changed. Conversion uses HalfUp rounding and the requested currency's minor-unit
        exponent (JPY and KRW: 0; all others: 2). Same-currency amounts retain the snapshot provenance.
        Missing snapshots or source/target quotes omit `display` for that value; the response still
        succeeds, and consumers fall back to the labelled source value. ON_REQUEST and null values
        receive no display projection. No later snapshot, current rates or provider calls are used.
        Source values, event order and the changes array remain intact. Currency query variants
        are included in the shared edge cache key.

        "
      operationId: getProductListingHistory
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique ProductListing identifier
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: currency
          in: query
          required: false
          description: Optional display currency for historical monetary values; omitted means source values only.
          schema:
            $ref: "#/components/schemas/CurrencyData"
      responses:
        "200":
          description: Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=300, stale-if-error=0`; any request with Authorization and all errors use `private, no-store`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=0, s-maxage=300, stale-if-error=0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductListingHistoryEntryData"
              examples:
                product_history:
                  summary: Example ProductListing history
                  value:
                    - eventType: PRODUCT_LISTING_DISCOVERED
                      productListingId: pl_5xdb465tg1enarx2knf04mxbxj
                      eventId: evt_7s35w34ftcew1r4cransc55rt4
                      payload:
                        listingSourceId: ls_6ckwc632p2e2q86nv92g9eyw9q
                        sourceListingId: source-6ba7b810
                        pricing:
                          price:
                            type: MONETARY
                            currency: EUR
                            amount: 3000
                        availability: AVAILABLE
                        url: https://listing-source.example/product-listings/6ba7b810
                        imageCount: 3
                        auction:
                          lotNumber: "42A"
                          cataloguePosition: 7
                          biddingOpens: "2026-09-01T08:00:00Z"
                          scheduledCloses: "2026-09-01T10:00:00Z"
                          reportedClosedAt: "2026-09-01T10:15:00Z"
                      timestamp: "2026-09-01T10:00:00Z"
                    - eventType: PRODUCT_LISTING_CHANGED
                      productListingId: pl_5xdb465tg1enarx2knf04mxbxj
                      eventId: evt_2mdmwstjvvfn3rmbakmarshhqg
                      payload:
                        changes:
                          - type: MAIN_PRICE_CHANGED
                            previous:
                              type: MONETARY
                              currency: EUR
                              amount: 3000
                            current:
                              type: MONETARY
                              currency: EUR
                              amount: 2999
                          - type: AVAILABILITY_CHANGED
                            previous: AVAILABLE
                            current: SOLD_OUT
                      timestamp: "2026-09-01T10:15:00Z"
                historical_display:
                  summary: A price change requested in RON, using the snapshot at the event timestamp
                  value:
                    - eventType: PRODUCT_LISTING_CHANGED
                      productListingId: pl_5xdb465tg1enarx2knf04mxbxj
                      eventId: evt_2mdmwstjvvfn3rmbakmarshhqg
                      payload:
                        changes:
                          - type: MAIN_PRICE_CHANGED
                            previous:
                              type: MONETARY
                              currency: EUR
                              amount: 3000
                              display:
                                currency: RON
                                amount: 15000
                                fxRateId: fx_0cwktgjtwnf4tb6hf2f8zm0x5k
                                capturedAt: "2026-09-01T10:00:00Z"
                            current:
                              type: MONETARY
                              currency: SEK
                              amount: 29999
                              display:
                                currency: RON
                                amount: 15000
                                fxRateId: fx_0cwktgjtwnf4tb6hf2f8zm0x5k
                                capturedAt: "2026-09-01T10:00:00Z"
                      timestamp: "2026-09-01T10:15:00Z"
        "400":
          description: Bad request - Invalid parameters, including unsupported currency (BAD_QUERY_PARAMETER_VALUE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
        "503":
          description: ProductListing history is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: ProductListing history contains invalid stored event/FX data or a price conversion overflowed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
  /api/v1/product-listings/{productListingId}/similar:
    get:
      summary: Get similar product-listings
      description:
        "Retrieves product-listings similar to the specified product using KNN search over text embeddings.

        When the product embedding is ready, the endpoint returns matching product-listings. If it is absent,

        the endpoint returns `202 Accepted` with a polling location.


        Ready entries return `displayPrice` in the requested currency and `priceValuation` metadata.

        Active ProductListings use one persisted snapshot pinned for the request; sold ProductListings use immutable

        sale-time values. Every ready entry contains `item`; a valid user or delegated-user bearer token adds

        `userState`. Ready anonymous 200 responses without Authorization use `public, max-age=0, s-maxage=300, stale-if-error=0`; any request with Authorization uses `private, no-store`. The `202 EmbeddingPending` response and all errors are always `private, no-store`.

        "
      operationId: getSimilarProductListings
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: language
          in: query
          required: false
          description: Language used for localized KNN result titles. Defaults to `en`.
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          description: Display currency for KNN result prices. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "401":
          description: Supplied bearer credentials are invalid (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The current authenticated user is suspended, deleted or not permitted (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shipping storage/transaction or permitted destination reads are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Ready anonymous responses without Authorization are shared for 300 seconds; credential-bearing responses are private and not stored.
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=0, s-maxage=300, stale-if-error=0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalizedProductListingSummaryData"
        "202":
          description: Product embedding is not available yet. Poll the Location URL for KNN results. This response is never cached and uses `private, no-store`.
          headers:
            Cache-Control:
              schema: { type: string }
              example: private, no-store
            Location:
              description: URL to poll for similar product-listings once the embedding is available
              schema:
                type: string
                format: uri
              example: /api/v1/product-listings/pl_5xdb465tg1enarx2knf04mxbxj/similar
        "400":
          description: Bad request - invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
                detail:
                  ProductListing with ListingSourceId 'ls_6rd827eqfefsva9teecmwa3ate' and SourceListingId '6ba7b810'
                  not found.
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
  /api/v1/product-listings:
    get:
      summary: Simple product search via query parameters
      description:
        "Performs canonical ProductListing search with query parameters. Text queries combine BM25 and embedding
        KNN retrieval when embedding generation succeeds; otherwise the backend falls back to BM25. Explicit non-score sorts
        use BM25. Any request with an Authorization header is private and not stored, including valid credentials that add
        user state. Anonymous successful 200 responses use `public, max-age=0, s-maxage=60, stale-if-error=0`; errors use `private, no-store`.
        Geographic predicates are AND; values in each country or subdivision set are OR.
        Missing geography never matches. Radius is inclusive in its supplied unit to the same recorded
        point used by distance ordering. Numeric origins never resolve from addresses/preferences.
        Distance ordering conflicts with sort and uses lexical
        text matching. Geographic responses are private, no-store and use eventually consistent
        OpenSearch projections; location updates can briefly lag in items, ordering, total and
        continuation. `language` defaults to `en` and `currency` defaults to `EUR`."
      operationId: simpleSearchProductListings
      tags:
        - ProductListings
      parameters:
        - name: shipping
          in: query
          style: deepObject
          explode: true
          description: Definite whole-country advertised shipping, independent of item geography and browsing preference. Nested country/service/charge predicates constrain indexed membership and totals, which may lag current returned terms. No shipping cost sorting or cart total is supported.
          schema: {$ref: '#/components/schemas/ShippingSearchData'}
        - name: geography
          in: query
          style: deepObject
          explode: true
          description: Advertised item geography; source defaults do not confirm individual physical custody.
          schema: {$ref: '#/components/schemas/GeographicSearchData'}
        - name: language
          in: query
          required: false
          description: Language used for search matching and localized response fields; defaults to `en`
          schema:
            $ref: "#/components/schemas/LanguageData"
          example: de
        - name: currency
          in: query
          required: false
          description:
            Currency used to select the indexed price field; defaults to `EUR`; no request-time currency conversion
            occurs
          schema:
            $ref: "#/components/schemas/CurrencyData"
          example: EUR
        - name: productQuery
          in: query
          required: false
          description: Optional text queries for product-listings. Multiple entries are ORed together.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              minLength: 1
          example:
            - test
            - example
        - name: enhancedSearchDescription
          in: query
          required: false
          description: Optional natural-language description used to refine matching.
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: excludeProductListingId
          in: query
          required: false
          description: Optional ProductListing IDs (strict `pl_` TypeIDs) to exclude from results and totals.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
          example:
            - pl_5xdb465tg1enarx2knf04mxbxj
        - name: listingSourceId
          in: query
          required: false
          description: Optional ListingSource IDs to include. A result must belong to one of the supplied sources.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: excludeListingSourceId
          in: query
          required: false
          description: Optional ListingSource IDs to exclude from results.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: auctionId
          in: query
          required: false
          description: Exact resolved Auction membership IDs. Repeat up to 100 distinct strict `auc_` TypeIDs; supplied IDs OR together and intersect all other filters. Listings without resolved membership do not match.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items:
              type: string
            uniqueItems: true
        - name: price
          in: query
          required: false
          description:
            "Optional price range filter in minor currency units (e.g. cents for most supported currencies, whole
            yen for JPY).

            Use `price[min]` and/or `price[max]` to specify the range bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: integer
                minimum: 0
                description: Minimum price (inclusive) in minor currency units for the selected indexed currency
                example: 1000
              max:
                type: integer
                minimum: 0
                description: Maximum price (inclusive) in minor currency units for the selected indexed currency
                example: 50000
        - name: availability
          in: query
          required: false
          description: Optional exact availability assertions. Values are ORed.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ListingAvailabilityData"
            uniqueItems: true
          example:
            - IN_STOCK
            - LIMITED_AVAILABILITY
        - name: created
          in: query
          required: false
          description:
            "Optional filter by product creation date range (RFC3339 format).

            Use `created[min]` and/or `created[max]` to specify the datetime bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum creation datetime (inclusive, RFC3339 format)
                example: "2024-01-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum creation datetime (inclusive, RFC3339 format)
                example: "2024-12-31T23:59:59Z"
        - name: updated
          in: query
          required: false
          description:
            "Optional filter by product last-updated date range (RFC3339 format).

            Use `updated[min]` and/or `updated[max]` to specify the datetime bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum last-updated datetime (inclusive, RFC3339 format)
                example: "2024-01-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum last-updated datetime (inclusive, RFC3339 format)
                example: "2024-12-31T23:59:59Z"
        - name: lotBiddingOpens
          in: query
          required: false
          description:
            "Optional exact lot-bidding-open range (RFC3339 instants).

            Use `lotBiddingOpens[min]` and/or `lotBiddingOpens[max]` for `[min, max)` bounds.

            Date-only and absent lot times never match this filter.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Inclusive minimum exact lot bidding-open instant (RFC3339)
                example: "2025-05-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Exclusive maximum exact lot bidding-open instant (RFC3339)
                example: "2025-05-31T23:59:59Z"
        - name: lotScheduledCloses
          in: query
          required: false
          description:
            "Optional exact lot-scheduled-close range (RFC3339 instants).

            Use `lotScheduledCloses[min]` and/or `lotScheduledCloses[max]` for `[min, max)` bounds.

            Date-only and absent lot times never match this filter.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Inclusive minimum exact lot scheduled-close instant (RFC3339)
                example: "2025-05-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Exclusive maximum exact lot scheduled-close instant (RFC3339)
                example: "2025-05-31T23:59:59Z"
        - name: sort
          in: query
          required: false
          description: Field to sort results by. Without `sort`, results are ordered by relevance score descending.
          schema:
            $ref: "#/components/schemas/SortProductListingFieldData"
          example: created
        - name: order
          in: query
          required: false
          description: Sort order. Requires `sort`; defaults to `desc` when `sort` is supplied without `order`.
          schema:
            type: string
            enum:
              - asc
              - desc
          example: desc
        - name: searchAfter
          in: query
          required: false
          description:
            "Opaque ProductListing cursor for pagination. Pass the complete JSON object returned as

            `searchAfter` in the previous response as one query value. It pins the FX snapshot

            for the full cursor chain. Keep the same search parameters. Malformed inner sort values

            or an incorrect number of sort values return `400 BAD_QUERY_PARAMETER_VALUE` with

            `source.field` set to `searchAfter`. Continuations retain their original ranking mode.

            If a semantic continuation cannot obtain an embedding, it returns

            `503 PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`; retry with the unchanged cursor.

            "
          schema:
            type: string
          example: '{"fxRateId":"fx_0cwktgjtwnf4tb6hf2f8zm0x5k","searchAfter":[2999,"pl_5xdb465tg1enarx2knf04mxbxj"]}'
        - name: size
          in: query
          required: false
          description: Number of product-listings to return per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 21
          example: 5
      security:
        - BearerAuth: []
        - {}
      responses:
        "401":
          description: Supplied bearer credentials are invalid (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The current authenticated user is suspended, deleted or not permitted (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Simple search results returned successfully
          headers:
            Cache-Control:
              description: Anonymous responses without Authorization are shared for 60 seconds; credential-bearing responses are private and not stored.
              schema:
                type: string
              example: public, max-age=0, s-maxage=60, stale-if-error=0
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListingSearchResultData"
        "400":
          description: Bad request - invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_query:
                  summary: Invalid query parameter payload
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                invalid_search_after:
                  summary: Malformed inner cursor sort values or incorrect sort value count
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: searchAfter
                      type: QUERY
                    detail: searchAfter contains invalid sort values or an incorrect number of sort values.
                invalid_sort_field:
                  summary: Invalid sort field
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_SORT_VALUE
                    source:
                      field: sort
                      type: QUERY
                    detail: "Expected any of: 'score', 'updated', 'created'. Got: 'invalid'"
                order_without_sort:
                  summary: Sort order supplied without sort field
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_SORT_VALUE
                    source:
                      field: sort
                      type: QUERY
                    detail: "'sort' is required when 'order' is supplied."
                invalid_order:
                  summary: Invalid sort order
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_ORDER_VALUE
                    source:
                      field: order
                      type: QUERY
                    detail: "Expected any of: 'asc', 'desc'. Got: 'invalid'"
        "503":
          description: Product search or required personalized state is temporarily unavailable
          content:
            application/problem+json:
              schema:
