  /api/v1/listing-sources/{listing_source_id}/shipping-profiles:
    get:
      summary: List source shipping profiles
      operationId: listShippingProfiles
      tags:
      - ListingSources
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      parameters:
      - name: listing_source_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 21
      - name: after
        in: query
        schema:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
      - name: objectKey
        in: query
        description: Exact stable object key belonging to the authenticated producer. Omit integrationMethod for SOURCE identity.
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
      - name: integrationMethod
        in: query
        description: Enabled provider method for objectKey lookup; requires objectKey.
        schema:
          type: string
          enum: [SHOPIFY, WOOCOMMERCE]
      description: Requires an unsuspended administrator or an active partnership member of the operator
        Party with the exact source grant. Delegated credentials also require listing-sources:read for reads,
        listing-sources:write for commands. All authority is revalidated in the transaction. Responses/errors
        are no-store. Terms are advertised arrangements, never authorized quotes. Active and retired summaries
        in ascending UUID order. Use the final shippingProfileId as after to continue; an empty page is
        terminal. objectKey filters by stable authenticated producer identity and returns zero or one summary, including retired or manually taken-over profiles. No terms or evidence hydration.
      responses:
        '200':
          description: Committed advertised shipping management result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingProfileSummaryData'
                maxItems: 100
                minItems: 0
        '400':
          $ref: '#/components/responses/ShippingManagementError400'
        '401':
          $ref: '#/components/responses/ShippingManagementError401'
        '403':
          $ref: '#/components/responses/ShippingManagementError403'
        '404':
          $ref: '#/components/responses/ShippingManagementError404'
        '409':
          $ref: '#/components/responses/ShippingManagementError409'
        '500':
          $ref: '#/components/responses/ShippingManagementError500'
        '503':
          $ref: '#/components/responses/ShippingManagementError503'
    post:
