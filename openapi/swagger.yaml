    ShippingImportObservationData:
      type: object
      additionalProperties: false
      description: Explicit successful new acquisition marker (empty object). Uses the parent acquiredAt,
        which cannot be in the future. Shipping assertions have no freshness or expiry deadline.
        Replays and ordinary writes without observation never advance observation time.
        Evidence-only corrections and lifecycle/removal commands cannot supply observation.
    ShippingImportWriteData:
      type: object
      additionalProperties: false
      required:
      - integration
      - sequence
      - acquiredAt
      - requestKey
      properties:
        acquiredAt:
          type: string
          format: date-time
          description: Successful acquisition time for every command, including removal/correction; must follow the latest source/integration authority change.
        integration:
          $ref: '#/components/schemas/ListingDeliveryIntegrationData'
        sequence:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        requestKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
        objectKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
          nullable: true
        observation:
          anyOf:
          - $ref: '#/components/schemas/ShippingImportObservationData'
          - type: object
            nullable: true
            enum:
            - null
      description: 'Optional import semantics on existing commands. objectKey is required only on profile creation;
        it identifies a stable source/producer/integration object independently of requestKey. sequence increases per
        touched component within the current source lifecycle; it is producer acquisition order, never receive time. Omitted observation
        does not renew observation time. Creation, changed normalized profile terms, changed default assignment and changed
        listing assertions and first claims of equal implicit selections require observation; explicit owned-component
        removals do not renew observation time. Acquisition ordering uses microsecond precision. Equal terms with observation explicitly refresh acquisition evidence without semantic
        revision changes. Exact requestKey replay returns current committed state without effects for 90 days; changed
        reuse conflicts permanently. Current source/grant/integration authority is rechecked even on replay. Imports
        cannot modify manually owned components. 409 codes: SHIPPING_IMPORT_AUTHORITY_STALE, SHIPPING_IMPORT_OWNERSHIP_CONFLICT,
        SHIPPING_IMPORT_REQUEST_CONFLICT, SHIPPING_IMPORT_OUT_OF_ORDER, SHIPPING_IMPORT_IDENTITY_EXISTS. Refetch and
        reconcile conflicts; never rebase an old payload onto the newest revision. Missing catalog listing is retryable
        404 SHIPPING_IMPORT_DEPENDENCY_MISSING; retain the record until catalog creation commits. No shipping write
        creates or restores catalog products.'
