                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
        "400":
          description: Bad request - invalid parameters or body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_product_id:
                  summary: Missing product ID
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_PATH_PARAMETER_VALUE
                    source:
                      field: productListingId
                      type: PATH
                invalid_object_id:
                  summary: Invalid product ID format
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: productListingId
                      type: PATH
                    detail: must be a valid ProductListing ID
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty
                invalid_body:
                  summary: Invalid request body format
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Invalid JSON format
                unsupported_presentation:
                  summary: Unsupported language or currency query value
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                null_state:
                  summary: State cannot be null
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body field 'state' must not be null.
        "401":
          description: Unauthorized - invalid or missing bearer credential
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Delegated credential lacks watchlist:write
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Watchlist entry or ProductListing not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                watchlist_entry_not_found:
                  value:
                    status: 404
                    title: Not Found
                    error: WATCHLIST_ENTRY_NOT_FOUND
                product_listing_not_found:
                  value:
                    status: 404
                    title: Not Found
                    error: PRODUCT_LISTING_NOT_FOUND
        "422":
          description: Unprocessable Entity - watchlist quota exceeded during reactivation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 422
                title: Unprocessable Content
                error: WATCHLIST_QUOTA_EXCEEDED
                detail:
                  Exceeded the maximum amount of watchlist entries. There are already 20/20 active watchlist entries
                  occupied.
        "409":
          description: Watchlist entry was changed concurrently, or a withdrawn ProductListing cannot be reactivated
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                concurrency_conflict:
                  value:
                    status: 409
                    title: Conflict
                    error: CONFLICT
                    detail: Watchlist entry was changed concurrently.
                product_listing_unavailable:
                  value:
                    status: 409
                    title: Conflict
                    error: PRODUCT_LISTING_UNAVAILABLE
        "503":
          description: Watchlist persistence, product details, pricing or shipping is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
