        `shipping`, return `SEARCH_FILTER_RESTRICTED_FEATURE` when added. Existing restricted criteria can be retained or
        cleared on inactive filters; activating a filter validates all its criteria against the current tier.

        - `PRO`: All search fields, including `geography` and `shipping`, are allowed except `enhancedSearchDescription`.

        - `ULTIMATE`: All filter fields are allowed.

        "
