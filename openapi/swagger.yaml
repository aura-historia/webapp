  /api/v1/admin/partnership-applications:
    get:
      summary: Search PartnershipApplications for administration
      description: |
        Delegated Aura access tokens require `partnership-applications:read`; missing scope returns `403 FORBIDDEN`.
        Searches PartnershipApplications for authenticated administrators.

        `state` and `proposalType` accept repeated exact canonical values. `applicantUserId`
        restricts the applicant. `listingSourceId` matches the approved ListingSource or an
        existing ListingSource proposed by the application. `created` and `updated` accept
        inclusive RFC3339 ranges using `min` and `max` query members.

        Results use deterministic keyset cursor pagination. The default sort is `created` descending;
        override it by providing both `sort` and `order`. Valid sort fields are `created` and `updated`;
        PartnershipApplication ID is always the final deterministic tie-breaker. Page sizes are clamped
        to 1–100, with a default of 21. The returned JSON `[timestamp, PartnershipApplication ID]` `searchAfter`
        cursor is omitted on the terminal page and must be sent with the same filters and sort.
        Results contain review-queue summary data only and never expose persistence version values.
        Responses always use `Cache-Control: no-store`.
      operationId: adminSearchPartnershipApplications
      tags:
        - PartnershipApplications
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: Repeated exact application state filters. Matching any supplied state is allowed.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PartnershipApplicationStateData"
          example:
            - SUBMITTED
            - IN_REVIEW
        - name: applicantUserId
          in: query
          required: false
          description: Optional applicant User ID filter.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        - name: proposalType
          in: query
          required: false
          description: Repeated exact proposal type filters. Matching any supplied type is allowed.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PartnershipProposalTypeData"
          example:
            - EXISTING_LISTING_SOURCE
        - name: listingSourceId
          in: query
          required: false
          description: Optional approved or existing-proposal ListingSource ID filter.
          schema:
            type: string
          example: ls_7h03ebvas3fhj9qb5pr5s22029
        - name: "created[min]"
          in: query
          required: false
          description: Optional inclusive lower bound for application creation time (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-01-01T00:00:00Z"
        - name: "created[max]"
          in: query
          required: false
          description: Optional inclusive upper bound for application creation time (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-12-31T23:59:59Z"
        - name: "updated[min]"
          in: query
          required: false
          description: Optional inclusive lower bound for application update time (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-01-01T00:00:00Z"
        - name: "updated[max]"
          in: query
          required: false
          description: Optional inclusive upper bound for application update time (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-12-31T23:59:59Z"
        - name: sort
          in: query
          required: false
          description: Sort field. Valid values are `created` and `updated`. The default is `created` descending.
          schema:
            type: string
            enum:
              - created
              - updated
          example: created
        - name: order
          in: query
          required: false
          description: Sort direction for `sort`. Provide both `sort` and `order` to override the default.
          schema:
            type: string
            enum:
              - asc
              - desc
          example: desc
        - name: searchAfter
          in: query
          required: false
          description: Opaque JSON-encoded `[timestamp, PartnershipApplication ID]` cursor returned by the previous page.
          schema:
            type: string
          example: '["2026-09-04T12:00:00Z","pa_0ckcsff4zne3qr4dsrvqk7fckd"]'
        - name: size
          in: query
          required: false
          description: Number of application summaries requested per page. The server clamps values to 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 21
          example: 21
      responses:
        "200":
          description: PartnershipApplication summaries returned successfully.
          headers:
            Cache-Control:
              description: Responses are never stored because administrator review data is returned.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartnershipApplicationCollectionData"
              example:
                items:
                  - id: pa_0ckcsff4zne3qr4dsrvqk7fckd
                    applicantUserId: usr_5pvhvpxyhve6ts31n9x8c2y513
                    state: SUBMITTED
                    proposal:
                      type: EXISTING_LISTING_SOURCE
                      listingSourceId: ls_7h03ebvas3fhj9qb5pr5s22029
                    approvedPartnershipId: null
