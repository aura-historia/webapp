        site:
          anyOf:
          - $ref: '#/components/schemas/ShippingSiteData'
          - type: object
            nullable: true
            enum:
            - null
        arrangement:
          anyOf:
          - $ref: '#/components/schemas/ShippingCollectionArrangementData'
          - type: object
            nullable: true
            enum:
            - null
    AdvertisedDeliveryTermsData:
      type: object
      additionalProperties: false
      required:
      - schema
      - shipping
      - collection
      properties:
        schema:
          type: string
          enum:
          - SHIP_TERMS_V1
        shipping:
          anyOf:
          - $ref: '#/components/schemas/ShippingPolicyData'
          - type: object
            nullable: true
            enum:
            - null
        collection:
          anyOf:
          - $ref: '#/components/schemas/ShippingCollectionData'
          - type: object
            nullable: true
            enum:
            - null
      description: Strict versioned advertised terms. All fields, including nullable fields, are required;
        unknown fields/codes are rejected. Absence, explicit prohibition and retirement have different meanings.
        This contract supplies no quote.
    ShippingProfileContentData:
      type: object
      additionalProperties: false
      required:
      - name
      - attributedPartyId
      - terms
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributedPartyId:
          type: string
          pattern: ^pty_[0-7][0-9a-hjkmnp-tv-z]{25}$
          nullable: true
        terms:
          $ref: '#/components/schemas/AdvertisedDeliveryTermsData'
    ShippingEvidenceInputData:
      type: object
      additionalProperties: false
      required:
      - reference
      - assertion
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 2048
        assertion:
          type: string
          minLength: 1
          maxLength: 255
      description: Protected provenance link; never fetched during writes, never grants authority. No buyer
        addresses. Excluded from responses, public indexes, signals and logs.
    CreateShippingProfileData:
      type: object
      additionalProperties: false
      required:
      - creationKey
      - content
      - evidence
      properties:
        import:
          $ref: '#/components/schemas/ShippingImportWriteData'
        creationKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-~]+$
        content:
          $ref: '#/components/schemas/ShippingProfileContentData'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ShippingEvidenceInputData'
          maxItems: 32
          minItems: 0
    ReplaceShippingProfileData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - content
      - evidence
      properties:
        import:
          $ref: '#/components/schemas/ShippingImportWriteData'
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        content:
          $ref: '#/components/schemas/ShippingProfileContentData'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ShippingEvidenceInputData'
          maxItems: 32
          minItems: 0
      description: Complete explicit replacement. Empty evidence corrects the current evidence set; prior
        protected evidence remains in history. Retired profiles require restoration before content or
        evidence correction.
    ShippingProfileLifecycleData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      properties:
        import:
          $ref: '#/components/schemas/ShippingImportWriteData'
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
    AssignShippingDefaultData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - shippingProfileId
      properties:
        import:
          $ref: '#/components/schemas/ShippingImportWriteData'
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
    ClearShippingDefaultData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      properties:
        import:
          $ref: '#/components/schemas/ShippingImportWriteData'
        expectedRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
    ShippingProfileSummaryData:
      type: object
      additionalProperties: false
      required:
      - shippingProfileId
      - listingSourceId
      - name
      - managementRevision
      - termsRevision
      - lifecycle
      properties:
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        name:
          type: string
        managementRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        termsRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
          - ACTIVE
          - RETIRED
    ShippingProfileData:
      type: object
      additionalProperties: false
      required:
      - shippingProfileId
      - listingSourceId
      - managementRevision
      - termsRevision
      - lifecycle
      - content
      properties:
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        managementRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        termsRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        content:
          $ref: '#/components/schemas/ShippingProfileContentData'
      description: Protected management detail; retains retired references and site assertions, excludes evidence.
        Never expose this DTO as public collection addresses.
    ShippingDefaultData:
      type: object
      additionalProperties: false
      required:
      - listingSourceId
      - revision
      - shippingProfileId
      - eligibility
      properties:
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        revision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
          nullable: true
        eligibility:
          type: string
          enum:
          - ACTIVE
          - RETIRED
          - MISSING
          - null
          nullable: true
      description: Initial absent state has revision 1. Clear retains an advancing revision tombstone; retirement
        retains the selected identity and ineligible status. No implicit fallback.
    AdminProductListingVersion:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
    UpdateAdminProductListing:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      description: Omission preserves. Monetary amounts are nonnegative minor units, at most 9223372036854775807. Null clears price, each estimate and availability. URL/images/whole auction cannot be null. Title/description and every field outside this whitelist are read-only.
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
        price:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AdminProductListingPrice" }]
        priceEstimateMin:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AdminProductListingMonetaryPrice" }]
        priceEstimateMax:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/AdminProductListingMonetaryPrice" }]
        availability:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ListingAvailabilityData" }]
        url: { type: string, format: uri, description: Value replaces; null rejected. }
        images:
          type: array
          description: Ordered replacement using existing normalized URL identity; empty array empties it. Null rejected.
          items: { type: string, format: uri }
        auction:
          $ref: "#/components/schemas/AdminProductListingAuctionPatch"
    AdminProductListingPrice:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, currency, amount]
          properties:
            type: { type: string, enum: [MONETARY] }
            currency: { $ref: "#/components/schemas/CurrencyData" }
            amount: { type: integer, minimum: 0, maximum: 9223372036854775807 }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, enum: [ON_REQUEST] }
    AdminProductListingMonetaryPrice:
      type: object
      additionalProperties: false
      required: [currency, amount]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyData" }
        amount: { type: integer, minimum: 0, maximum: 9223372036854775807 }
    AdminProductListingAuctionPatch:
      type: object
      additionalProperties: false
      description: Merge omitted lot facts. Null auctionId detaches membership only; an all-empty result normalizes to absence. Whole auction null is rejected. Auction must exist for this ListingSource.
      properties:
        auctionId: { type: string, nullable: true }
        lotNumber: { type: string, nullable: true, maxLength: 128, description: Nonblank and NUL-free after outer whitespace trimming; bounded to 128 UTF-8 bytes. }
        cataloguePosition: { type: integer, minimum: 1, maximum: 4294967295, nullable: true }
        timing:
          type: object
          nullable: true
          additionalProperties: false
          description: Omitted/null container preserves every instant; clear optional instants individually.
          properties:
            biddingOpens: { type: string, format: date-time, nullable: true }
            scheduledCloses: { type: string, format: date-time, nullable: true }
            reportedClosedAt: { type: string, format: date-time, nullable: true }
    AdminProductListingMutation:
      type: object
      required: [productListingId, expectedVersion, outcome]
      properties:
        productListingId: { type: string }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        outcome: { type: string, enum: [CHANGED, UNCHANGED] }
    AdminProductListingSummary:
      type: object
      required: [productListingId, productListingTitleSlugId, source, sourceListingId, title, price, priceEstimateMin, priceEstimateMax, availability, lifecycle, auctionId, expectedVersion, created, updated]
      properties:
        productListingId: { type: string }
        productListingTitleSlugId: { type: string, readOnly: true }
        source: { $ref: "#/components/schemas/ProductListingSourceData" }
        sourceListingId: { type: string, readOnly: true }
        title:
          nullable: true
          readOnly: true
          allOf: [{ $ref: "#/components/schemas/LocalizedTextData" }]
        price:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ProductListingPriceData" }]
        priceEstimateMin:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PriceData" }]
        priceEstimateMax:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PriceData" }]
        availability:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ListingAvailabilityData" }]
        lifecycle: { $ref: "#/components/schemas/ListingLifecycleData" }
        auctionId: { type: string, nullable: true }
        expectedVersion: { type: integer, format: int64, minimum: 1 }
        created: { type: string, format: date-time, readOnly: true }
        updated: { type: string, format: date-time, readOnly: true }
    AdminProductListingDetails:
      allOf:
        - $ref: "#/components/schemas/AdminProductListingSummary"
        - type: object
          required: [description, url, images, auction, saleObservation]
          properties:
            description:
              nullable: true
              readOnly: true
              allOf: [{ $ref: "#/components/schemas/LocalizedTextData" }]
            url: { type: string, format: uri }
            images:
              type: array
              description: Privileged canonical URLs. Preview respects sensitive/unassessed status; public visibility is unchanged.
              items: { type: string, format: uri }
            auction:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/AdminProductListingAuction" }]
            saleObservation:
              type: object
              nullable: true
              readOnly: true
              required: [observedAt, fxRateId]
              properties:
                observedAt: { type: string, format: date-time }
                fxRateId: { type: string }
    AdminProductListingAuction:
      type: object
      required: [auctionId, lotNumber, cataloguePosition, timing]
      properties:
        auctionId: { type: string, nullable: true }
        lotNumber: { type: string, nullable: true }
        cataloguePosition: { type: integer, minimum: 1, maximum: 4294967295, nullable: true }
        timing:
          type: object
          required: [biddingOpens, scheduledCloses, reportedClosedAt]
          properties:
            biddingOpens: { type: string, format: date-time, nullable: true }
            scheduledCloses: { type: string, format: date-time, nullable: true }
            reportedClosedAt: { type: string, format: date-time, nullable: true }
    AdminProductListingPage:
      type: object
      required: [items, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminProductListingSummary" } }
        size: { type: integer, minimum: 0, maximum: 100 }
        searchAfter: { type: string, description: Omitted on the final page. }
    ProductListingSummaryData:
      type: object
      description: Lightweight ProductListing summary for search and similar-listing results.
      required:
        - shipping
        - productListingId
        - eventId
        - source
        - sourceListingId
        - priceValuation
        - availability
        - lifecycle
        - url
        - viewUrl
        - images
        - updated
      properties:
        shipping:
          anyOf:
          - $ref: '#/components/schemas/AdvertisedListingShippingData'
          - type: object
            nullable: true
            enum:
            - null
        productListingId:
          type: string
        productListingTitleSlugId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
          description: Immutable Aura-owned public locator. Omitted when the listing is redacted as hidden.
          example: museum-cabinet-18-19-century-a1b2c3
        eventId:
          type: string
        source:
          $ref: "#/components/schemas/ProductListingSourceData"
        sourceListingId:
          type: string
        auctionId:
          type: string
          description: Indexed Auction TypeID association. Omitted when this listing has no Auction association; search and similar results do not hydrate current Auction metadata.

        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        displayPrice:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
        priceValuation:
          $ref: "#/components/schemas/ProductListingSummaryPriceValuationData"
        availability:
          anyOf:
          - $ref: '#/components/schemas/ListingAvailabilityData'
          - type: object
            nullable: true
            enum:
            - null
        lifecycle:
          $ref: "#/components/schemas/ListingLifecycleData"
        url:
          type: string
          format: uri
        viewUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductListingImageData"
        contentPolicy:
          anyOf:
          - $ref: '#/components/schemas/ContentPolicyData'
          - type: object
            nullable: true
            enum:
            - null
        updated:
          type: string
          format: date-time
          description: Time of the last committed change to listing-owned state, including enrichment (translations, embedding, geography, shipping summary, content assessment and delivery evidence). Strictly increasing per listing, with each new value at millisecond precision; FX changes and response-time composition do not advance it.
        geography:
          description: Advertised inventory geography on geographic search summaries; selected by the backend from eligible source evidence.
          allOf: [{$ref: '#/components/schemas/ListingGeographyData'}]
    ProductListingSummaryPriceValuationData:
      oneOf:
        - type: object
