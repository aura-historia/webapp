  /api/v1/me/watchlist:
    get:
      summary: List user's watchlist product-listings
      description:
        "Retrieves all product-listings in the authenticated user's watchlist in watchlist creation order.

        Each result contains current product data and complete user-specific state.

        Accepts Cognito JWT authentication or an Aura Historia access token with `watchlist:read`.

        "
      operationId: getWatchlistProductListings
      tags:
        - Watchlist
      parameters:
        - name: language
          in: query
          required: false
          description: Preferred language for localized content. Defaults to `en` when omitted.
          schema:
            $ref: "#/components/schemas/LanguageData"
          example: de
        - name: currency
          in: query
          required: false
          description: Display currency. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
        - name: size
          in: query
          required: false
          description: ProductListings per page. Defaults to 21; values are clamped to 1..100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 21
        - name: searchAfter
          in: query
          required: false
          description: "JSON array cursor returned by the preceding page: [RFC3339 timestamp, ProductListing ID]."
          schema:
            type: string
