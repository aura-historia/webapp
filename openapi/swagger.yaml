        "401":
          {
            description: Missing or invalid credentials (`INVALID_CREDENTIALS`).,
          }
        "403": { description: Administrator authority required (`FORBIDDEN`). }
        "404":
          { description: ListingSource missing (`LISTING_SOURCE_NOT_FOUND`). }
        "409":
          {
            description: The ListingSource/sourceAuctionId key already exists (`CONFLICT`).,
