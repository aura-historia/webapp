  /api/v1/listing-sources/{listingSourceId}/product-listings:
    get:
      summary: List ProductListings for an administered ListingSource
      operationId: listPartnerProductListings
      description: >-
        An authenticated partner with an active Partnership grant for the path ListingSource is required; delegated Aura tokens additionally require `product-listings:read`. Cognito partners need no delegated scope. Administrator role alone does not grant access. Source authorization precedes reads or mutations; a listing outside the authorized source returns the same not-found result as a missing listing. Success and all errors use `private, no-store`. Original source values include retained withdrawn listings and do not depend on OpenSearch or enrichment readiness.
        Live keyset pagination includes both lifecycle states by default. Source-local identity alone is not globally unique. Text query is bounded literal matching over original title/source-local ID; no total count is returned. Cursors are bound to normalized filters and sort/order, with listing ID breaking timestamp ties.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - { name: listingSourceId, in: path, required: true, schema: { type: string }, description: Strict ListingSource TypeID authorized by Partnership grant. }
        - { name: sourceListingId, in: query, schema: { type: string, maxLength: 512 }, description: Exact case-sensitive source-local identity after outer whitespace trimming. }
        - { name: lifecycle, in: query, schema: { $ref: "#/components/schemas/ListingLifecycleData" } }
        - { name: availability, in: query, schema: { $ref: "#/components/schemas/ListingAvailabilityData" } }
        - { name: auctionId, in: query, schema: { type: string }, description: Strict Auction TypeID. }
        - { name: query, in: query, schema: { type: string, maxLength: 512 }, description: At most 512 UTF-8 bytes and NUL-free; outer whitespace and case normalized. Percent/underscore are literal. }
        - { name: sort, in: query, schema: { type: string, enum: [created, updated], default: updated } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: size, in: query, schema: { type: integer, default: 21 }, description: Clamped to 1–100. }
        - { name: searchAfter, in: query, schema: { type: string }, description: Opaque cursor returned by this normalized filter/sort scope. }
      responses:
        "200":
          description: Lightweight summary page; Cache-Control is private, no-store.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingPage" } } }
        "400":
          description: Invalid ID, directory query or scoped cursor (`BAD_QUERY_PARAMETER_VALUE`, `INVALID_OBJECT_ID`).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Partnership source grant or delegated capability missing (`FORBIDDEN`).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    post:
      summary: Batch create product-listings (Partner API)
      description:
        "Creates one or more product-listings for a listing source using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        Aura Historia access tokens on this endpoint must include the `product-listings:write` scope.

        The caller must be a user with an active Partnership grant for the path ListingSource; administrator role alone
        does not grant access. Administrators use the separate `/api/v1/admin/product-listings` operations.
        Partnership and scope checks run per entry, so an authenticated empty array returns `[]` without them.


        The request body is an array of `CreateProductListingData` objects. Each entry is created

        synchronously in its own PostgreSQL transaction.

        Localized `title` and `description` are optional. Omit or send `null` when the source has no value to record.


        The response returns HTTP 200 with failures as `{ listingSourceId, sourceListingId, error }` objects when

        one or more entries succeed. `error` is the stable API error key for that entry. If every non-empty entry fails, the
        first failure is returned

        as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: postPartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product-listings to create synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/CreateProductListingData"
            example:
              - sourceListingId: baroque-violin-001
                title:
                  text: Baroque Violin
                  language: en
                description:
                  text: A beautiful 18th-century baroque violin in excellent condition.
                  language: en
                price:
                  currency: EUR
                  amount: 4500
                availability: IN_STOCK
                url: https://my-listing-source.com/product-listings/baroque-violin
                images:
                  - https://my-listing-source.com/images/violin-1.jpg
                  - https://my-listing-source.com/images/violin-2.jpg
      responses:
        "200":
          description:
            "Batch create completed synchronously. This response is returned when all entries

            succeed or when at least one entry succeeds; it lists only failed entries.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProductListingBatchFailuresResponse"
              examples:
                all_succeeded:
                  summary: All product-listings were created
                  value: []
                partial_failure:
                  summary: Some product-listings failed while at least one product was created
                  value:
                    - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
                      sourceListingId: baroque-violin-002
                      error: CONFLICT
        "400":
          description:
            Bad request (`BAD_BODY_VALUE`) — the body is missing, empty, invalid JSON or violates the batch contract,
            or every entry failed and the first failure was an invalid product-listing write.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
        "401":
          description:
            "Unauthorized — the bearer token is missing, invalid, expired, or the referenced

            Aura Historia access token no longer exists.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                access_token_not_found:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: ACCESS_TOKEN_NOT_FOUND
        "403":
          description:
            Forbidden — the caller has no Partnership grant for this listing source (administrator role alone is
            insufficient), or the access token lacks `product-listings:write`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the listing source (`LISTING_SOURCE_NOT_FOUND`) or the referenced Auction (`AUCTION_NOT_FOUND`) does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "409":
          description: Conflict — the first failed entry's source listing key already exists for this listing source, or its Auction belongs to another listing source (`CONFLICT`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 409
                title: Conflict
                error: CONFLICT
        "503":
          description:
            Service unavailable — the first failure was temporary (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE` or
            `AUCTION_TEMPORARILY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
    patch:
      summary: Batch update product-listings (Partner API)
      description:
        "Updates one or more existing product-listings for a listing source using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        Aura Historia access tokens on this endpoint must include the `product-listings:write` scope.

        The caller must be a user with an active Partnership grant for the path ListingSource; administrator role alone
        does not grant access. Administrators use the separate `/api/v1/admin/product-listings` operations.
        Partnership and scope checks run per entry, so an authenticated empty array returns `[]` without them.


        The request body is an array of `UpdateProductListingData` objects. Omitted fields are unchanged;

        `null` clears availability and price. Omit `auction` to preserve its context; `auction: null`, `url: null`,

        and `images: null` return `400 BAD_BODY_VALUE`; send `[]` to remove all images. Within an asserted `auction`,

        omit a leaf to preserve it, send `null` to clear a clearable lot/timing leaf, or send a value to set it.

        `auction.auctionId` must name an existing Auction for this ListingSource. Omit it to preserve membership, send

        `null` to clear membership, or send an ID to set it. The complete batch contract is

        validated before any entry is applied synchronously in its own PostgreSQL transaction.


        The response returns HTTP 200 with failures as `{ listingSourceId, sourceListingId, error }` objects when

        one or more entries succeed. `error` is the stable API error key for that entry. If every non-empty entry fails, the
        first failure is returned

        as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: patchPartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product updates to apply synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/UpdateProductListingData"
            example:
              - sourceListingId: baroque-violin-001
                availability: null
              - sourceListingId: baroque-violin-002
                price:
                  currency: EUR
                  amount: 5000
                availability: IN_STOCK
      responses:
