      operationId: createShippingProfile
      tags:
      - ListingSources
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      parameters:
      - name: listing_source_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
      description: Requires an unsuspended administrator or an active partnership member of the operator
        Party with the exact source grant. Delegated credentials also require listing-sources:read for reads,
        listing-sources:write for commands. All authority is revalidated in the transaction. Responses/errors
        are no-store. Terms are advertised arrangements, never authorized quotes. Creation key is scoped
        to source and caller identity; matching original content/evidence returns the current profile without
        effects, differing content conflicts. Creation never selects a source default.
      responses:
        '200':
          description: Committed advertised shipping management result.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
