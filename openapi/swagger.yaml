          allOf:
          - $ref: '#/components/schemas/PartyLocationGeography'
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/PartyLocationPosition'
          nullable: true
    UserAddressResolution:
      type: object
      additionalProperties: false
      description: Current backend geocoding state, returned with address CRUD/list reads. A unique compatible premises result can supply a point
        automatically. Coarse results can supply administrative geography only. Expired or revoked evidence is UNAVAILABLE and suppressed. This is
        browsing enrichment, not address or delivery verification.
      required:
      - status
      - derived
      - attribution
      properties:
        status:
          type: string
          enum:
          - PENDING
          - ACCEPTED
          - AMBIGUOUS
          - NO_MATCH
          - FAILED
          - BLOCKED
          - UNAVAILABLE
        derived:
          allOf:
          - $ref: '#/components/schemas/UserAddressDerivedGeography'
          nullable: true
        attribution:
          allOf:
          - $ref: '#/components/schemas/UserAddressAttribution'
          nullable: true
    UserAddressAttribution:
      type: object
      additionalProperties: false
      required:
      - provider
      - attributionUrl
      description: Display the attribution when showing accepted provider-derived geography.
      properties:
        provider:
          type: string
        attributionUrl:
          type: string
          format: uri
    SourceLocationDefaultEvidence:
      type: object
      additionalProperties: false
      required:
      - reference
      - scope
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 2048
          description: Nonblank opaque source-scoped observation, at most 2048 UTF-8 bytes,
            without control or line-separator characters. Never fetched.
        scope:
          type: string
          enum:
          - ASSOCIATED_BUSINESS
          - ADVERTISED_INVENTORY
    SourceLocationDefaultAssignment:
      type: object
      additionalProperties: false
      required:
      - partyLocationId
      properties:
        partyLocationId:
          $ref: '#/components/schemas/PartyLocationId'
        businessAssociation:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Explicit associated-business evidence; scope must be ASSOCIATED_BUSINESS.
        advertisedInventory:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Explicit inventory evidence; scope must be ADVERTISED_INVENTORY.
            Business, legal or correspondence evidence alone never establishes this meaning.
    SourceLocationDefaultData:
      type: object
      additionalProperties: false
      required:
      - listingSourceId
      - revision
      - assignment
      - eligibility
      properties:
        listingSourceId:
          type: string
          pattern: ^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Expected source-default revision; an untouched source has revision
            1. Stale writes conflict, including no-ops.
        assignment:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultAssignment'
          nullable: true
        eligibility:
          type: string
          enum:
          - ACTIVE
          - RETIRED
          nullable: true
          description: Current eligibility of the retained reference, null if no assignment.
            Retirement preserves the reference but disables inherited geography.
    AssignSourceLocationDefaultData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - partyLocationId
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Expected source-default revision; an untouched source has revision
            1. Stale writes conflict, including no-ops.
        partyLocationId:
          $ref: '#/components/schemas/PartyLocationId'
        businessAssociation:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Explicit associated-business evidence; scope must be ASSOCIATED_BUSINESS.
        advertisedInventory:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Explicit inventory evidence; scope must be ADVERTISED_INVENTORY.
            Business, legal or correspondence evidence alone never establishes this meaning.
      description: Replaces the one reference and both applicability meanings atomically.
        Omitted/null evidence means absent, including on replacement. No automatic location
        selection.
    ChangeSourceLocationDefaultApplicabilityData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Expected source-default revision; an untouched source has revision
            1. Stale writes conflict, including no-ops.
        businessAssociation:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Omitted retains the assertion; null removes it; set requires ASSOCIATED_BUSINESS
            scope.
        advertisedInventory:
          allOf:
          - $ref: '#/components/schemas/SourceLocationDefaultEvidence'
          nullable: true
          description: Omitted retains the assertion; null removes it; set requires ADVERTISED_INVENTORY
            scope.
      description: Changes applicability on the existing, active reference without changing
        its location ID.
    ClearSourceLocationDefaultData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Expected source-default revision; an untouched source has revision
            1. Stale writes conflict, including no-ops.
    PartyLocationId:
      type: string
      pattern: ^ploc_[0-7][0-9a-hjkmnp-tv-z]{25}$
      description: Strict UUIDv7 PartyLocation TypeID; bare UUIDs and foreign prefixes are rejected.
    PartyLocationGeography:
      type: object
      additionalProperties: false
      required:
      - referenceRelease
      properties:
        referenceRelease:
          type: string
          enum:
          - iso-codes-4.20.1
        addressText:
          type: string
          maxLength: 4096
          description: Verbatim free-text assertion; at most 4096 UTF-8 bytes. No geocoding or postal inference.
          nullable: true
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: Exact current ISO alpha-2 country in the named immutable release.
          nullable: true
        subdivision:
          type: string
          description: Complete ISO 3166-2 code in the named release; must agree with country when supplied.
          nullable: true
        postalCode:
          type: string
          maxLength: 64
          description: Single-line verbatim postal assertion, at most 64 UTF-8 bytes.
          nullable: true
      description: Partial caller assertions. At least one geographic field must be present and nonblank. Coordinates
        are separate. No synchronous geocoding.
    PartyLocationPosition:
      type: object
      additionalProperties: false
      required:
      - latitudeDegrees
      - longitudeDegrees
      - precision
      properties:
        latitudeDegrees:
          type: number
          minimum: -90
          maximum: 90
        longitudeDegrees:
          type: number
          minimum: -180
          maximum: 180
        precision:
          type: string
          enum:
          - PREMISES
          - STREET
          - LOCALITY
          - REPRESENTATIVE
        accuracyMetres:
          type: number
          minimum: 0
          nullable: true
      description: Finite caller-asserted WGS84 coordinates with explicit precision. Not geocoder-derived evidence;
        (0,0) is valid.
    PartyLocationEvidence:
      type: object
      additionalProperties: false
      required:
      - reference
      - scope
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 2048
          description: Opaque nonblank single-line evidence/source reference; never fetched. At most 2048 UTF-8 bytes.
        observedAt:
          type: string
          format: date-time
          nullable: true
        scope:
          type: string
          enum:
          - SITE_DESCRIPTION
          - REGISTERED_ADDRESS
          - CORRESPONDENCE_ADDRESS
          description: Declared assertion scope; never caller identity, authorization or trust.
    ExpectedPartyLocation:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      properties:
        id:
          $ref: '#/components/schemas/PartyLocationId'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
    CreatePartyLocationData:
      type: object
      additionalProperties: false
      required:
      - label
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed nonblank single-line label, at most 255 UTF-8 bytes. Never establishes site identity.
        roles:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - BUSINESS_PREMISES
            - WAREHOUSE
            - REGISTERED_ADDRESS
            - CORRESPONDENCE
          description: Business use of a site. No assertion about listing stock, dispatch or pickup.
          default: []
        geography:
          allOf:
          - $ref: '#/components/schemas/PartyLocationGeography'
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/PartyLocationPosition'
          nullable: true
        evidence:
          allOf:
          - $ref: '#/components/schemas/PartyLocationEvidence'
          nullable: true
        relocates:
          allOf:
          - $ref: '#/components/schemas/ExpectedPartyLocation'
          nullable: true
      description: Create an independently identified site with exact public geography. Optional relocates creates a new identity and retires the
        referenced active site atomically; its Party and revision must match.
    CorrectPartyLocationData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - correction
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed nonblank single-line label, at most 255 UTF-8 bytes. Never establishes site identity.
        roles:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - BUSINESS_PREMISES
            - WAREHOUSE
            - REGISTERED_ADDRESS
            - CORRESPONDENCE
          description: Business use of a site. No assertion about listing stock, dispatch or pickup.
        geography:
          allOf:
          - $ref: '#/components/schemas/PartyLocationGeography'
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/PartyLocationPosition'
          nullable: true
        evidence:
          allOf:
          - $ref: '#/components/schemas/PartyLocationEvidence'
          nullable: true
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        correction:
          type: string
          enum:
          - SAME_SITE
      description: Same physical site correction only. Omitted members remain unchanged. Geography/position/evidence
        null clears; non-null geographic objects replace the complete partial assertion. Label and roles
        reject null. Roles [] clears the set. No-op at the current revision emits no change signal. Relocation uses
        create with relocates.
    SetPartyLocationLifecycleData:
      type: object
      additionalProperties: false
      required:
      - expectedRevision
      - lifecycle
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
          - ACTIVE
          - RETIRED
      description: Explicit retirement (RETIRED) or restore (ACTIVE), with CAS. Retains references/history and never
        auto-selects replacements.
    PartyLocationData:
      type: object
      additionalProperties: false
      required:
      - id
      - partyId
      - label
      - roles
      - lifecycle
      - revision
      - inputRevision
      properties:
        id:
          $ref: '#/components/schemas/PartyLocationId'
        partyId:
          type: string
          pattern: ^pty_
        label:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed nonblank single-line label, at most 255 UTF-8 bytes. Never establishes site identity.
        roles:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - BUSINESS_PREMISES
            - WAREHOUSE
            - REGISTERED_ADDRESS
            - CORRESPONDENCE
          description: Business use of a site. No assertion about listing stock, dispatch or pickup.
        geography:
          $ref: '#/components/schemas/PartyLocationGeography'
        position:
          $ref: '#/components/schemas/PartyLocationPosition'
        lifecycle:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        inputRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        evidence:
          $ref: '#/components/schemas/PartyLocationEvidence'
    PartyLocationsPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartyLocationData'
        next:
          allOf:
          - $ref: '#/components/schemas/PartyLocationId'
          nullable: true
          description: Last returned ID when another row exists; supply as after. Null when exhausted.
    PartyLocationManagersPage:
      type: object
      additionalProperties: false
      required: [items, size]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PartyLocationManagerData'
        size:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of returned users.
        searchAfter:
          type: string
          pattern: ^usr_
          description: Last returned User TypeID, omitted on the terminal page.
    PartyLocationManagerData:
      type: object
      additionalProperties: false
      required: [userId, email, access]
      properties:
        userId:
          type: string
          pattern: ^usr_
        email:
          type: string
          format: email
        firstName:
          type: string
          maxLength: 64
        lastName:
          type: string
          maxLength: 64
        access:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          description: Independent reasons, EXPLICIT before PARTNERSHIP when both exist.
          items:
            oneOf:
            - $ref: '#/components/schemas/PartyLocationManagerExplicitAccess'
            - $ref: '#/components/schemas/PartyLocationManagerPartnershipAccess'
            discriminator:
              propertyName: type
              mapping:
                EXPLICIT: '#/components/schemas/PartyLocationManagerExplicitAccess'
                PARTNERSHIP: '#/components/schemas/PartyLocationManagerPartnershipAccess'
    PartyLocationManagerExplicitAccess:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [EXPLICIT]
    PartyLocationManagerPartnershipAccess:
      type: object
      additionalProperties: false
      required: [type, partnershipIds]
      properties:
        type:
          type: string
          enum: [PARTNERSHIP]
        partnershipIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Active Partnerships for this Party, ordered by underlying UUID ascending.
          items:
            type: string
            pattern: ^psh_
    PartyLocationManagementGrantData:
      type: object
      additionalProperties: false
      required:
      - granted
      properties:
        granted:
          type: boolean
          description: true grants explicit management/private reads; false removes only the explicit grant. Active partnership membership independently authorizes access. Same-state commands are no-ops.
    GeographicOriginData:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      description: Explicit finite numeric WGS 84 coordinates in degrees; no text, address or preference resolution.
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    GeographicRadiusData:
      type: object
      additionalProperties: false
      required: [amount, unit]
      description: >-
        Finite positive radius in the supplied unit, equivalent to at most 20000 kilometres.
        The supplied amount and unit are preserved in private saved-filter snapshots.
      properties:
        amount: {type: number, minimum: 0, exclusiveMinimum: true, example: 25}
        unit:
          type: string
          enum: [KILOMETERS, MILES, METERS, YARDS, FEET, INCHES, CENTIMETERS, MILLIMETERS, NAUTICAL_MILES]
          example: KILOMETERS
      example: {amount: 25, unit: KILOMETERS}
    ShippingSearchData:
      type: object
      additionalProperties: false
      description: >-
        AND predicates over the supported definite whole-country projection. Country, service,
        currency and per-item amount must belong to one offer. Fixed and explicitly denominated
        free PER_ITEM rates support an inclusive maximum; free is zero. FROM, estimated, external,
        requested, absent and differently based prices cannot satisfy a maximum. Postal/variant/cart
        uncertainty cannot become a definite country match. Missing offers do not mean unavailable
        or collection-only. No query changes the browsing preference; returned shipping still uses
        current PostgreSQL authority. Omitted destination selects no country. NONE alone disables
        shipping filtering (clears it in PATCH); otherwise a country or collectionOffered=true is
        required. Service and maximum require a country. Shipping observation age imposes no expiry.
      properties:
        destination:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, country]
              properties:
                kind: {type: string, enum: [COUNTRY]}
                country: {type: string, pattern: '^[A-Z]{2}$', description: Current ISO 3166-1 alpha-2 country in the pinned release.}
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: {type: string, enum: [NONE]}
        referenceRelease:
          type: string
          enum: [iso-codes-4.20.1]
          default: iso-codes-4.20.1
        interpretation:
          type: string
          enum: [WHOLE_COUNTRY_PER_ITEM_V1, WHOLE_COUNTRY_PER_ITEM_FX_V1]
          default: WHOLE_COUNTRY_PER_ITEM_V1
          description: Default compares advertised source currency. FX_V1 requires maximumPerItem and compares HalfUp converted amounts in its target currency using the persisted browsing snapshot, pinned across continuation.
        service:
          type: string
          minLength: 1
          maxLength: 128
          description: Exact advertised service code; requires a destination country.
        maximumPerItem:
          type: object
          additionalProperties: false
          required: [amount, currency]
          description: Inclusive per-item charge in minor units. Currency is the advertised source currency by default, or the explicit target under FX_V1, independently of browsing display currency. Only fixed/known-currency free per-item offers match. No purchase quantity or complete landed cost is implied.
          properties:
            amount: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, description: Inclusive maximum in minor units.}
            currency: {$ref: '#/components/schemas/CurrencyData'}
        collectionOffered:
          type: boolean
          default: false
          description: True requires independently definite offered collection. False adds no collection constraint.
    AcceptShippingDestinationData:
      description: >-
        Explicit create/PATCH acceptance guard. The authored search.shipping destination country
        must equal the authorized owned address or selected preference's submitted country (or
        subdivision country). No selection, missing asserted country or mismatch is BAD_BODY_VALUE.
        Ownership/current-account rules apply; delegated callers additionally require users:read.
        Only the country value/reference/interpretation is saved; postal, street, provider evidence
        and mutable references are discarded. Later address/preference edits or deletion never move
        a saved predicate. Omission accepts the authored country directly. No preference is changed.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, addressId]
          properties:
            kind: {type: string, enum: [ADDRESS]}
            addressId: {$ref: '#/components/schemas/UserAddressId'}
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, enum: [PREFERENCE]}
    GeographicSearchData:
      type: object
      additionalProperties: false
      description: >-
        At least one country, subdivision, radius or distance order is required. Sets are OR;
        distinct geographic predicates are AND. Subdivisions must belong to a supplied country
        when countries is nonempty. Absence excludes a result. Radius and ordering require an
        explicit numeric origin; an origin or approximate mode without proximity is invalid.
        Strict proximity admits PREMISES only; approximate also admits STREET, LOCALITY and
        REPRESENTATIVE. Distance ordering is incompatible
        with the existing sort. Saved filters retain a private immutable snapshot until replaced.
      properties:
        countries:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, pattern: '^[A-Z]{2}$'}
          example: [DE]
        subdivisions:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string}
          example: [DE-BY]
        origin: {$ref: '#/components/schemas/GeographicOriginData'}
        radius: {$ref: '#/components/schemas/GeographicRadiusData'}
        mode: {type: string, enum: [STRICT, APPROXIMATE], default: STRICT}
        distanceOrder: {type: string, enum: [ASC, DESC]}
    ListingGeographyData:
      type: object
      required: [locationId, basis, referenceRelease]
      description: >-
        Public advertised-inventory geography selected by the backend. Distance is to recorded
        evidence, not verified object position or journey distance. Display is rounded to
        0.1 km for premises, 1 km for street and 10 km for locality/representative evidence.
      properties:
        locationId: {type: string}
        basis: {type: string, enum: [SOURCE_DEFAULT_DERIVED]}
        referenceRelease: {type: string}
        country: {type: string}
        subdivision: {type: string}
        point: {$ref: '#/components/schemas/GeographicOriginData'}
        precision: {type: string, enum: [PREMISES, STREET, LOCALITY, REPRESENTATIVE]}
        distanceKm: {type: number, minimum: 0}
    PartyLocationDiscoveryCursorData:
      type: object
      additionalProperties: false
      required: [locationId]
      description: Repeat with the same query. distanceKm is required exactly when ordering by distance; it is an unrounded continuation value.
      properties:
        locationId: {type: string}
        distanceKm: {type: number, minimum: 0}
    PublicPartyLocationData:
      type: object
      required: [partyId, partyName, locationId, label, basis]
      properties:
        partyId: {type: string}
        partyName: {type: string}
        locationId: {type: string}
        label: {type: string}
        basis: {type: string, enum: [CALLER_ASSERTED, ACCEPTED_DERIVED, MIXED_ASSERTED_AND_DERIVED]}
        country: {type: string}
        subdivision: {type: string}
        point: {$ref: '#/components/schemas/GeographicOriginData'}
        precision: {type: string, enum: [PREMISES, STREET, LOCALITY, REPRESENTATIVE]}
        distanceKm: {type: number, minimum: 0, description: Rounded display distance following evidence precision.}
x-tagGroups:
  - name: Operations
    tags:
      - Operations
  - name: Discovery
    tags:
      - ProductListings
      - ListingSources
      - Auctions
  - name: User Experience
    tags:
      - Search Filters
      - Watchlist
      - Notifications
      - User Account
      - Billing
      - Newsletter
  - name: Partner & Platform Integrations
    tags:
      - Partnerships
      - PartnershipApplications
      - OAuth

tags:
  - name: Operations
    description: Public process liveness and service readiness probes.
  - name: Overview
    description: Public aggregate catalogue statistics.
  - name: Auctions
    description: Public Auction discovery, catalogue reads, and administrator Auction management.
  - name: ProductListings
    description:
      Product retrieval, product history, similar-product discovery, product search, and partner catalog ingestion
      workflows.
  - name: ListingSources
    description: ListingSource retrieval, authenticated creation and update, and caller-administered listing sources.
  - name: Search Filters
    description: Saved search creation, maintenance, persisted matches, and match-feedback workflows.
  - name: Watchlist
    description: Watchlist membership, notification preferences, and watchlist-specific product state for authenticated users.
  - name: Notifications
    description: In-app notification retrieval, bulk updates, single-notification updates, and notification cleanup workflows.
  - name: User Account
    description:
      Authenticated user profile management, admin user management, access-token lifecycle management, and partnership
      listing.
  - name: Billing
    description: Stripe checkout, billing-portal, and subscription-management session creation for authenticated users.
  - name: Newsletter
    description: Newsletter subscription upsert workflows for website or product-surface sign-up flows.
  - name: Partnerships
    description: Partnership administration, safe summary reads, and membership/ListingSource count workflows.
  - name: PartnershipApplications
    description: Partnership application submission, review tracking, administration, and decision workflows.
  - name: OAuth
    description: OAuth 2.0 authorization, token, revocation, introspection, and OAuth client metadata management.
