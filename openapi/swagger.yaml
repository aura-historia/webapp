        no destination is selected or the listing is hidden/withdrawn. A saved address or explicit
        country/postal preference can supply the destination; owning addresses alone selects none.
        Destination facts include submitted assertions and compatible permitted unexpired derived
        evidence. No street, coordinates or address identity is returned. Delegated personalization
        requires users:read; credentials without it receive generic terms. Browsing infers no quantity, variant, shipment/order count or qualifying
        amount. Missing inputs retain uncertainty and explained null charges. This enrichment does
        not filter or reorder results. Authenticated responses are never cached.
