    CreateProductListingData:
      type: object
      additionalProperties: false
      description:
        "Data for creating a single product via the partner batch-create endpoint.

        "
      required:
        - sourceListingId
        - url
        - images
      properties:
        sourceListingId:
          type: string
          description: The listing source's own identifier for the product. Must be unique within the listing source.
          example: baroque-violin-001
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized title. Omit or send `null` when no title is available.
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized description. Omit or send `null` when no description is available.
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
          description: Optional asking-price assertion for the product.
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional lower bound of the estimated price range
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional upper bound of the estimated price range
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
          description: Omit or send `null` when Aura has no reliable current availability assertion.
        url:
          type: string
          format: uri
          description: URL to the product on the listing source's website
          example: https://my-listing-source.com/product-listings/baroque-violin
        images:
          type: array
          items:
            type: string
            format: uri
          description: List of image URLs for the product. May be empty.
          example:
            - https://my-listing-source.com/images/violin-1.jpg
            - https://my-listing-source.com/images/violin-2.jpg
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionData"
          description: Omit for no Auction or lot changes, or send an asserted nested Auction/lot-facts patch. `null` is invalid. `auctionId` must identify an existing Auction for this ListingSource.
    AsyncProductListingBatchReport:
      type: object
      additionalProperties: false
      description: Admission report, not a listing creation or update result. For every evaluated batch, acceptedCount plus the number of failures equals the original array length.
      required: [submissionId, acceptedCount, failures]
      properties:
        submissionId:
          type: string
          description: Opaque correlation identifier only; not a status resource or batch deduplication token.
          example: plis1_example
        acceptedCount:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of publisher-confirmed admitted entries; never includes unconfirmed sends.
        failures:
          type: array
          maxItems: 100
          description: Exactly one per non-confirmed original entry, sorted by original zero-based index. Empty for fully admitted or empty batches.
          items:
            $ref: "#/components/schemas/AsyncProductListingBatchFailure"
    AsyncProductListingBatchFailure:
      type: object
      additionalProperties: false
      required: [index, error, retryable]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          description: Original zero-based batch position, authoritative even when sourceListingId cannot be echoed.
        sourceListingId:
          type: string
          description: Included only if present, valid, and safe to echo; omitted otherwise.
        error:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Bounded safe code, never raw exception or payload text. Includes BAD_BODY_VALUE, PRODUCT_LISTING_INGESTION_PAYLOAD_TOO_LARGE, ENQUEUE_FAILED (definitely unsuccessful send), ENQUEUE_UNCONFIRMED (possibly queued), ENQUEUE_NOT_ATTEMPTED (budget before send), ENQUEUE_BLOCKED (eligible FIFO successor held), PRODUCT_LISTING_INGESTION_INTERNAL_ERROR, and applicable narrower item-validation codes.
          example: ENQUEUE_UNCONFIRMED
        retryable:
          type: boolean
          description: Whether unchanged-whole-batch retry is appropriate; never permission to resubmit a compacted subset with the same key. Unconfirmed is retryable; validation and size errors are not. Blocked inherits its predecessor's retryability; deterministic configuration errors need repair.
    PartnerProductListingBatchFailuresResponse:
      type: array
      description:
        "Failed entries from a synchronous partner-product batch. This response body is returned

        with HTTP 200 only when at least one entry in a non-empty batch succeeded.

        "
      items:
        type: object
        required:
          - listingSourceId
          - sourceListingId
          - error
        properties:
          listingSourceId:
            type: string
            description: ListingSource that owns the failed product entry.
          sourceListingId:
            type: string
            description: Partner-controlled identifier of the failed product entry.
          error:
            type: string
            description: Stable API error key for the failed product entry.
            example: PRODUCT_LISTING_NOT_FOUND
      example:
        - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
          sourceListingId: baroque-violin-002
          error: PRODUCT_LISTING_NOT_FOUND
    WithdrawProductListingData:
      type: object
      required:
        - sourceListingId
      properties:
        sourceListingId:
          type: string
          description: Partner-controlled identifier of the ProductListing to withdraw.
          example: baroque-violin-001
    UpdateProductListingData:
      type: object
      additionalProperties: false
      description:
        "Data for updating one ProductListing, synchronously or via async submission. Omitted fields remain unchanged.

        `availability: null` clears the current assertion and `price: null` clears price. Omit `auction` to preserve

        its context; `auction: null`, `url: null`, and `images: null` are invalid. Send `images: []` to remove all images.

        "
      required:
        - sourceListingId
      properties:
        sourceListingId:
          type: string
          description: The listing source's own identifier for the product to update. Product existence is evaluated synchronously on the synchronous route and downstream on the async route.
          example: baroque-violin-001
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
          description: Omit to leave unchanged. Send null to clear the current asking-price assertion.
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
          description: Omit to leave unchanged. Send null to clear the current assertion.
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Omit to leave unchanged. Send null to clear the current value.
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Omit to leave unchanged. Send null to clear the current value.
        url:
          type: string
          format: uri
          description: Omit to leave unchanged. Null is invalid.
          example: https://my-listing-source.com/product-listings/baroque-violin
        images:
          type: array
          items:
            type: string
            format: uri
          description: Omit to leave unchanged. Send [] to remove all images; null is invalid.
          example:
            - https://my-listing-source.com/images/violin-1.jpg
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionData"
          description: Omit to leave unchanged. Send an object to apply nested lot/timing leaf patches. `auctionId` must identify an existing Auction for this ListingSource; omit it to preserve membership, send null to clear it, or send an ID to set it. `null` for `auction` is invalid.
    UpsertProductListingData:
      type: object
      additionalProperties: false
      description:
        "Data for synchronously upserting one ProductListing. Only `sourceListingId` is required.

        Availability, price, and each price estimate are tri-state: omitted preserves an existing

        value, `null` clears it, and a concrete value replaces it. The nested Auction/lot-facts patch is omitted

        to preserve stored facts or supplied as a leaf patch; `null` is invalid. Within an asserted patch, lot/timing leaves

        omit to preserve, use `null` to clear, or provide a value to set. `auctionId` must identify an existing Auction for this ListingSource; omit it to preserve membership, send `null` to clear it, or send an ID to set it. Upsert restores a withdrawn listing before current

        facts apply. Images and URL use the field-specific rules documented below.

        "
      required:
        - sourceListingId
      properties:
        sourceListingId:
          type: string
          description: The listing source's own identifier for the product. Must be unique within the listing source.
          example: baroque-violin-001
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized title for the product. Used only when creating a new product.
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Optional localized description of the product. Used only when creating a new product.
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
          description:
            Optional current asking-price assertion. Omit to leave it unchanged; send null to clear it; send a
            tagged monetary or on-request value to set it. On creation, omitted and null both mean no assertion.
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description:
            Optional lower bound of the estimated price range. On an existing listing, omit to preserve, send `null`
            to clear, or send a value to set. On creation, omitted and `null` both mean no lower bound.
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description:
            Optional upper bound of the estimated price range. On an existing listing, omit to preserve, send `null`
            to clear, or send a value to set. On creation, omitted and `null` both mean no upper bound.
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
          description: Omit to preserve an existing assertion; send null to clear it; send a code to set it.
        url:
          type: string
          format: uri
          nullable: true
          description:
            URL to the product on the listing source's website. On an existing listing, omit or send `null` to
            preserve the current URL; send a value to replace it. URL is non-clearable.
          example: https://my-listing-source.com/product-listings/baroque-violin
        images:
          type: array
          items:
            type: string
            format: uri
          description:
            List of image URLs for the product. On an existing listing, omit to preserve the stored image set,
            send `[]` to clear it, or send an array to replace it. `null` is invalid.
          example:
            - https://my-listing-source.com/images/violin-1.jpg
            - https://my-listing-source.com/images/violin-2.jpg
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionData"
          description: Omit to preserve the current context or send an object to apply nested leaf patches. `auctionId` must identify an existing Auction for this ListingSource; omit it to preserve membership, send null to clear it, or send an ID to set it. `null` for `auction` is invalid.
    WoocommerceProductWebhookImageData:
      type: object
      description: Image object extracted from a WooCommerce product payload.
      required:
        - src
      properties:
        src:
          type: string
          format: uri
          description: Absolute URL of a product image.
          example: https://aura-historia-test.local/wp-content/uploads/2026/05/product.jpg
    WoocommerceProductWebhookUpsertData:
      type: object
      description:
        "WooCommerce product payload accepted for `product.created` and `product.updated`.

        Every event requires `id`. `status: publish` captures an UPSERT and requires nonblank `name` and `permalink`.

        `status: trash`, `draft`, `pending`, or `private` captures a DELETE and requires only `id`; missing or

        unsupported status is authorized ignored input and also requires only `id`.

        "
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: WooCommerce product identifier. It is converted to the internal `sourceListingId`.
          example: 17
        name:
          type: string
          description: "Nonblank product title required only when `status: publish` captures an UPSERT."
          example: Test Produkt Titel
        permalink:
          type: string
          format: uri
          description: "Public URL required only when `status: publish` captures an UPSERT."
          example: http://aura-historia-test.local/product/test-produkt-titel/
        description:
          type: string
          nullable: true
          description: Optional WooCommerce product-description field. Accepted but ignored; it is not mapped to Aura's canonical description and is omitted from persisted source evidence.
          example: "<p>Hayde yallah test beschreibung</p>

            "
        short_description:
          type: string
          nullable: true
          description: Optional WooCommerce short-description field. Accepted but ignored; it is not mapped to Aura's canonical description and is omitted from persisted source evidence.
          example: "<p>Hayde yallah kurze test beschreibung</p>

            "
        price:
          type: string
          nullable: true
          pattern: '^(?:[0-9]+(?:\.[0-9]+)?|)$'
          description:
            "Optional WooCommerce price string for a captured `status: publish` UPSERT.

            Intake writes current raw-values schema `1` with `MACHINE_DECIMAL`. A nonblank value must be an untrimmed unsigned ASCII decimal

            (`digits` or `digits.digits`): no whitespace, signs, grouping separators, or currency symbols. A nonblank

            `SET` requires the listing source's configured `woocommerceCurrency`. Fractional digits beyond the configured

            currency minor-unit scale are accepted only when every excess digit is `0`; a nonzero excess digit is

            rejected rather than truncated. A blank source string maps to `CLEAR`.

            "
          example: "42.69"
        status:
          type: string
          nullable: true
          description: "Optional WooCommerce product status string.

            `publish` captures an UPSERT and requires nonblank `name` and `permalink`. `draft`, `pending`,

            `private`, and `trash` capture a DELETE and require only `id`. Unsupported or missing status is

            authorized ignored input: it causes no destructive write and does not require `name` or `permalink`.

            "
          example: publish
        stock_status:
          type: string
          nullable: true
          description: "Optional WooCommerce stock-status string.

            For `publish`, `instock` maps to `IN_STOCK`, `outofstock` to `OUT_OF_STOCK`, and

            `onbackorder` to `BACK_ORDER`. Missing or unsupported stock status never implies a sale.

            "
          example: instock
        date_modified_gmt:
          type: string
          nullable: true
          description: Optional WooCommerce product modification timestamp. When the topic/status maps to raw capture, accepted forms are no-offset GMT interpreted as UTC, RFC3339 `Z`, and RFC3339 `+00:00`; malformed or nonzero-offset values are rejected. A valid value establishes provider source order; omit it when no source-ordering guarantee is available.
          example: "2026-09-06T12:34:56"
        images:
          type: array
          description: Optional list of WooCommerce product images. Missing payload fields are treated as an empty list.
          items:
            $ref: "#/components/schemas/WoocommerceProductWebhookImageData"
          example: []
    WoocommerceProductWebhookDeleteData:
      type: object
      description: "WooCommerce product payload accepted for `product.deleted`.

        Only `id` is required. If `name` or `permalink` are provided they may still be used by the backend,

        but the event remains valid with just the product ID.

        "
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          description: WooCommerce product identifier. It is converted to the internal `sourceListingId`.
          example: 17
        date_modified_gmt:
          type: string
          nullable: true
          description: Optional WooCommerce product modification timestamp. Accepted forms are no-offset GMT interpreted as UTC, RFC3339 `Z`, and RFC3339 `+00:00`; nonzero offsets are rejected. A valid value establishes provider source order; omit it when no source-ordering guarantee is available.
          example: "2026-09-06T12:34:56"

    PublicOverviewData:
      type: object
      description: Aggregate public-catalogue statistics from the latest scheduled calculation. Contains counts only.
      required:
        - asOf
        - sourcesIndexed
        - liveObjects
        - countries
        - languages
        - newObjectsLast7Days
      properties:
        asOf:
          type: string
          format: date-time
          description: UTC database timestamp at which the stored calculation counted every value.
          example: "2026-10-19T12:00:00.123456Z"
        sourcesIndexed:
          type: integer
          format: int64
          minimum: 0
          description: Distinct ListingSources represented by at least one counted live listing.
          example: 124
        liveObjects:
          type: integer
          format: int64
          minimum: 0
          description: ProductListings with lifecycle `ACTIVE`, including sold-out and unspecified availability.
          example: 182450
        countries:
          type: integer
          format: int64
          minimum: 0
          description: Distinct countries in the counted listings' effective advertised-inventory geography.
          example: 18
        languages:
          type: integer
          format: int64
          minimum: 0
          description: Distinct original title and description languages of the counted listings.
          example: 9
        newObjectsLast7Days:
          type: integer
          format: int64
          minimum: 0
          description: Counted listings created in the 168 hours ending at `asOf`.
          example: 3120
