              $ref: '#/components/schemas/ClearShippingDefaultData'

  /api/v1/listing-sources/{listing_source_id}/product-listings/by-source-id/{source_listing_id}/delivery:
    parameters:
    - name: listing_source_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    - name: source_listing_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    get:
      operationId: getProductListingDelivery
      tags: [ProductListings]
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      description: >-
        Protected delivery configuration. Requires product-listings:read credential scope
        and current administrator or active operator Partnership source authority. Responses and errors
        are no-store. Returns retained configuration for active or withdrawn listings, without
        resolving effective delivery or revalidating current profile/location eligibility.
      responses:
        '200':
          description: Current protected delivery configuration.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListingDeliveryViewData'
        '400':
          description: Invalid delivery command or references (BAD_BODY_VALUE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing capability or source authority (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Source or source-local listing missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale listing version, withdrawn listing or missing/retired/foreign delivery reference.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Invalid persisted state or operation failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Transaction or capability unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: changeProductListingDelivery
      tags: [ProductListings]
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      description: >-
        Revision-checked delivery command. Requires product-listings:write credential scope
        and current administrator or active operator Partnership source authority. Responses and errors
        are no-store. Commands never create or restore listings. Current references are validated at
        execution. SET/UNCHANGED/CLEAR and coherent whole-policy replacement preserve unrelated facts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductListingDeliveryCommandData'
      responses:
        '200':
          description: Committed delivery command result.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListingDeliveryResultData'
        '400':
          description: Invalid delivery command or references (BAD_BODY_VALUE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Authentication required (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing capability or source authority (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Source or source-local listing missing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale listing version, withdrawn listing or missing/retired/foreign delivery reference.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Invalid persisted state or operation failure.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Transaction or capability unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/listing-sources/{listing_source_id}/product-listings/by-source-id/{source_listing_id}/delivery/async:
    parameters:
    - name: listing_source_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ls_[0-7][0-9a-hjkmnp-tv-z]{25}$'
    - name: source_listing_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
    post:
      operationId: submitProductListingDelivery
      tags: [ProductListings]
      security:
      - BearerAuth: []
      - AccessTokenAuth: []
      description: >-
        Asynchronous delivery admission. Requires product-listings:write credential scope
        for delegated credentials. Admission validates the typed command and confirms FIFO custody.
        Execution rechecks current administrator or active operator Partnership source authority,
        the original expectedVersion, active listing and current references. Responses and errors
        are no-store. Retry unchanged content with the returned Idempotency-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductListingDeliveryCommandData'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema: {type: string, minLength: 1, maxLength: 128}
        description: Retry with unchanged content and key. Accepted means FIFO admission only; execution checks the original expectedVersion.
      responses:
        '202':
          description: Confirmed admission report; not canonical completion.
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProductListingBatchReport'
        '400':
          description: Invalid command/header problem, or rejected typed admission report.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProductListingBatchReport'
        '401':
          description: Authentication required (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Missing capability or source authority (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: Delivery command exceeds the FIFO message limit; no confirmed acceptance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProductListingBatchReport'
        '500':
          description: Internal admission problem, or nonretryable enqueue failure report.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProductListingBatchReport'
        '503':
          description: Publisher unavailable problem, or retryable failed/unconfirmed admission report.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiError'
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncProductListingBatchReport'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Cognito access JWT bearer token. Signature, issuer, client, token use and expiry

        are validated locally. Signed integer `auth_time` and `iat` claims are required;

        sessions authenticated at or before the persisted local revocation cutoff are rejected.

        This check shares the existing identity lookup and makes no live Cognito status request.

        Revocation requested only in Cognito is not observed immediately; already-issued JWTs

        can remain accepted until expiry. Use the administrator session-revocation endpoint

        for immediate local enforcement. Database authentication failures return

        `503 AUTH_TEMPORARILY_UNAVAILABLE`.

        This scheme is used for authenticated user routes and for partner routes that accept Cognito user tokens.

        "
    AccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description:
        "Aura Historia bearer access token created through `/api/v1/me/access-tokens`.

        Tokens are sent as standard bearer authorization headers.

        Selected partner routes accept this scheme instead of the removed partner API-key flow.

        "
  parameters:
    AsyncProductListingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: One value only; native duplicates and comma-joined values are invalid (`400 BAD_HEADER_VALUE`) before publication. Use 1–128 visible ASCII bytes excluding comma. Supply the same key with the unchanged ordered batch for transport retries. If absent, a key is generated and returned on evaluated reports; it cannot be recovered if that response is lost.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}$'
      example: catalog-sync-2026-09-29
    ProductListingIdPath:
      name: productListingId
      in: path
      required: true
      description: Strict `pl_` UUIDv7 ProductListing TypeID.
      schema: { type: string }

  headers:
    AsyncProductListingIdempotencyKey:
      description: Effective key, echoed on every evaluated report (including non-2xx); not guaranteed on pre-evaluation ApiError responses. CORS-exposed for browser clients.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x2B\x2D-\x7E]{1,128}$'
      example: catalog-sync-2026-09-29
  responses:
    ShippingManagementError400:
      description: Invalid path/body/schema/revision (INVALID_OBJECT_ID or BAD_BODY_VALUE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError401:
      description: Missing or invalid authentication (INVALID_CREDENTIALS).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError403:
      description: Missing current authority or credential scope (FORBIDDEN).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError404:
      description: Source, scoped profile, compatible location or attributed Party absent (LISTING_SOURCE_NOT_FOUND,
        SHIPPING_PROFILE_NOT_FOUND, SHIPPING_LOCATION_NOT_FOUND, PARTY_NOT_FOUND).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError409:
      description: Stale/exhausted revision, conflicting creation retry or ineligible profile/reference (SHIPPING_STALE_REVISION,
        SHIPPING_REVISION_EXHAUSTED, SHIPPING_CREATION_KEY_CONFLICT, SHIPPING_PROFILE_RETIRED, SHIPPING_REFERENCE_INELIGIBLE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError500:
      description: Persisted state cannot be decoded or storage operation failed (SHIPPING_STORAGE_ERROR).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ShippingManagementError503:
      description: Storage or transaction unavailable (SHIPPING_TEMPORARILY_UNAVAILABLE).
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    DeliveryAssessmentGeography:
      type: object
      additionalProperties: false
      required:
      - referenceRelease
      - country
      - subdivision
      - postalCode
      properties:
        referenceRelease:
          type: string
          enum:
          - iso-codes-4.20.1
        country:
          type: string
          pattern: ^[A-Z]{2}$
          nullable: true
        subdivision:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
    DeliveryAssessmentAttribution:
      type: object
      additionalProperties: false
      required: [provider, attributionUrl]
      properties:
        provider: {type: string}
        attributionUrl: {type: string}
    DeliveryAssertionEvidence:
      type: object
      additionalProperties: false
      required: [verifiedAt]
      properties:
        verifiedAt:
          type: string
          format: date-time
      description: Last successful assertion observation. Terms remain valid until updated, withdrawn,
        or their source loses authority. Observation age alone never withdraws terms. Failed recrawls,
        unrelated edits, evidence-only corrections and lifecycle commands do not advance this time.
    DeliveryAssessmentProfileBasis:
      type: object
      additionalProperties: false
      required:
      - shippingProfileId
      - termsRevision
      - managementRevision
      - lifecycle
      - evidence
      properties:
        shippingProfileId:
          type: string
          pattern: ^shp_[0-7][0-9a-hjkmnp-tv-z]{25}$
        termsRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        managementRevision:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
        lifecycle:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        evidence:
          $ref: '#/components/schemas/DeliveryAssertionEvidence'
    DeliveryAssessmentReason:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - MISSING_INPUT
          - NO_SOURCE_DEFAULT
          - PROFILE_ABSENT
          - PROFILE_RETIRED
          - SOURCE_MISMATCH
          - AMBIGUOUS_DEPENDENCY
          - LOCATION_ABSENT
          - LOCATION_RETIRED
          - REFERENCE_RELEASE_MISMATCH
          - UNRESOLVED_AREA
          - UNSUPPORTED_POSTAL_SHAPE
          - COUNTRY_MISMATCH
          - SUBDIVISION_MISMATCH
          - POSTAL_MISMATCH
          - CLASS_MISMATCH
          - INCOMPLETE_CLASS_MEMBERSHIP
          - VARIANT_MISMATCH
          - VARIANT_UNAVAILABLE
          - MIXED_VARIANT_APPLICABILITY
          - QUANTITY_OUTSIDE_RANGE
          - QUALIFYING_THRESHOLD_NOT_MET
          - CURRENCY_MISMATCH
          - EXCLUDED
          - EARLIER_ZONE_UNDETERMINED
          - INCOMPLETE_COVERAGE
          - OUTSIDE_COMPLETE_COVERAGE
          - NO_APPLICABLE_SERVICE
          - NO_SHIPPING_ASSERTION
          - NO_COLLECTION_ASSERTION
          - NO_ELIGIBILITY_ASSERTION
          - SUPPRESSED_INHERITANCE
          - ASSERTION_CLEARED
          - SHIPPING_PROHIBITED
          - SHIPPING_DEPENDENCY_REPLACED
          - SHIPPING_DEPENDENCY_UNDETERMINED
          - UNKNOWN_CHARGE_BASIS
          - NO_CURRENCY_ASSERTION
          - PRICE_ON_REQUEST
          - EXTERNALLY_CALCULATED_PRICE
          - ARITHMETIC_OVERFLOW
        input:
          type: string
          enum:
          - DESTINATION
          - DESTINATION_COUNTRY
          - DESTINATION_SUBDIVISION
          - POSTAL_CODE
          - ORIGIN_COUNTRY
          - QUANTITY
          - LOTS
          - SHIPMENTS
          - SELLER_ORDERS
          - VARIANT
          - CLASS_MEMBERSHIP
          - QUALIFYING_AMOUNT
        scope:
          type: string
          enum:
          - ITEM
          - LOT
          - SHIPMENT
          - SELLER_ORDER
        index:
          type: integer
          minimum: 0
      description: MISSING_INPUT includes input, plus scope for QUALIFYING_AMOUNT. EARLIER_ZONE_UNDETERMINED
        includes index. Other codes include no additional fields or private dependency text.
    DeliveryAssessmentCharge:
      oneOf:
      - $ref: '#/components/schemas/ShippingPriceDataFixed'
      - $ref: '#/components/schemas/ShippingPriceDataFrom'
      - $ref: '#/components/schemas/ShippingPriceDataEstimatedRange'
      description: Arithmetic advertised charge for its explicit basis and count; never a quote or landed
        cost. Null when unavailable, inapplicable or necessary count/currency/basis is absent.
    DeliveryAssessmentOption:
      type: object
      additionalProperties: false
      required:
      - serviceIndex
      - applicability
      - eligibility
      - charge
      - reasons
      properties:
        serviceIndex:
          type: integer
          minimum: 0
          description: Zero-based service index within the selected zone of item.shipping.terms.
        applicability:
          type: string
          enum:
          - MATCH
          - NO_MATCH
          - UNDETERMINED
        eligibility:
          type: string
          enum:
          - OFFERED
          - NOT_OFFERED
          - SUBJECT_TO_CONFIRMATION
          - null
          nullable: true
        charge:
          anyOf:
          - $ref: '#/components/schemas/DeliveryAssessmentCharge'
          - type: object
            nullable: true
            enum:
            - null
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAssessmentReason'
      description: Eligibility and calculated charge for a service in the selected advertised zone.
        Service identity, advertised price/basis/components and durations remain in item.shipping.terms.
    DeliveryAssessmentCollection:
      type: object
      additionalProperties: false
      required:
      - eligibility
      - applicability
      - reasons
      properties:
        eligibility:
          type: string
          enum:
          - OFFERED
          - NOT_OFFERED
          - SUBJECT_TO_CONFIRMATION
          - null
          nullable: true
        applicability:
          type: string
          enum:
          - MATCH
          - NO_MATCH
          - UNDETERMINED
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAssessmentReason'
      description: Independent collection can remain offered when shipping is prohibited. Arrangement/windows
        are in terms.collection; site is always null pending explicit permitted disclosure.
    ShippingDisplayData:
      type: object
      additionalProperties: false
      required: [currency, fxRateId, capturedAt, rates]
      description: >-
        Converted current effective advertised rates. Source terms retain their original amounts/currencies.
        HalfUp rounding uses currency minor-unit exponents. FROM and ESTIMATED_RANGE retain uncertainty;
        FREE with known currency remains zero. Unknown-currency free, external, on-request and absent rates
        have no entry. Conversion supplies no quantity, applicability, binding quote or complete landed cost.
      properties:
        currency: {$ref: '#/components/schemas/CurrencyData'}
        fxRateId: {type: string, description: 'Immutable persisted browsing FX snapshot, pinned for search continuation.'}
        capturedAt: {type: string, format: date-time}
        rates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [zoneIndex, serviceIndex, price, basis]
            properties:
              zoneIndex: {type: integer, minimum: 0, description: Zero-based zone index in effective terms.}
              serviceIndex: {type: integer, minimum: 0, description: Zero-based service index within that zone.}
              price:
                oneOf:
                - {$ref: '#/components/schemas/ShippingPriceDataFree'}
                - {$ref: '#/components/schemas/ShippingPriceDataFixed'}
                - {$ref: '#/components/schemas/ShippingPriceDataFrom'}
                - {$ref: '#/components/schemas/ShippingPriceDataEstimatedRange'}
              basis: {type: string, nullable: true, enum: [PER_ITEM, PER_LOT, PER_SHIPMENT, PER_SELLER_ORDER, null]}
    ShippingMatchValuationData:
      type: object
      additionalProperties: false
      required: [interpretation, fxRateId, capturedAt, maximumPerItem]
      description: Immutable shipping FX evaluation basis, separate from historical sale/asking-price valuation. Later captures, destination edits and filter edits do not rewrite it.
      properties:
        interpretation: {type: string, enum: [WHOLE_COUNTRY_PER_ITEM_FX_V1]}
        fxRateId: {type: string}
        capturedAt: {type: string, format: date-time}
        maximumPerItem:
          type: object
          additionalProperties: false
          required: [amount, currency]
          properties:
            amount: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}
            currency: {$ref: '#/components/schemas/CurrencyData'}
    AdvertisedListingShippingData:
      type: object
      additionalProperties: false
      description: >-
        Effective advertised shipping and collection terms, shared by every viewer. Source defaults
        and listing overrides are resolved from current PostgreSQL state. Dispatch origins and
        collection sites are always null. Invalid shipping dependencies return 500 SHIPPING_STORAGE_ERROR;
        unavailable shipping reads return 503 SHIPPING_TEMPORARILY_UNAVAILABLE. Missing or withdrawn listings and hidden entries have
        shipping null. Clients render these terms generically without a destination. Display conversion uses
        persisted browsing FX, never historical sale-observation FX. Missing snapshot/unavailable FX reads
        return 503; invalid snapshot, missing required quote or overflow return 500. Shared listing FX
        resolution retains endpoint errors; shipping enrichment uses SHIPPING_TEMPORARILY_UNAVAILABLE
        or SHIPPING_STORAGE_ERROR. No provider is called. Currency and query predicates isolate
        anonymous caches; credential-bearing responses and errors remain private, no-store.
      required: [terms, display, listingRevision, sourceRevision, defaultRevision, profile, listingEvidence, evaluatedAt, shippingReasons, collectionReasons, notices]
      properties:
        display:
          anyOf:
          - $ref: '#/components/schemas/ShippingDisplayData'
          - type: object
            nullable: true
            enum:
            - null
        terms:
          $ref: '#/components/schemas/AdvertisedDeliveryTermsData'
        listingRevision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        sourceRevision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        defaultRevision: {type: integer, minimum: 1, maximum: 9223372036854775807, nullable: true}
        profile:
          anyOf:
          - $ref: '#/components/schemas/DeliveryAssessmentProfileBasis'
          - type: object
            nullable: true
            enum:
            - null
        listingEvidence:
          anyOf:
