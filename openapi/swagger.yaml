      description: Requires an unsuspended administrator or an active partnership member of the operator
        Party with the exact source grant. Delegated credentials also require listing-sources:read for reads,
        listing-sources:write for commands. All authority is revalidated in the transaction. Responses/errors
        are no-store. Terms are advertised arrangements, never authorized quotes. Clear remains possible
