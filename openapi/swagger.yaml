  /api/v1/me/search-filters/{userSearchFilterId}/matches:
    get:
      summary: List persisted matches for a saved search filter
      description: >-
        Delegated Aura access tokens require `search-filters:read`; missing scope returns `403 FORBIDDEN`.
        Returns persisted product-listing matches associated with the authenticated user’s saved
        search filter. Results are read from stored match state and returned with cursor-based
        pagination in ascending persisted match-creation order. This endpoint does not execute a
        live search or preview the filter against current product listings.

        New matches are discovered by bounded scheduled matching of active ordinary and enhanced
        filters, subject to product-search projection lag. Semantic candidates are individually
        evaluated with evidence permitted by the saved filter’s plan; deterministic filters
        require no model decision. Runs inspect up to 50 eligible candidates per filter and
        do not guarantee exhaustive catalogue coverage. Match discovery and notifications are not
        synchronous with listing changes or filter creation.

        Requires a Cognito JWT or an Aura access token with `search-filters:read`.
      operationId: listSearchFilterMatches
      tags:
        - Search Filters
      parameters:
        - name: userSearchFilterId
          in: path
          required: true
          description: Canonical Aura Historia UserSearchFilter ID.
          schema:
            type: string
          example: sf_4hyqf0gyxveazss7nby5hve5x2
        - name: language
          in: query
          required: false
          description: Preferred language for localized product content. Defaults to `en`.
          schema:
            $ref: "#/components/schemas/LanguageData"
          example: de
        - name: currency
          in: query
          required: false
          description: Currency used for the returned product-listing representation. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
          example: EUR
        - name: size
          in: query
          required: false
          description: >-
            Requested page size. The runtime defaults to 21 and clamps successfully parsed unsigned
            values to the inclusive range 1..100: `0` becomes 1 and values above 100 become 100.
            Negative, malformed, and non-integer values are rejected with `BAD_QUERY_PARAMETER_VALUE`.
          schema:
            type: integer
            format: int64
            default: 21
          example: 21
        - name: searchAfter
          in: query
          required: false
          description: >-
            Cursor returned by the preceding page. It is a JSON string containing `[RFC3339 persisted
            match creation timestamp, canonical ProductListing ID]`; send the returned tuple as this
            query parameter to continue. The timestamp and ProductListing ID make the ascending cursor tie-safe.
          schema:
            type: string
          example: '["2026-08-05T12:30:00Z","pl_6zydvb8xqqfcntt760grgm41t4"]'
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: Persisted search-filter matches retrieved successfully
          headers:
            Cache-Control:
              description: Cache control directive — always set to `no-store`
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchFilterMatchProductCollectionData"
        "400":
          description: Bad request - invalid path or query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_search_after:
                  summary: Malformed searchAfter cursor
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: searchAfter
                      type: QUERY
                    detail: searchAfter must contain an RFC3339 timestamp and ProductListing ID.
                invalid_size:
                  summary: Malformed page size
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: size
                      type: QUERY
                invalid_search_after_product_listing_id:
                  summary: Noncanonical ProductListing ID in searchAfter
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: searchAfter
                      type: QUERY
                    detail: must be a valid ProductListing ID
                invalid_search_filter_id:
                  summary: Invalid search filter ID format
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
