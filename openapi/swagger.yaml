  /api/v1/listing-sources:
    get:
      summary: Search public ListingSources
      description: Anonymous, literal partial-name search and browse of every persisted ListingSource. Optional valid credentials never widen the public representation; invalid supplied credentials are rejected. Query values are NFC/Unicode-whitespace canonicalized. One scalar and punctuation-only input return a terminal empty collection.
      operationId: searchPublicListingSources
      tags:
        - ListingSources
      security:
        - {}
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 256
          description: Optional contiguous literal text. Only `query`, `size`, and `searchAfter` are accepted once; unknown or repeated parameters return 400.
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 21
        - name: searchAfter
          in: query
          schema:
            type: string
          description: Opaque URL-safe base64 continuation from this endpoint. Omit on the first page and restart after a query or size change.
      responses:
        "200":
          description: Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=300, stale-if-error=0`; any request with Authorization and all errors use `private, no-store`.
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=0, s-maxage=300, stale-if-error=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingSourceSearchCollectionData"
        "400":
          description: Invalid query parameter or continuation. Cache-Control is no-store.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: Invalid supplied credential. Cache-Control is no-store.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Invalid persisted public read model. Cache-Control is no-store.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: Temporary public-read failure. Cache-Control is no-store.
