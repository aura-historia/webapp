openapi: 3.0.0
info:
  title: Aura Historia API Reference
  description:
    "## Overview\n\nThe Aura Historia API powers the Aura Historia antiques platform and its partner-facing integrations.\n\
    It exposes product discovery, listing source discovery, personalization, partner onboarding, and integration\nworkflows\
    \ on top of Aura Historia's serverless AWS platform.\n\nThis reference is designed for two audiences:\n- **Internal developers**\
    \ building Aura Historia product-listings, operational tooling, and backoffice workflows\n- **External partners and integrators**\
    \ synchronizing inventory, consuming platform data, or\n  integrating with delegated access\n\n## Core API domains\n\n\
    - **ProductListings and listing-sources** — search, retrieve, and explore product-listings, related product-listings,\
    \ product\n  history, and listing source data\n- **Personalization** — manage watchlists, saved search filters, and user\
    \ notifications\n- **Partner workflows** — submit partnership applications, maintain partnerships, ingest catalog data\n\
    \  in batches, and receive WooCommerce webhooks\n- **Identity and access** — manage user accounts, Aura Historia access\
    \ tokens, and OAuth 2.0\n  clients and token flows\n- **Billing** — create Stripe checkout, billing-portal, and subscription-management\
    \ sessions\n\n## Authentication model\n\nThe API uses more than one authentication scheme depending on the route:\n\n\
    - **`BearerAuth`** — Cognito **access** JWT bearer tokens for authenticated user, admin, and\n  partner-user workflows.\
    \ Cognito ID tokens are not accepted as API credentials.\n- **`AccessTokenAuth`** — Aura Historia opaque bearer access\
    \ tokens created via\n  `/api/v1/me/access-tokens` or OAuth 2.0, primarily intended for partner automations and server-to-server\n\
    \  ingestion scenarios.\n\nWhen a route lists multiple security schemes, any one of the listed schemes may be accepted.\n\
    Some read endpoints can also be called without authentication, while a valid user token may enrich\nthe response with\
    \ personalized state such as watchlist, notification, or search-filter metadata.\n\n## Data and response conventions\n\
    \n- **PATCH:** an omitted request member remains unchanged. A documented nullable PATCH member\n  accepts `null` to clear\
    \ its value; `null` for any other member returns `400 BAD_BODY_VALUE`.\n  Use `[]`, not `null`, to replace a non-null\
    \ collection with an empty collection. Empty HTTP\n  bodies are invalid, `{}` is a valid object-PATCH no-op, and the partner-product\
    \ PATCH `[]`\n  remains a valid empty batch. Responses may omit absent optional values.\n- Product detail, watchlist,\
    \ and saved-search match reads accept optional **`language`** and\n  **`currency`** parameters. Currency defaults to `EUR`.\
    \ Detail pricing contains the seller's source\n  amounts, converted display amounts, and FX valuation metadata. Active\
    \ product-listings use the latest persisted\n  snapshot; sold product-listings use their immutable sale snapshot. Product\
    \ history preserves immutable source values and accepts optional `currency` for historical FX display projections.\n  History text is not localized.\n- Request-wide errors are returned as **`application/problem+json`**\
    \ using a consistent RFC 9457-style structure\n  with `status`, `title`, `error`, optional `source`, and optional `detail`\n\
    - Many list and search endpoints use **cursor-based pagination** via `searchAfter`\n- Origin API responses include\
    \ server-generated `X-Request-Id` and `X-Correlation-Id` headers. Clients may send `X-Correlation-Id` to preserve a trace\
    \ only when it is a 1–128-character ASCII value containing letters, digits, `.`, `_`, or `-`; invalid values are replaced.\
    \ Both headers are CORS-exposed; CloudFront removes them from viewer responses on the six cache-enabled discovery behaviors so shared cache hits cannot replay origin IDs.\n- Request bodies are limited to 1 MiB and requests time out after 30 seconds. A declared `Content-Length` above 1 MiB is\
    \ rejected at the edge with `413` (`BAD_BODY_VALUE`, JSON body) before authentication or route handling.\n- `POST /api/v1/webhooks/loops` is limited to 64 KiB and has a 10-second processing budget; it requires a valid Loops signature but no Aura bearer.\n- `GET /api/v1/health` is a\
    \ process liveness check. `GET /api/v1/ready` returns `204` only when the configured PostgreSQL and OpenSearch dependencies are\
    \ reachable; it otherwise returns `503`.\n- WooCommerce webhook ingestion responds with **`204 No Content`** after\
    \ signed validation. A mapped raw-capture command receives `204` only after confirmed shared FIFO admission; authorized ignored create/update status events are no-op `204`. Queue admission is not raw capture, provider receipt persistence, canonical normalization, or search visibility. Capture conflicts are handled by the consumer, not returned synchronously; existing partner Product batch writes remain synchronous.\n\n## Environment\
    \ endpoints\n\n- **Development:** `https://api.stage.aura-historia.com`\n- **Production:** `https://api.aura-historia.com`\n\
    \n## Notes for integrators\n\n- Treat Aura Historia identifiers such as `listingSourceId`, `productListingId`, `eventId`,\
    \ `userSearchFilterId`,\n  and `partnershipApplicationId` as opaque values\n- For partner product ingestion, `sourceListingId`\
    \ is the partner-controlled identifier and should\n  remain stable within a listing source\n- Endpoints marked `deprecated`\
    \ or `x-disabled` are retained for reference only and should not be\n  used for new integrations\n"
  version: 1.0.0
  contact:
    name: Aura-Historia Team
    url: https://aura-historia.com/
  license:
    name: License
    url: https://github.com/aura-historia/backend/blob/develop/LICENSE
servers:
  - url: https://api.stage.aura-historia.com
    description: Development environment
  - url: https://api.aura-historia.com
    description: Production environment
paths:
  /api/v1/health:
    get:
      summary: Check process liveness
      description: Returns the fixed `ok` response without checking dependencies.
      operationId: getHealth
      tags: [Operations]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema: { type: string }
              example: "ok\n"
  /api/v1/ready:
    get:
      summary: Check service readiness
      description: Returns no diagnostic body when readiness fails.
      operationId: getReadiness
      tags: [Operations]
      security: []
      responses:
        "204":
          description: The readiness check succeeded.
        "503":
          description: The readiness check failed or timed out; no diagnostic body is returned.
  /api/v1/overview:
    get:
      summary: Get public catalogue statistics
      description: |
        Anonymous aggregate statistics for the public catalogue. Hourly maintenance recalculates
        every count together from authoritative PostgreSQL about every six hours, and reads return
        that stored calculation; `asOf` is its time. Including the 15-minute shared edge cache,
        figures are normally at most about seven hours old; a failed refresh keeps the previous
        calculation.
        There are no filters, personalization, or per-source, per-partner or per-user details.
        Credentials are neither required nor evaluated, and query strings never change the
        representation; send none, because each distinct query string is cached separately.
        Clients should not attach a bearer token; any `Authorization` header makes the response
        private.

        Counts cover ProductListings with lifecycle `ACTIVE`, whatever their availability.
        `sourcesIndexed` counts distinct ListingSources with at least one counted listing.
        `countries` counts distinct countries in the counted listings' effective advertised-inventory
        geography; business association and shipping destinations do not establish inventory location.
        `languages` counts the union of original title and description languages; generated
        translations and presentation fallbacks are excluded. `newObjectsLast7Days` counts listings
        whose `created` timestamp lies in the 168 hours ending at `asOf` (start exclusive, end inclusive).
        Effective geography and OpenSearch projections may lag PostgreSQL while they catch up.
      operationId: getPublicOverview
      tags: [Overview]
      security: []
      responses:
        "200":
          description: Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=900, stale-if-error=0`; any request with Authorization uses `private, no-store`.
          headers:
            Cache-Control:
              schema: { type: string }
              example: public, max-age=0, s-maxage=900, stale-if-error=0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOverviewData"
        "500":
          description: The aggregate read model is invalid. Cache-Control is no-store.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                status: 500
                title: Internal Server Error
                error: OVERVIEW_INTERNAL_ERROR
        "503":
          description: PostgreSQL is temporarily unavailable, or no calculation has been stored yet. Cache-Control is no-store.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                status: 503
                title: Service Unavailable
                error: OVERVIEW_TEMPORARILY_UNAVAILABLE
  /api/v1/auctions:
    get:
      summary: List public Auctions
      operationId: listAuctions
      tags: [Auctions]
      parameters:
        - { name: listingSourceId, in: query, schema: { type: string } }
        - {
            name: format,
            in: query,
            schema: { type: string, enum: [LIVE, TIMED] },
          }
        - {
            name: reportedStatus,
            in: query,
            schema:
              {
                type: string,
                enum: [SCHEDULED, IN_PROGRESS, ENDED, POSTPONED, CANCELLED],
              },
          }
        - {
            name: timeRole,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    BIDDING_OPENS,
                    LIVE_STARTS,
                    LOTS_BEGIN_CLOSING,
                    SCHEDULED_END,
                  ],
              },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - name: sort
          in: query
          description: "`created` sorts by creation time; `scheduled` requires `timeRole` and sorts on that role's instant, with missing instants last when no window is specified."
          schema: { type: string, enum: [created, scheduled], default: created }
        - name: order
          in: query
          description: Defaults to `desc` for created and `asc` for scheduled.
          schema: { type: string, enum: [asc, desc] }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 21 },
          }
        - name: searchAfter
          in: query
          description: Complete returned JSON cursor. Its scope must match the source, format, reported-status, exact-time filters, sort and order of this request.
          schema: { type: string }
      responses:
        "200":
          description: "Bounded Auction directory, newest-created-first by default. Scheduled order uses the chosen role instant, with Auction ID as the final tie-breaker. Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=60, stale-if-error=0`; requests with any Authorization header and all non-200 responses use `private, no-store`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuctionDirectoryData"
        "400":
          description: "Invalid ID, filter, cursor, or incomplete exact-time range."
  /api/v1/auctions/{auctionId}:
    get:
      summary: Get public Auction detail
      operationId: getAuction
      tags: [Auctions]
      parameters:
        - name: auctionId
          in: path
          required: true
          schema: { type: string }
          description: Strict `auc_` UUIDv7 TypeID.
      responses:
        "200":
          description: "Public Auction facts, source summary, schedule, reported lot count, and visible listing count. Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=60, stale-if-error=0`; requests with any Authorization header and all non-200 responses use `private, no-store`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuctionData"
        "400": { description: Invalid Auction ID (`INVALID_OBJECT_ID`). }
        "404": { description: Auction missing (`AUCTION_NOT_FOUND`). }
  /api/v1/auctions/{auctionId}/product-listings:
    get:
      summary: Get public Auction catalogue
      operationId: getAuctionCatalogue
      tags: [Auctions]
      parameters:
        - name: auctionId
          in: path
          required: true
          schema: { type: string }
        - { name: language, in: query, schema: { type: string, default: en } }
        - { name: currency, in: query, schema: { type: string, default: EUR } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 21 },
          }
        - name: searchAfter
          in: query
          description: Complete returned JSON cursor. It is scoped to this Auction and includes `auctionId`, catalogue position, and ProductListing ID.
          schema: { type: string }
      responses:
        "401":
          description: Supplied bearer credentials are invalid (INVALID_CREDENTIALS).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: The current authenticated user is suspended, deleted or not permitted (FORBIDDEN).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Invalid persisted shipping dependencies (SHIPPING_STORAGE_ERROR) or listing read failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Shipping storage/transaction or permitted destination reads are temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: "Visible assigned ProductListings in normal personalized detail presentation, ordered by catalogue position, null positions last, then backing listing UUID. Anonymous successful 200 responses without Authorization use `public, max-age=0, s-maxage=60, stale-if-error=0`; requests with any Authorization header and all non-200 responses use `private, no-store`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAuctionCatalogueData"
        "400": { description: Invalid Auction ID or cursor. }
        "404": { description: Auction missing (`AUCTION_NOT_FOUND`). }
  /api/v1/admin/product-listings:
    get:
      summary: Search ProductListings for administration
      operationId: searchAdminProductListings
      description: >-
        Administrator authority is required; delegated Aura tokens additionally require `product-listings:read`. Cognito administrators need no delegated scope or Partnership grant. Success and all errors use `private, no-store`. Original source values include retained withdrawn listings and do not depend on OpenSearch or enrichment readiness.
        Live keyset pagination includes both lifecycle states by default. Source-local identity alone is not globally unique. Text query is bounded literal matching over original title/source-local ID; no total count is returned. Cursors are bound to normalized filters and sort/order, with listing ID breaking timestamp ties.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - { name: listingSourceId, in: query, schema: { type: string }, description: Strict ListingSource TypeID. }
        - { name: sourceListingId, in: query, schema: { type: string, maxLength: 512 }, description: Exact case-sensitive source-local identity after outer whitespace trimming. }
        - { name: lifecycle, in: query, schema: { $ref: "#/components/schemas/ListingLifecycleData" } }
        - { name: availability, in: query, schema: { $ref: "#/components/schemas/ListingAvailabilityData" } }
        - { name: auctionId, in: query, schema: { type: string }, description: Strict Auction TypeID. }
        - { name: query, in: query, schema: { type: string, maxLength: 512 }, description: At most 512 UTF-8 bytes and NUL-free; outer whitespace and case normalized. Percent/underscore are literal. }
        - { name: sort, in: query, schema: { type: string, enum: [created, updated], default: updated } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: size, in: query, schema: { type: integer, default: 21 }, description: Clamped to 1–100. }
        - { name: searchAfter, in: query, schema: { type: string }, description: Opaque cursor returned by this normalized filter/sort scope. }
      responses:
        "200":
          description: Lightweight summary page; Cache-Control is private, no-store.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingPage" } } }
        "400":
          description: Invalid ID, directory query or scoped cursor (`BAD_QUERY_PARAMETER_VALUE`, `INVALID_OBJECT_ID`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Persisted administrator authority or delegated capability missing (`FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/admin/product-listings/{productListingId}:
    get:
      summary: Inspect authoritative ProductListing facts
      operationId: getAdminProductListing
      description: >-
        Administrator authority is required; delegated Aura tokens additionally require `product-listings:read`. Cognito administrators need no delegated scope or Partnership grant. Success and all errors use `private, no-store`. Original source values include retained withdrawn listings and do not depend on OpenSearch or enrichment readiness.
        Original title/description, slug, sale observation and enrichment are read-only. Canonical image URLs are privileged inspection data; previews must respect sensitive/unassessed content rather than automatically rendering them. Public redaction is unchanged.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductListingIdPath"
      responses:
        "200":
          description: Original retained listing facts and expectedVersion; Cache-Control is private, no-store.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingDetails" } } }
        "400":
          description: Invalid ProductListing ID (`INVALID_OBJECT_ID`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Persisted administrator authority or delegated capability missing (`FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Target listing not found (`PRODUCT_LISTING_NOT_FOUND`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    patch:
      summary: Update an existing active ProductListing
      operationId: updateAdminProductListing
      description: >-
        Administrator authority is required; delegated Aura tokens additionally require `product-listings:write`. Cognito administrators need no delegated scope or Partnership grant. All responses/errors use `private, no-store`. State and the ordinary change event commit together; indexing, embeddings, notifications and cache convergence are asynchronous. Later ingestion may overwrite edits or restore withdrawal. Refetch/reconcile after a lost response; do not automatically retry with a different version.
        Never creates or restores a listing. The required expectedVersion is checked before changes and again through compare-and-set persistence. Availability edits do not fabricate sale observations. No-op preserves version/timestamps and emits no event. Unknown/read-only fields and nested unknown fields are rejected.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductListingIdPath"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAdminProductListing" } } }
      responses:
        "200":
          description: Committed resulting/current version and CHANGED or UNCHANGED; Cache-Control is private, no-store.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingMutation" } } }
        "400":
          description: Invalid ID, JSON, expectedVersion, unknown/read-only field or invalid field/null value (`BAD_BODY_VALUE`, `INVALID_OBJECT_ID`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Persisted administrator authority or delegated capability missing (`FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Target listing or referenced Auction not found (`PRODUCT_LISTING_NOT_FOUND`, `AUCTION_NOT_FOUND`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Stale expectedVersion/racing write (`PRODUCT_LISTING_CONCURRENCY_CONFLICT`), PATCH of withdrawn listing (`PRODUCT_LISTING_WITHDRAWN`), or cross-source Auction reference (`CONFLICT`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    delete:
      summary: Withdraw a retained ProductListing
      operationId: withdrawAdminProductListing
      description: >-
        Administrator authority is required; delegated Aura tokens additionally require `product-listings:write`. Cognito administrators need no delegated scope or Partnership grant. All responses/errors use `private, no-store`. State and the ordinary change event commit together; indexing, embeddings, notifications and cache convergence are asynchronous. Later ingestion may overwrite edits or restore withdrawal. Refetch/reconcile after a lost response; do not automatically retry with a different version.
        DELETE withdraws rather than physically purging identity, history or watchlist state. Availability is cleared; sale observation is retained. Already withdrawn is a no-op only with a matching current version; stale versions still conflict.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductListingIdPath"
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1, maximum: 9223372036854775807 }
      responses:
        "204": { description: "Withdrawal committed or unchanged; Cache-Control is private, no-store." }
        "400":
          description: Invalid ID or missing/invalid expectedVersion query parameter (`BAD_QUERY_PARAMETER_VALUE`, `INVALID_OBJECT_ID`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Persisted administrator authority or delegated capability missing (`FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Target listing not found (`PRODUCT_LISTING_NOT_FOUND`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Stale expectedVersion or racing write (`PRODUCT_LISTING_CONCURRENCY_CONFLICT`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/admin/product-listings/{productListingId}/restore:
    post:
      summary: Explicitly restore a retained ProductListing
      operationId: restoreAdminProductListing
      description: >-
        Administrator authority is required; delegated Aura tokens additionally require `product-listings:write`. Cognito administrators need no delegated scope or Partnership grant. All responses/errors use `private, no-store`. State and the ordinary change event commit together; indexing, embeddings, notifications and cache convergence are asynchronous. Later ingestion may overwrite edits or restore withdrawal. Refetch/reconcile after a lost response; do not automatically retry with a different version.
        Restores to ACTIVE with unknown availability; no former availability is reconstructed. Already active is a no-op only with a matching current version. Missing retained identity is never created.
      tags: [ProductListings]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductListingIdPath"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingVersion" } } }
      responses:
        "200":
          description: Committed resulting/current version and CHANGED or UNCHANGED; Cache-Control is private, no-store.
          content: { application/json: { schema: { $ref: "#/components/schemas/AdminProductListingMutation" } } }
        "400":
          description: Invalid ID, JSON or missing/invalid expectedVersion; unknown fields are rejected (`BAD_BODY_VALUE`, `INVALID_OBJECT_ID`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401":
          description: Missing/invalid credential (`INVALID_CREDENTIALS`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Persisted administrator authority or delegated capability missing (`FORBIDDEN`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Target listing not found (`PRODUCT_LISTING_NOT_FOUND`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Stale expectedVersion or racing write (`PRODUCT_LISTING_CONCURRENCY_CONFLICT`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "503":
          description: Temporary authorization/read/persistence dependency failure (`PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "500":
          description: Unexpected failure or invalid persisted state (`PRODUCT_LISTING_INTERNAL_ERROR`).
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /api/v1/admin/auctions:
    get:
      summary: Search Auctions for administration
      operationId: adminSearchAuctions
      description: Administrator authority is required. Delegated Aura access tokens also require `auctions:read`; Cognito users do not require a delegated scope. Success and errors are always `no-store`.
      tags: [Auctions]
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: query
          in: query
          description: NUL-free, case-insensitive literal substring of the localized Auction name or sourceAuctionId.
          schema: { type: string }
        - { name: listingSourceId, in: query, schema: { type: string } }
        - name: sourceAuctionId
          in: query
          description: Exact source-scoped Auction key, trimmed as on create. Combine with listingSourceId to locate a create conflict.
          schema: { type: string }
        - {
            name: format,
            in: query,
            schema: { $ref: "#/components/schemas/AuctionFormatData" },
          }
        - {
            name: reportedStatus,
            in: query,
            schema: { $ref: "#/components/schemas/AuctionReportedStatusData" },
          }
        - name: sort
          in: query
          description: Supply both sort and order to override the default updated/descending ordering.
          schema:
            { type: string, enum: [name, created, updated], default: updated }
        - name: order
          in: query
          description: Supply both sort and order to override the default updated/descending ordering.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: size
          in: query
          description: Requested page limit, clamped to 1–100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 21 }
        - name: searchAfter
          in: query
          description: Opaque cursor from the preceding page. Filters, sort and order must match the request that issued it.
