              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
    delete:
      summary: Batch delete product-listings (Partner API)
      description:
        "Soft-deletes product-listings for a listing source. Each entry writes its product lifecycle delete event
        and

        materialized PostgreSQL state synchronously in its own transaction.


        The caller must be a user with an active Partnership grant for the path ListingSource; administrator role alone
        does not grant access. Administrators use the separate `/api/v1/admin/product-listings` operations.
        Partnership and scope checks run per entry, so an authenticated empty array returns `[]` without them.

        Aura Historia access tokens must include the `product-listings:write` scope.


        The request body is an array of product identifiers. The response returns HTTP 200 with

        failures as `{ listingSourceId, sourceListingId, error }` objects when one or more entries succeed.

        `error` is the stable API error key for that entry. If every non-empty entry fails, the first

        failure is returned as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: deletePartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
