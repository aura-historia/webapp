  /api/v1/admin/users/{userId}/sessions/revoke:
    post:
      summary: Revoke a user's Cognito sessions as admin
      description: |
        Invalidates the explicit target user's sessions locally and requests Cognito global sign-out. No request body is accepted.
        The local cutoff is committed before the provider call and advanced again when it returns,
        including on provider failure. Local sessions may therefore remain revoked even if the response is an error.
        Cutoffs include a 60-second clock-skew allowance; fresh logins may be rejected for roughly
        a minute after the latest completion/retry. Token refresh does not bypass the cutoff.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `users:write`.
        Authorization and the target-user check are enforced in the User service, not only at the
        HTTP route. The PostgreSQL authorization check completes before the external Cognito call.

        `userId` must be a valid User ID and the target user must exist. Cognito global sign-out is safe to
        retry: it succeeds when there are no active sessions. The operation does not change the
        Aura user's profile, tier, role, suspension state, Aura access tokens, or partnerships.
        Every response sends `Cache-Control: no-store`.
      operationId: adminRevokeUserSessions
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user whose Cognito sessions are revoked.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: Cognito sessions were invalidated, including after a retry with no active sessions.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only security operation.
              schema:
                type: string
              example: no-store
        "400":
          description: Invalid target User ID.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 400
                title: Bad Request
                error: INVALID_OBJECT_ID
                source:
                  field: userId
                  type: PATH
                detail: must be a valid User ID
        "401":
          description: Invalid or missing bearer credentials.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: The caller is not an administrator or a delegated credential lacks users:write.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: The target user or corresponding Cognito identity was not found.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "503":
          description: User authorization, persistence, or Cognito is temporarily unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: USER_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal user-session revocation failure.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: USER_INTERNAL_ERROR

  /api/v1/admin/users/{userId}/access-tokens:
    get:
      summary: List a user's Aura Historia access-token metadata as admin
      description: |
        Lists non-secret Aura Historia access-token metadata for the explicit target user.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `access-tokens:read`.
        Authorization is enforced in the User service, not only at the HTTP route.

        `userId` must be a valid User ID and the target user must exist. Expired and current tokens are included.
        Results use bounded keyset pagination in fixed `created ASC, AccessToken ID ASC` order.
        Page sizes are clamped to 1–100, with a default of 21. `searchAfter` is a JSON-encoded
        `[created RFC3339 timestamp, AccessToken ID]` cursor and is omitted on the terminal page.
        The cursor's creation timestamp is used only for continuation and is not returned as item metadata.
        Raw token values, token hashes, and masked token values are never returned.
      operationId: adminListUserAccessTokens
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user whose token metadata is listed.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        - name: size
          in: query
          required: false
          description: Requested page size. The server clamps it to 1–100; the default is 21.
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
          example: 21
        - name: searchAfter
          in: query
          required: false
          description: JSON-encoded `[created RFC3339 timestamp, AccessToken ID]` cursor from the previous page.
          schema:
            type: string
          example: '["2026-09-04T12:00:00Z","at_4ck23tcv0meqqrbyjaka24ra6g"]'
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: Secret-free access-token metadata for the target user.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only credential read.
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessTokenCollectionData"
              example:
                items:
                  - userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                    accessTokenId: at_4ck23tcv0meqqrbyjaka24ra6g
                    name: Incident review token
                    scopes:
                      - users:read
                    origin: User
                    expires: "2026-09-30T00:00:00Z"
                size: 21
                searchAfter:
                  - "2026-09-04T12:00:00Z"
                  - at_4ck23tcv0meqqrbyjaka24ra6g
        "400":
          description: Bad request - invalid target User ID, page size, or search-after cursor.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_user_id:
                  summary: Invalid target user identifier
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: userId
                      type: PATH
                    detail: must be a valid User ID
                invalid_query:
                  summary: Invalid page query
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: searchAfter
                      type: QUERY
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - the caller is not an administrator or a delegated credential lacks access-tokens:read.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "404":
          description: The target user does not exist.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
                detail: User was not found.
        "503":
          description: Access-token authorization or persistence is temporarily unavailable.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: ACCESS_TOKEN_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal access-token operation failure.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: ACCESS_TOKEN_INTERNAL_ERROR
    delete:
      summary: Revoke all of a user's Aura Historia access tokens as admin
      description: |
        Revokes all Aura Historia access tokens owned by the target user in one atomic PostgreSQL transaction.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `access-tokens:write`.
        Authorization is enforced in the User service, not only at the HTTP route.

        `userId` must be a valid User ID and the target user must exist. An existing user with no tokens and
        a repeated request both return `204 No Content`; a missing target user returns `404 USER_NOT_FOUND`.
        Deletion is scoped to the target user, leaves unrelated users' tokens untouched, and committed
        deletion makes the revoked credentials fail authentication. It never reveals raw token values or hashes.
      operationId: adminDeleteUserAccessTokens
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user whose tokens are revoked.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: All access tokens revoked, or no tokens were present for the existing target user.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only credential mutation.
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: Bad request - the user ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 400
                title: Bad Request
                error: INVALID_OBJECT_ID
                source:
                  field: userId
                  type: PATH
                detail: must be a valid User ID
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - the caller is not an administrator or a delegated credential lacks access-tokens:write.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "404":
          description: The target user does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
                detail: User was not found.
        "503":
          description: Access-token authorization or persistence is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: ACCESS_TOKEN_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal access-token operation failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: ACCESS_TOKEN_INTERNAL_ERROR

  /api/v1/admin/users/{userId}/access-tokens/{accessTokenId}:
    delete:
      summary: Revoke a user's Aura Historia access token as admin
      description: |
        Revokes one Aura Historia access token for the target user.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `access-tokens:write`.
        Authorization is enforced in the User service, not only at the HTTP route.

        Both `userId` and `accessTokenId` must be valid User and AccessToken IDs, respectively. The database deletion is scoped by both
        identifiers, so an access-token ID belonging to another user cannot revoke that user's
        credential. The operation is idempotent: it returns `204 No Content` when the token was
        deleted, was already absent, or belongs to another user. It never reveals raw token values
        or hashes.
      operationId: adminDeleteUserAccessToken
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user whose token is revoked.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        - name: accessTokenId
          in: path
          required: true
          description: Unique AccessToken ID for the access token to revoke.
          schema:
            type: string
          example: at_4ck23tcv0meqqrbyjaka24ra6g
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: Access token revoked, or already absent for the target user.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only credential mutation.
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: Bad request - the user ID or access-token ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_user_id:
                  summary: Invalid target user identifier
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: userId
                      type: PATH
                    detail: must be a valid User ID
                invalid_access_token_id:
                  summary: Invalid access-token identifier
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: accessTokenId
                      type: PATH
                    detail: must be a valid AccessToken ID
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - the caller is not an administrator or a delegated credential lacks access-tokens:write.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "503":
          description: Access-token authorization or persistence is temporarily unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: ACCESS_TOKEN_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal access-token operation failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: ACCESS_TOKEN_INTERNAL_ERROR
  /api/v1/me:
    delete:
      summary: Delete authenticated user
      description: "Permanently deletes the authenticated user's account.

        Business account deletion and backend credential invalidation are synchronous. The same transaction
        durably records a request for Cognito identity deletion; HTTP 204 confirms the commit, while provider removal retries
        asynchronously. Until it completes, Cognito sign-in may still succeed and the signup address may remain
        reserved. After removal, the email can register a new account with a new identity; the deleted account
        cannot be recovered. Minimal identity fences prevent delayed registration callbacks from recreating the
        deleted account and support provider reconciliation.

        Cognito JWTs and Aura Historia access tokens are accepted; delegated access tokens require `users:write`.

        The last active administrator cannot be deleted.

        "
      operationId: deleteUser
      tags:
        - User Account
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: User deleted successfully
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "401":
          description: Unauthorized - invalid or missing bearer credentials
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "409":
          description: Conflict - the last active administrator cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 409
                title: Conflict
                error: CONFLICT
                detail: At least one active administrator must remain.
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
  /api/v1/me/account:
    get:
      summary: Get user account data
      description:
        "Retrieves the authenticated user's account information including email, name, language and currency preferences,

        the `showUnassessedOrSensitiveContent` preference, the user's subscription tier, and the user's role.

        Requires valid Cognito JWT authentication.

        "
      operationId: getUserAccount
      tags:
        - User Account
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User account data retrieved successfully
          headers:
            Last-Modified:
              description: When the user account was last updated
              schema:
                type: string
                format: http-date
              example: Wed, 01 Jan 2024 12:00:00 GMT
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnUserAccountData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                email: user@example.com
                firstName: John
                lastName: Doe
                language: en
                currency: EUR
                showUnassessedOrSensitiveContent: false
                tier: FREE
                role: USER
                created: "2024-01-01T10:00:00Z"
                updated: "2024-01-01T12:00:00Z"
        "401":
          description: Unauthorized - invalid or missing JWT token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: UNAUTHORIZED
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
    patch:
      summary: Update user account data
      description: "Updates the authenticated user's account information.

        All fields in the request body are optional - only provided fields will be updated.

        The user's `role` is returned in the response but cannot be updated through this endpoint.

        Returns the updated user account data.

        Requires valid Cognito JWT authentication.

        "
      operationId: updateUserAccount
      tags:
        - User Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        description: "Partial user account update data.

          All fields are optional - only provided fields will be updated.

          "
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserAccountData"
            examples:
              update_all:
                summary: Update all fields
                value:
                  firstName: Jane
                  lastName: Smith
                  language: de
                  currency: USD
                  showUnassessedOrSensitiveContent: true
              update_name_only:
                summary: Update name only
                value:
                  firstName: Jane
                  lastName: Smith
              update_preferences_only:
                summary: Update language and currency only
                value:
                  language: fr
                  currency: GBP
              update_content_visibility_preference_only:
                summary: Update content visibility preference only
                value:
                  showUnassessedOrSensitiveContent: true
      responses:
        "200":
          description: User account updated successfully
          headers:
            Last-Modified:
              description: When the user account was last updated
              schema:
                type: string
                format: http-date
              example: Wed, 01 Jan 2024 12:30:00 GMT
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnUserAccountData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                email: jane.smith@example.com
                firstName: Jane
                lastName: Smith
                language: de
                currency: USD
                showUnassessedOrSensitiveContent: true
                tier: FREE
                role: USER
                created: "2024-01-01T10:00:00Z"
                updated: "2024-01-01T12:30:00Z"
        "400":
          description: Bad request - invalid request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty
                invalid_json:
                  summary: Invalid JSON format
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Invalid JSON format
        "401":
          description: Unauthorized - invalid or missing JWT token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: UNAUTHORIZED
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
  /api/v1/me/access-tokens:
    post:
      summary: Create an Aura Historia access token
      description:
        "Creates a new Aura Historia access token for the authenticated user.

        The response includes the plaintext bearer token once. List, get, and update responses contain only
        secret-free metadata and never return the bearer token again.

        Accepts Cognito access JWTs or Aura Historia opaque bearer access tokens. Aura Historia access tokens require
        the delegated `access-tokens:write` capability.

        "
      operationId: postMyAccessToken
      tags:
        - User Account
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Access-token creation payload.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAccessTokenData"
            example:
              name: Partner product sync
              scopes:
                - product-listings:write
              expires: "2026-06-30T00:00:00Z"
      responses:
        "201":
          description: Access token created successfully
          headers:
            Cache-Control:
              description: Caching directive. Always set to `no-store`.
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccessTokenData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                accessTokenId: at_4ck23tcv0meqqrbyjaka24ra6g
                accessToken: aurahistoria_abcdefghijk_abcdefghijklmnopqrstuvwxyz1234567
        "400":
          description: Bad request - missing, empty, or invalid JSON body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Request body is required.
                invalid_scope:
                  summary: Unsupported access-token scope value
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
