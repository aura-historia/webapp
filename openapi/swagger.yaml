      required:
        - shipping
        - productListingId
        - eventId
        - source
        - sourceListingId
        - pricing
        - availability
        - lifecycle
        - url
        - viewUrl
        - images
        - auction
        - lot
        - created
        - updated
      properties:
        shipping:
          anyOf:
          - $ref: '#/components/schemas/AdvertisedListingShippingData'
          - type: object
            nullable: true
            enum:
            - null
        productListingId:
          type: string
        productListingTitleSlugId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
          description: Immutable Aura-owned public locator. Omitted when the listing is redacted as hidden.
          example: museum-cabinet-18-19-century-a1b2c3
        eventId:
          type: string
        source:
          $ref: "#/components/schemas/ProductListingSourceData"
        sourceListingId:
          type: string
        productTitle:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
          description: Original normalized title. Truncation ellipses remain stable; legacy constructor trailing whitespace is presented trimmed.
        productDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        pricing:
          type: object
          required:
            - source
            - display
            - valuation
          properties:
            source:
              $ref: "#/components/schemas/ProductListingPricingData"
            display:
              $ref: "#/components/schemas/ProductListingPricingData"
            valuation:
              $ref: "#/components/schemas/ProductListingPricingValuationData"
        availability:
          anyOf:
          - $ref: '#/components/schemas/ListingAvailabilityData'
          - type: object
            nullable: true
            enum:
            - null
        lifecycle:
          $ref: "#/components/schemas/ListingLifecycleData"
        url:
          type: string
          format: uri
        viewUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductListingImageData"
        contentPolicy:
          anyOf:
          - $ref: '#/components/schemas/ContentPolicyData'
          - type: object
            nullable: true
            enum:
            - null
        auction:
          anyOf:
          - $ref: '#/components/schemas/AuctionSummaryData'
          - type: object
            nullable: true
            enum:
            - null
          description: Current parent Auction presentation from the joined PostgreSQL detail read. Null when the
            listing has no parent Auction.
        lot:
          anyOf:
          - $ref: '#/components/schemas/ProductListingLotData'
          - type: object
            nullable: true
            enum:
            - null
          description: Listing-owned lot facts. Null when the listing has no lot facts.
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
          description: Time of the last committed change to listing-owned state, including enrichment (translations, embedding, geography, shipping summary, content assessment and delivery evidence). Strictly increasing per listing, with each new value at millisecond precision; FX changes and response-time composition do not advance it.
    ProductListingLotData:
      type: object
      additionalProperties: false
      required:
        [
          lotNumber,
          cataloguePosition,
          biddingOpens,
          scheduledCloses,
          reportedClosedAt,
        ]
      description: Listing-owned lot facts. These facts may exist without a parent Auction.
      properties:
        lotNumber:
          type: string
          nullable: true
        cataloguePosition:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
        biddingOpens:
          type: string
          format: date-time
          nullable: true
        scheduledCloses:
          type: string
          format: date-time
          nullable: true
        reportedClosedAt:
          type: string
          format: date-time
          nullable: true
    ProductListingPricingData:
      type: object
      properties:
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
    ProductListingPricingValuationData:
      oneOf:
        - type: object
          required:
            - type
            - fxRateId
            - capturedAt
          properties:
            type:
              type: string
              enum:
                - CURRENT
            fxRateId:
              type: string
            capturedAt:
              type: string
              format: date-time
        - type: object
          required:
            - type
            - fxRateId
            - capturedAt
            - observedAt
          properties:
            type:
              type: string
              enum:
                - SALE_OBSERVATION
            fxRateId:
              type: string
            capturedAt:
              type: string
              format: date-time
            observedAt:
              type: string
              format: date-time
    PersonalizedProductListingDetailsData:
      type: object
      description: Canonical Product detail with optional user-specific state.
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/ProductListingDetailsData"
        userState:
          allOf:
            - $ref: "#/components/schemas/ProductListingUserStateData"
          nullable: true
          description: Present only for a valid user or delegated-user bearer token.
    PersonalizedProductListingSummaryData:
      type: object
      description: Canonical Product summary with optional user-specific state.
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/ProductListingSummaryData"
        userState:
          allOf:
            - $ref: "#/components/schemas/ProductListingUserStateData"
          nullable: true
          description: Present only for a valid user or delegated-user bearer token.
    ProductListingSearchResultData:
      type: object
      description: Cursor-paged canonical Product search response.
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalizedProductListingSummaryData"
          description: Personalized Product summaries in OpenSearch result order.
        size:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of items returned in the current page.
          example: 21
        total:
          type: integer
          minimum: 0
          nullable: true
          description:
            Total matching product-listings for BM25 search when the backend provides it. Hybrid BM25 plus KNN
            search omits this value because its fused candidate pool is not a reliable total.
          example: 127
        searchAfter:
          allOf:
            - $ref: "#/components/schemas/ProductListingSearchCursorData"
          nullable: true
          description: Opaque cursor for the next page. It must be sent back as one JSON-encoded `searchAfter` query value.
    ProductListingSearchCursorData:
      type: object
      required:
        - fxRateId
        - searchAfter
      properties:
        fxRateId:
          type: string
          description: Persisted FX snapshot used for active Product filtering and display values in this cursor chain.
        searchAfter:
          type: array
          items: {}
          description: Internal OpenSearch continuation token.
      example:
        fxRateId: fx_0cwktgjtwnf4tb6hf2f8zm0x5k
        searchAfter:
          - 2999
          - pl_5xdb465tg1enarx2knf04mxbxj

    ProductListingUserStateData:
      type: object
      description: User-specific state information for a product
      required:
        - watchlist
        - contentVisibility
        - notification
        - searchFilter
      properties:
        shipping:
          $ref: '#/components/schemas/PersonalizedListingShippingData'
        watchlist:
          $ref: "#/components/schemas/WatchlistUserStateData"
        contentVisibility:
          $ref: "#/components/schemas/ContentVisibilityUserStateData"
        notification:
          $ref: "#/components/schemas/NotificationUserStateData"
        searchFilter:
          $ref: "#/components/schemas/SearchFilterUserStateData"
    WatchlistUserStateData:
      type: object
      description: Watchlist-specific user state for a product
      required:
        - watching
        - notifications
      properties:
        watching:
          type: boolean
          description: Whether the product is on the user's watchlist
          example: true
        notifications:
          type: boolean
          description: Whether notifications are enabled for this watchlist product
          example: false
    ContentVisibilityUserStateData:
      type: object
      description: Stored viewer preference used when presenting unassessed or sensitive listing content.
      required:
        - showUnassessedOrSensitiveContent
      properties:
        showUnassessedOrSensitiveContent:
          type: boolean
          description: Whether unassessed or sensitive content may be shown to this viewer.
          example: false
    NotificationUserStateData:
      type: object
      description: Unseen notification IDs for this product, ordered newest first.
      required:
        - unseenNotificationIds
      properties:
        unseenNotificationIds:
          type: array
          description: Every unseen Notification ID for this product. Empty when none exist.
          default: []
          items:
            type: string
    SearchFilterUserStateData:
      type: object
      description: "User's saved-search-filter match state for a product.

        When `matched` is `true`, at least one of the user's saved search filters matched this product.

        `userSearchFilterId`, `userSearchFilterName`, and `matchFeedback` are only

        present when `matched` is `true`.

        Defaults to `matched: false` when the user has no saved search filters or none of them matched.

        When `hidden` is `true`, the match exceeds the user's monthly search-filter match quota and the

        product data is anonymized (valid synthetic object IDs, placeholder title, unknown enums, nulled timestamps).

        Only matches ranked beyond the quota (by ascending match creation time) are hidden;

        the first N matches (where N is the user's tier quota) remain fully visible.

        "
      required:
        - matched
        - hidden
      properties:
        shippingMatchValuation:
          allOf: [{$ref: '#/components/schemas/ShippingMatchValuationData'}]
          description: Present on saved-filter match listing responses when the match used an explicit FX shipping maximum.
        matched:
          type: boolean
          description: Whether any of the user's saved search filters matched this product. Defaults to `false`.
          default: false
          example: true
        hidden:
          type: boolean
          description:
            "Whether this match is hidden because the user has exceeded their monthly search-filter match quota.

            When `true`, the product data in the response is anonymized: object-ID fields are replaced with valid synthetic IDs using their documented prefixes,

            the title becomes a language-specific placeholder, enum fields are set to their unknown variants, optional fields are omitted, and

            timestamps are set to the Unix epoch.

            Defaults to `false`.

            "
          default: false
          example: false
        userSearchFilterId:
          type: string
          description:
            "The ID of the saved search filter that matched this product.

            Present only when `matched` is `true`; omitted otherwise.

            "
          example: sf_4hyqf0gyxveazss7nby5hve5x2
        userSearchFilterName:
          type: string
          description:
            "The user-defined name of the saved search filter that matched this product.

            Present only when `matched` is `true`; omitted otherwise.

            "
          example: Vintage Art Deco
        matchFeedback:
          type: boolean
          description:
            "Optional feedback previously recorded by the authenticated user for this saved-search match.

            Present only when `matched` is `true` and feedback has been explicitly stored for the match.

            `true` marks the match as relevant, `false` marks it as not relevant.

            "
          example: true
    LocalizedTextData:
      type: object
      description: Text content with language information
      required:
        - text
        - language
      properties:
        text:
          type: string
          description: The text content
        language:
          $ref: "#/components/schemas/LanguageData"
    PriceData:
      type: object
      description: Price information with currency
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyData"
        amount:
          type: integer
          description: Price amount in minor currency units (e.g., cents for most supported currencies, whole yen for JPY)
          minimum: 0
          example: 2999
    ProductListingPriceData:
      oneOf:
        - type: object
          required:
            - type
            - currency
            - amount
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [MONETARY]
            currency:
              $ref: "#/components/schemas/CurrencyData"
            amount:
              type: integer
              minimum: 0
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [ON_REQUEST]
    ProductListingHistoryPriceDisplayData:
      allOf:
        - $ref: "#/components/schemas/PriceData"
        - type: object
          required:
            - fxRateId
            - capturedAt
          properties:
            fxRateId:
              type: string
              description: Immutable FX snapshot selected at or before the entry timestamp.
            capturedAt:
              type: string
              format: date-time
              description: Capture time of that snapshot, never after the history entry timestamp.
      description: HalfUp display amount in requested currency minor units (JPY/KRW 0 decimals, others 2). Omitted when the snapshot or a required quote is unavailable, including in a complete legacy 19-currency snapshot.
    ProductListingHistoryEstimateData:
      allOf:
        - $ref: "#/components/schemas/PriceData"
        - type: object
          properties:
            display:
              $ref: "#/components/schemas/ProductListingHistoryPriceDisplayData"
      description: Unchanged source estimate with optional historical display projection.
    ProductListingHistoryMainPriceData:
      oneOf:
        - type: object
          required:
            - type
            - currency
            - amount
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [MONETARY]
            currency:
              $ref: "#/components/schemas/CurrencyData"
            amount:
              type: integer
              minimum: 0
            display:
              $ref: "#/components/schemas/ProductListingHistoryPriceDisplayData"
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [ON_REQUEST]
      description: Unchanged source main price; only monetary values can have historical display projections.
    ProductListingHistoryPricingData:
      type: object
      properties:
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingHistoryMainPriceData"
          nullable: true
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/ProductListingHistoryEstimateData"
          nullable: true
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/ProductListingHistoryEstimateData"
          nullable: true
    ProductListingHistoryEntryData:
      type: object
      description: One immutable committed ProductListing domain-history entry.
      required:
        - eventType
        - productListingId
        - eventId
        - payload
        - timestamp
      properties:
        eventType:
          $ref: "#/components/schemas/ProductListingHistoryEntryTypeData"
        productListingId:
          type: string
          description: Unique internal ProductListing identifier
        eventId:
          type: string
          description: Unique identifier for this committed event
        payload:
          $ref: "#/components/schemas/ProductListingHistoryPayloadData"
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (RFC3339 format)
    LanguageData:
      type: string
      enum:
        - de
        - en
        - fr
        - es
        - it
        - zh
        - pt
        - pl
        - tr
        - nl
        - cs
        - ja
        - ru
        - ar
      description: "Supported language codes (ISO 639-1 canonical values):

        - de: German (includes de-DE, de-AT, de-CH, de-LU, de-LI)

        - en: English (includes en-US, en-GB, en-AU, en-CA, en-NZ, and backend-specific accepted alias en_IE)

        - fr: French (includes fr-FR, fr-CA, fr-BE, fr-CH, fr-LU)

        - es: Spanish (includes es-ES, es-MX, es-AR, es-CO, es-CL, es-PE, es-VE)

        - it: Italian (includes it-IT, it-CH)

        - zh: Chinese (Simplified) (includes zh-CN, zh-Hans)

        - pt: Portuguese (includes pt-PT, pt-BR)

        - pl: Polish (includes pl-PL)

        - tr: Turkish (includes tr-TR)

        - nl: Dutch (includes nl-NL, nl-BE)

        - cs: Czech (includes cs-CZ)

        - ja: Japanese (includes ja-JP)

        - ru: Russian (includes ru-RU)

        - ar: Arabic (includes ar-SA, ar-EG, ar-AE)


        `de`, `en`, `fr`, `es`, and `it` are fully supported localization/translation-target languages.

        `zh`, `pt`, `pl`, `tr`, `nl`, `cs`, `ja`, `ru`, and `ar` are ingestion-only languages:

        they can appear in stored/native content and are accepted anywhere `LanguageData` is used,

        but backend-generated translations and fallback localized strings are not produced in these languages.

        "
      default: en
      example: de
    CurrencyData:
      type: string
      enum:
        - EUR
        - GBP
        - USD
        - AUD
        - CAD
        - NZD
        - CNY
        - BRL
        - PLN
        - TRY
        - JPY
        - CZK
        - RUB
        - AED
        - SAR
        - HKD
        - SGD
        - CHF
        - ZAR
        - SEK
        - DKK
        - NOK
        - KRW
        - INR
        - TWD
        - HUF
        - RON
        - MXN
        - THB
        - ARS
      description: "Supported currencies (ISO 4217 codes):

        - EUR: Euro

        - GBP: British Pound

        - USD: US Dollar

        - AUD: Australian Dollar

        - CAD: Canadian Dollar

        - NZD: New Zealand Dollar

        - CNY: Chinese Yuan

        - BRL: Brazilian Real

        - PLN: Polish Złoty

        - TRY: Turkish Lira

        - JPY: Japanese Yen

        - CZK: Czech Koruna

        - RUB: Russian Ruble

        - AED: UAE Dirham

        - SAR: Saudi Riyal

        - HKD: Hong Kong Dollar

        - SGD: Singapore Dollar

        - CHF: Swiss Franc

        - ZAR: South African Rand

        - SEK: Swedish Krona

        - DKK: Danish Krone

        - NOK: Norwegian Krone

        - KRW: South Korean Won

        - INR: Indian Rupee

        - TWD: New Taiwan Dollar

        - HUF: Hungarian Forint

        - RON: Romanian Leu

        - MXN: Mexican Peso

        - THB: Thai Baht

        - ARS: Argentine Peso (2 minor-unit decimal places)

        "
      default: EUR
      example: EUR
    MeasurementUnitData:
      type: string
      enum:
        - METRIC
        - IMPERIAL
      description: "User preference for distance/size presentation:

        - METRIC: Metric units.

        - IMPERIAL: Imperial units.

        "
      default: METRIC
      example: METRIC
    ListingAvailabilityData:
      type: string
      enum:
        - AVAILABLE
        - IN_STOCK
        - LIMITED_AVAILABILITY
        - BACK_ORDER
        - MADE_TO_ORDER
        - PRE_ORDER
        - PRE_SALE
        - UNAVAILABLE
        - RESERVED
        - OUT_OF_STOCK
        - SOLD_OUT
      description:
        Current reliable source assertion of listing purchase availability. Omitted or `null` means Aura has no
        reliable current assertion.
      example: IN_STOCK
    ListingOrderabilityData:
      type: string
      enum:
        - ORDERABLE_NOW
        - ORDERABLE_CONDITIONALLY
        - NOT_ORDERABLE
      description: Broad classification derived from a concrete availability assertion; it is not independently stored.
      example: ORDERABLE_NOW
    ListingLifecycleData:
      type: string
      enum:
        - ACTIVE
        - WITHDRAWN
      description: "Source-catalog membership of a ProductListing:

        - ACTIVE: The listing is currently offered by its authoritative source.

        - WITHDRAWN: The listing is retained for history but is no longer offered.

        "
      example: ACTIVE
    ProductListingAuctionData:
      type: object
      additionalProperties: false
      description: Partner ProductListing nested write patch. `auctionId` must identify an existing Auction for the same ListingSource. Omit it to preserve membership, send null to clear membership, or send a value to set it. Omit a lot/timing leaf to preserve it, send null to clear a clearable leaf, or send a value to set it.
      properties:
        auctionId:
          type: string
          nullable: true
          description: Existing same-ListingSource Aura Auction TypeID. Omit to preserve membership; send null to clear it.
          example: auc_01jgfjjz4ne2g0000000000000
        lotNumber:
          type: string
          maxLength: 128
          nullable: true
          description: Omit to preserve the lot label; send null to clear it; send a value to set it.
          example: "42A"
        cataloguePosition:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: Omit to preserve the catalogue position; send null to clear it; send a value to set it.
          example: 7
        timing:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionTimesData"
          nullable: true
    ProductListingAuctionFactsData:
      type: object
      additionalProperties: false
      required:
        [
          lotNumber,
          cataloguePosition,
          biddingOpens,
          scheduledCloses,
          reportedClosedAt,
        ]
      description: Immutable historical listing-owned Auction and lot facts. Their presence has no separate meaning. They never expose a source Auction key or shared Auction metadata.
      properties:
        auctionId:
          type: string
          description: Resolved Aura Auction TypeID. Omitted when no resolved membership is present.
        lotNumber:
          type: string
          nullable: true
          description: Optional source-assigned lot label.
        cataloguePosition:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          nullable: true
          description: Optional one-based source catalogue position.
        biddingOpens:
          type: string
          format: date-time
          nullable: true
        scheduledCloses:
          type: string
          format: date-time
          nullable: true
        reportedClosedAt:
          type: string
          format: date-time
          nullable: true

    ProductListingAuctionTimesData:
      type: object
      additionalProperties: false
      description: Omit each leaf to preserve it; send null to clear it; values are RFC3339 instants.
      properties:
        biddingOpens: { type: string, format: date-time, nullable: true }
        scheduledCloses: { type: string, format: date-time, nullable: true }
        reportedClosedAt: { type: string, format: date-time, nullable: true }

    PriceEstimateData:
      type: object
      description: "Price estimate range for a product.

        Contains optional minimum and maximum estimated prices.

        "
      properties:
        min:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional minimum estimated price for the product
        max:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional maximum estimated price for the product
    PricingData:
      type: object
      description: "Complete pricing information for a product.

        Contains both the offer price and optional price estimates.

        "
      properties:
        offer:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: "The actual offer or asking price for the product.

            This is the price at which the product is currently being sold.

            "
        estimate:
          allOf:
            - $ref: "#/components/schemas/PriceEstimateData"
          nullable: true
          description: "Optional price estimate range.

            Common for auction items where an estimated value range is provided.

            "
    ProductListingImageData:
      type: object
      description: Product image after viewer-specific presentation.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: URL to the product image, or `null` when it is not shown to this viewer.
          example: https://my-listing-source.com/images/product-1.jpg
    ContentPolicyData:
      oneOf:
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              enum:
                - ALLOWED
        - type: object
          required:
            - decision
            - category
          properties:
            decision:
              type: string
              enum:
                - REQUIRES_CONSENT
            category:
              type: string
              enum:
                - NAZI_GERMANY
      description: Listing-level content decision. This schema is used only when the listing has an assessment.
    SortProductListingFieldData:
      type: string
      enum:
        - score
        - updated
        - created
      description: "Fields available for sorting:

        - score: Sort by relevance score (default, only available when searching with text query)

        - updated: Sort by last updated timestamp

        - created: Sort by creation timestamp

        "
      default: score
      example: updated
    ProductListingHistoryEntryTypeData:
      type: string
      enum:
        - PRODUCT_LISTING_DISCOVERED
        - PRODUCT_LISTING_CHANGED
      description: Canonical ProductListing domain-history entry type.
      example: PRODUCT_LISTING_CHANGED
    ProductListingHistoryPayloadData:
      oneOf:
        - $ref: "#/components/schemas/ProductListingDiscoveryHistoryPayloadData"
        - $ref: "#/components/schemas/ProductListingChangedHistoryPayloadData"
      description: Immutable semantic history payload. It never contains image URLs or enrichment data.
    ProductListingDiscoveryHistoryPayloadData:
      type: object
      required:
        - listingSourceId
        - sourceListingId
        - pricing
        - availability
        - url
        - imageCount
        - auction
      properties:
        listingSourceId:
          type: string
        sourceListingId:
          type: string
        title:
          description: Normalized discovery title, with legacy constructor trailing whitespace presented trimmed without rewriting the stored event.
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
        description:
          $ref: "#/components/schemas/LocalizedTextData"
        pricing:
          $ref: "#/components/schemas/ProductListingHistoryPricingData"
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
        url:
          type: string
          format: uri
        imageCount:
          type: integer
          format: int64
          minimum: 0
        auction:
          allOf:
            - $ref: "#/components/schemas/ProductListingAuctionFactsData"
          nullable: true
    ProductListingChangedHistoryPayloadData:
      type: object
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          description: "Deterministic semantic-change order: main price, minimum estimate, maximum estimate, availability, URL, images, auction, lifecycle, sale observation, delivery."
          items:
            $ref: "#/components/schemas/ProductListingHistoryChangeData"
    ProductListingHistoryChangeData:
      oneOf:
        - $ref: "#/components/schemas/ProductListingDeliveryHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingMainPriceHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingPriceHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingAvailabilityHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingUrlHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingImagesHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingAuctionHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingWithdrawalHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingRestorationHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingSaleObservationHistoryChangeData"
      description: Typed semantic change.
    ProductListingMainPriceHistoryChangeData:
