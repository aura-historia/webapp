name: Apply production Durable Object migrations

# `wrangler versions upload`, which production releases use, cannot apply Durable Object
# migrations. Run this once for the first release tag that adds a migration in `wrangler.jsonc`:
# it builds that tag and deploys it with `wrangler deploy`, which applies the migration and records
# the same tagged version, so later releases and redeploys use the usual workflows again.

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: Immutable UTC release tag that introduces the migration (YYYYMMDD-HHMM)
                required: true
                type: string

permissions:
    contents: read
    deployments: write

jobs:
    migrate:
        name: Deploy ${{ inputs.release_tag }} with migrations
        runs-on: ubuntu-latest
        timeout-minutes: 10
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        environment:
            name: production
            url: https://aura-historia.com
        env:
            VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
            VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
            VITE_API_URL: ${{ vars.VITE_API_URL }}
            VITE_APP_URL: ${{ vars.VITE_APP_URL }}
            VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
            VITE_COGNITO_REDIRECT_SIGN_IN: ${{ vars.VITE_COGNITO_REDIRECT_SIGN_IN }}
            VITE_COGNITO_REDIRECT_SIGN_OUT: ${{ vars.VITE_COGNITO_REDIRECT_SIGN_OUT }}
            VITE_FEATURE_LOGIN_ENABLED: ${{ vars.VITE_FEATURE_LOGIN_ENABLED }}
            VITE_FEATURE_SEARCH_ENABLED: ${{ vars.VITE_FEATURE_SEARCH_ENABLED }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate protected release tag
              shell: bash
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  git fetch --tags --force

                  if [[ ! "$RELEASE_TAG" =~ ^[0-9]{8}-[0-9]{4}$ ]]; then
                      echo "Release tags must use YYYYMMDD-HHMM; received: $RELEASE_TAG" >&2
                      exit 1
                  fi

                  release_timestamp="${RELEASE_TAG:0:8} ${RELEASE_TAG:9:2}:${RELEASE_TAG:11:2}"
                  canonical_tag="$(date -u -d "$release_timestamp" +%Y%m%d-%H%M 2>/dev/null || true)"
                  if [[ "$canonical_tag" != "$RELEASE_TAG" ]]; then
                      echo "Release tag is not a valid UTC calendar timestamp: $RELEASE_TAG" >&2
                      exit 1
                  fi

                  git fetch --no-tags origin develop:refs/remotes/origin/develop
                  tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
                  if ! git merge-base --is-ancestor "$tag_commit" origin/develop; then
                      echo "Release tag must point to a commit in the develop history." >&2
                      exit 1
                  fi

                  git checkout --detach "refs/tags/$RELEASE_TAG"

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build application
              run: pnpm run build

            - name: Deploy tagged Worker with Durable Object migrations
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --name aura-historia --tag ${{ inputs.release_tag }} --message "Release ${{ inputs.release_tag }} (applies Durable Object migrations)"
