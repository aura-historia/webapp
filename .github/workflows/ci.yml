name: CI

on:
    push:
        branches: [develop]
        tags:
            - "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]"
    pull_request:
        branches: [develop]

permissions:
    contents: read
    actions: read
    deployments: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Biome lint
              run: pnpm biome ci .

    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Fetch translation comparison base
              run: git fetch --depth=1 origin develop:refs/remotes/origin/develop

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Typescript Compiler
              run: pnpm exec tsc --noEmit

            - name: Run tests with coverage
              run: pnpm run test --coverage

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-reports
                  path: coverage/
                  retention-days: 5

    sonarqube:
        name: SonarQube Analysis
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [test]
        if: github.actor != 'dependabot[bot]'
        steps:
            - name: Checkout code
              id: checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

            - name: Download coverage artifact
              uses: actions/download-artifact@v8
              with:
                  name: coverage-reports
                  path: coverage/

            - name: SonarQube Scan
              uses: SonarSource/sonarqube-scan-action@v8
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [lint, test, sonarqube]
        env:
            VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
            VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
            VITE_APP_URL: ${{ vars.VITE_APP_URL }}
            # Feature flags - will be overridden per environment in deploy job
            VITE_FEATURE_LOGIN_ENABLED: "true"
            VITE_FEATURE_SEARCH_ENABLED: "true"
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build application
              run: pnpm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build-artifacts
                  path: |
                      .output
                      dist

    deploy-staging:
        name: Deploy staging to Cloudflare
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build]
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        environment:
            name: staging
            url: https://stage.aura-historia.com
        env:
            VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
            VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
            VITE_API_URL: ${{ vars.VITE_API_URL }}
            VITE_APP_URL: ${{ vars.VITE_APP_URL }}
            VITE_FEATURE_LOGIN_ENABLED: ${{ vars.VITE_FEATURE_LOGIN_ENABLED }}
            VITE_FEATURE_SEARCH_ENABLED: ${{ vars.VITE_FEATURE_SEARCH_ENABLED }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build application
              run: pnpm run build

            - name: Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: deploy --name aura-historia-staging

    deploy-production:
        name: Release production to Cloudflare
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: [build]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        environment:
            name: production
            url: https://aura-historia.com
        env:
            VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
            VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
            VITE_API_URL: ${{ vars.VITE_API_URL }}
            VITE_APP_URL: ${{ vars.VITE_APP_URL }}
            VITE_FEATURE_LOGIN_ENABLED: ${{ vars.VITE_FEATURE_LOGIN_ENABLED }}
            VITE_FEATURE_SEARCH_ENABLED: ${{ vars.VITE_FEATURE_SEARCH_ENABLED }}
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate release tag
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME}"
                  if [[ ! "$tag" =~ ^[0-9]{8}-[0-9]{4}$ ]]; then
                      echo "Release tags must use YYYYMMDD-HHMM; received: $tag" >&2
                      exit 1
                  fi

                  release_timestamp="${tag:0:8} ${tag:9:2}:${tag:11:2}"
                  canonical_tag="$(date -u -d "$release_timestamp" +%Y%m%d-%H%M 2>/dev/null || true)"
                  if [[ "$canonical_tag" != "$tag" ]]; then
                      echo "Release tag is not a valid UTC calendar timestamp: $tag" >&2
                      exit 1
                  fi

                  git fetch --no-tags origin develop:refs/remotes/origin/develop
                  tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
                  if ! git merge-base --is-ancestor "$tag_commit" origin/develop; then
                      echo "Release tag must point to a commit in the develop history." >&2
                      echo "Tag commit:     $tag_commit" >&2
                      echo "Develop head:   $(git rev-parse origin/develop)" >&2
                      exit 1
                  fi

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Set up pnpm
              run: |
                  npm install --global pnpm@11.17.0
                  pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build application
              run: pnpm run build

            - name: Upload tagged Worker version
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: versions upload --name aura-historia --tag ${{ github.ref_name }} --message "Release ${{ github.ref_name }}"

            - name: Deploy tagged Worker version
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: versions deploy --yes --name aura-historia --version-tag ${{ github.ref_name }} --message "Release ${{ github.ref_name }}"
