# Prevent packages from being released until they have been in the registry for at least 24 hours (1440 minutes)
# This protects against supply chain attacks, since infected packages are usually found within the first 24 hours of being published.
packages:
  - "."

allowBuilds:
  esbuild: true
  sharp: true
  vue-demi: false
  workerd: true

minimumReleaseAge: 1440

# parse5-parser-stream 8.1 uses Tokenizer.flushCharacters, which parse5 8.0 lacks.
# Keep its parse5 dependency aligned with jsdom 31's parse5 8.1 version.
overrides:
  'parse5-parser-stream@8.1.0>parse5': 8.1.0
