  /api/v1/admin/users:
    get:
      summary: Search users as admin
      description:
        "Searches users across all accounts for authenticated administrators.

        Text filters use case-insensitive substring matching. `query` searches email,

        first name, and last name; `email`, `firstName`, and `lastName` restrict the

        match to one field. `tier` and `role` filters use exact values.

        Results use deterministic keyset pagination. The default sort is `name` ascending;

        override it by providing both `sort` and `order`. Every sort uses `userId` as a

        deterministic tie-breaker. This response always uses `Cache-Control: no-store`.

        "
      operationId: adminSearchUsers
      tags:
        - User Account
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: query
          in: query
          required: false
          description: Optional case-insensitive substring query across email, first name, and last name.
          schema:
            type: string
          example: ada
        - name: email
          in: query
          required: false
          description: Optional case-insensitive substring filter for the email address.
          schema:
            type: string
          example: ada@example.com
        - name: firstName
          in: query
          required: false
          description: Optional case-insensitive substring filter for the first name.
          schema:
            type: string
          example: Ada
        - name: lastName
          in: query
          required: false
          description: Optional case-insensitive substring filter for the last name.
          schema:
            type: string
          example: Lovelace
        - name: tier
          in: query
          required: false
          description: Optional filter by one or more user subscription tiers.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/UserTierData"
            uniqueItems: true
          example:
            - PRO
            - ULTIMATE
        - name: role
          in: query
          required: false
          description: Optional filter by one or more user roles.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/UserRoleData"
            uniqueItems: true
          example:
            - ADMIN

        - name: created[min]
          in: query
          required: false
          description: Optional lower bound for the user's `created` timestamp (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-01-01T00:00:00Z"
        - name: created[max]
          in: query
          required: false
          description: Optional upper bound for the user's `created` timestamp (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-12-31T23:59:59Z"
        - name: updated[min]
          in: query
          required: false
          description: Optional lower bound for the user's `updated` timestamp (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-04-01T00:00:00Z"
        - name: updated[max]
          in: query
          required: false
          description: Optional upper bound for the user's `updated` timestamp (RFC3339).
          schema:
            type: string
            format: date-time
          example: "2026-04-25T23:59:59Z"
        - name: sort
          in: query
          required: false
          description:
            "Field used for ordering results. Valid fields are `name`, `email`, `firstName`, `lastName`, `tier`, `role`, `created`, and `updated`.

            The default is `name` ascending. To override it, provide both `sort` and `order`.

            "
          schema:
            $ref: "#/components/schemas/SortUserFieldData"
          example: email
        - name: order
          in: query
          required: false
          description:
            "Sort direction for `sort`. Ignored unless `sort` is also provided; when both are absent, results use `name` ascending.

            "
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
        - name: searchAfter
          in: query
          required: false
          description:
            "Opaque User ID cursor for keyset pagination. Pass the `searchAfter` string returned by the previous response to fetch the next page.

            Requests may also provide the legacy JSON array form when its final element is a valid User ID. The cursor is valid only with the same filters and sort used for the previous page.

            "
          schema:
            type: string
          example: usr_01jw7j4azge008000000000004
        - name: sort
        - name: size
          in: query
          required: false
          description: Number of users requested per page. The server clamps values to the inclusive range 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 21
          example: 21
      responses:
        "200":
          description: Users returned successfully.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only user read.
              schema:
                type: string
              example: no-store
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCollectionData"
              example:
                items:
                  - userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                    email: ada.admin@example.com
                    firstName: Ada
                    lastName: Lovelace
                    tier: ULTIMATE
                    role: ADMIN
                    stripeCustomerId: cus_admin_550e8400e29b41d4a716446655440000
                  - userId: usr_681w9znhe8eawrhebxd1046d44
                    email: grace.user@example.com
                    firstName: Grace
                    lastName: Hopper
                    tier: PRO
                    role: USER
                size: 2
                searchAfter: usr_681w9znhe8eawrhebxd1046d44
        "400":
          description: Bad request - invalid query parameters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_query:
                  summary: Invalid query parameter
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                invalid_sort_field:
                  summary: Invalid sort field
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_SORT_VALUE
                    source:
                      field: sort
                      type: QUERY
                    detail:
                      "Expected any of: 'name', 'email', 'firstName', 'lastName', 'tier', 'role', 'updated',
                      'created'. Got: 'invalid'"
                invalid_order:
                  summary: Invalid sort order
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_ORDER_VALUE
                    source:
                      field: order
                      type: QUERY
                    detail: "Expected any of: 'asc', 'desc'. Got: 'invalid'"
                invalid_search_after:
                  summary: Invalid searchAfter cursor
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: searchAfter
                      type: QUERY
                    detail: "searchAfter must contain a valid User ID."
                invalid_size:
                  summary: Invalid page size
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: size
                      type: QUERY
                    detail: invalid digit found in string
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - this endpoint requires the `ADMIN` role and `users:read` capability when delegated.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "503":
          description: Authentication, authorization, or user search data is temporarily unavailable (`AUTH_TEMPORARILY_UNAVAILABLE` or `USER_TEMPORARILY_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: USER_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal authentication or user search failure (`AUTH_INTERNAL_ERROR` or `USER_INTERNAL_ERROR`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: USER_INTERNAL_ERROR
