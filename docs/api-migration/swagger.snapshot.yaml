  /api/v1/admin/partnership-applications/{partnershipApplicationId}/decision:
    post:
      summary: Decide a PartnershipApplication as admin
      description: |
        Approves or rejects a PartnershipApplication for an authenticated administrator.

        The request accepts only `APPROVE` or `REJECT`; arbitrary state assignment is not supported.
        State-changing decisions follow the domain lifecycle and are accepted only from `IN_REVIEW`;
        terminal replays retain their existing idempotent behavior. Approval atomically creates or finds
        the Party and Partnership, grants membership and
        ListingSource access, updates the application, and creates the applicant notification.
        Rejection preserves the existing application and notification semantics. Responses always
        use `Cache-Control: no-store`.
      operationId: adminDecidePartnershipApplication
      tags:
        - PartnershipApplications
      parameters:
        - name: partnershipApplicationId
          in: path
          required: true
          description: Unique PartnershipApplication ID for the PartnershipApplication to decide.
          schema:
            type: string
          example: pa_0ckcsff4zne3qr4dsrvqk7fckd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePartnershipApplicationData"
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: PartnershipApplication decided successfully.
          headers:
            Cache-Control:
              description: Caching directive. Always set to `no-store`.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPartnershipApplicationData"
        "400":
          description: Bad request - invalid PartnershipApplication ID or decision body.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized - invalid or missing bearer credentials.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden - this endpoint requires the `ADMIN` role.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: PartnershipApplication or referenced ListingSource not found.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Conflict - the PartnershipApplication is not in a decisionable state or was changed concurrently.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal authentication or PartnershipApplication decision failure.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Authentication, authorization, or PartnershipApplication data is temporarily unavailable.
          headers:
            Cache-Control:
              description: Error responses are never stored.
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Cognito JWT bearer token.

        This scheme is used for authenticated user routes and for partner routes that accept Cognito user tokens.

        "
    AccessTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description:
        "Aura Historia bearer access token created through `/api/v1/me/access-tokens`.

        Tokens are sent as standard bearer authorization headers.

        Selected partner routes accept this scheme instead of the removed partner API-key flow.

        "
  schemas:
    ActorData:
      oneOf:
        - type: string
          enum:
            - SYSTEM
          description: Backend-initiated actor marker.
        - type: string
          description: User ID of the user who performed the change.
      description: "Audit actor encoded as a plain string.

        Values are either the literal `SYSTEM` or the User ID of the acting user.

        "
      example: SYSTEM
    ProductListingSummaryData:
      type: object
      description: Lightweight ProductListing summary for search and similar-listing results.
      required:
        - productListingId
        - eventId
        - source
        - sourceListingId
        - priceValuation
        - availability
        - lifecycle
        - url
        - viewUrl
        - images
        - updated
      properties:
        productListingId:
          type: string
        productListingTitleSlugId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
          description: Immutable Aura-owned public locator. Omitted when the listing is redacted as hidden.
          example: museum-cabinet-18-19-century-a1b2c3
        eventId:
          type: string
        source:
          $ref: "#/components/schemas/ProductListingSourceData"
        sourceListingId:
          type: string
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        displayPrice:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
        priceValuation:
          $ref: "#/components/schemas/ProductListingSummaryPriceValuationData"
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
        lifecycle:
          $ref: "#/components/schemas/ListingLifecycleData"
        url:
          type: string
          format: uri
        viewUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductListingImageData"
        contentPolicy:
          allOf:
            - $ref: "#/components/schemas/ContentPolicyData"
          nullable: true
        updated:
          type: string
          format: date-time
    ProductListingSummaryPriceValuationData:
      oneOf:
        - type: object
          required:
            - type
            - fxRateId
            - capturedAt
          properties:
            type:
              type: string
              enum:
                - CURRENT
            fxRateId:
              type: string
            capturedAt:
              type: string
              format: date-time
        - type: object
          required:
            - type
            - fxRateId
            - observedAt
          properties:
            type:
              type: string
              enum:
                - SALE_OBSERVATION
            fxRateId:
              type: string
            observedAt:
              type: string
              format: date-time
    ProductListingDetailsData:
      type: object
      description: Canonical ProductListing detail inside a personalized response wrapper.
      required:
        - productListingId
        - eventId
        - source
        - sourceListingId
        - pricing
        - availability
        - lifecycle
        - url
        - viewUrl
        - images
        - auction
        - created
        - updated
      properties:
        productListingId:
          type: string
        productListingTitleSlugId:
          type: string
          minLength: 8
          maxLength: 120
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
          description: Immutable Aura-owned public locator. Omitted when the listing is redacted as hidden.
          example: museum-cabinet-18-19-century-a1b2c3
        eventId:
          type: string
        source:
          $ref: "#/components/schemas/ProductListingSourceData"
        sourceListingId:
          type: string
        productTitle:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        productDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        title:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedTextData"
          nullable: true
        pricing:
          type: object
          required:
            - source
            - display
            - valuation
          properties:
            source:
              $ref: "#/components/schemas/ProductListingPricingData"
            display:
              $ref: "#/components/schemas/ProductListingPricingData"
            valuation:
              $ref: "#/components/schemas/ProductListingPricingValuationData"
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
        lifecycle:
          $ref: "#/components/schemas/ListingLifecycleData"
        url:
          type: string
          format: uri
        viewUrl:
          type: string
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductListingImageData"
        contentPolicy:
          allOf:
            - $ref: "#/components/schemas/ContentPolicyData"
          nullable: true
        auction:
          type: object
          required:
            - start
            - end
          properties:
            start:
              type: string
              format: date-time
              nullable: true
            end:
              type: string
              format: date-time
              nullable: true
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    ProductListingPricingData:
      type: object
      properties:
        price:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
        priceEstimateMin:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
        priceEstimateMax:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
    ProductListingPricingValuationData:
      oneOf:
        - type: object
          required:
            - type
            - fxRateId
            - capturedAt
          properties:
            type:
              type: string
              enum:
                - CURRENT
            fxRateId:
              type: string
            capturedAt:
              type: string
              format: date-time
        - type: object
          required:
            - type
            - fxRateId
            - capturedAt
            - observedAt
          properties:
            type:
              type: string
              enum:
                - SALE_OBSERVATION
            fxRateId:
              type: string
            capturedAt:
              type: string
              format: date-time
            observedAt:
              type: string
              format: date-time
    PersonalizedProductListingDetailsData:
      type: object
      description: Canonical Product detail with optional user-specific state.
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/ProductListingDetailsData"
        userState:
          allOf:
            - $ref: "#/components/schemas/ProductListingUserStateData"
          nullable: true
          description: Present only for a valid user or delegated-user bearer token.
    PersonalizedProductListingSummaryData:
      type: object
      description: Canonical Product summary with optional user-specific state.
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/ProductListingSummaryData"
        userState:
          allOf:
            - $ref: "#/components/schemas/ProductListingUserStateData"
          nullable: true
          description: Present only for a valid user or delegated-user bearer token.
    ProductListingSearchResultData:
      type: object
      description: Cursor-paged canonical Product search response.
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalizedProductListingSummaryData"
          description: Personalized Product summaries in OpenSearch result order.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        total:
          type: integer
          minimum: 0
          nullable: true
          description:
            Total matching product-listings for BM25 search when the backend provides it. Hybrid BM25 plus KNN
            search omits this value because its fused candidate pool is not a reliable total.
          example: 127
        searchAfter:
          allOf:
            - $ref: "#/components/schemas/ProductListingSearchCursorData"
          nullable: true
          description: Opaque cursor for the next page. It must be sent back as one JSON-encoded `searchAfter` query value.
    ProductListingSearchCursorData:
      type: object
      required:
        - fxRateId
        - searchAfter
      properties:
        fxRateId:
          type: string
          description: Persisted FX snapshot used for active Product filtering and display values in this cursor chain.
        searchAfter:
          type: array
          items: {}
          description: Internal OpenSearch continuation token.
      example:
        fxRateId: fx_0cwktgjtwnf4tb6hf2f8zm0x5k
        searchAfter:
          - 2999
          - pl_5xdb465tg1enarx2knf04mxbxj
    PersonalizedProductListingSearchResultData:
      type: object
      description:
        "Paginated collection of personalized product-listings using cursor-based pagination (search-after pattern).

        Each product may include user-specific state when the request is authenticated.

        "
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalizedProductListingSummaryData"
          description: Array of personalized product summaries in the current page
        size:
          type: integer
          minimum: 0
          description: Number of product-listings returned in the current page
          example: 21
        total:
          type: integer
          minimum: 0
          description: Total number of product-listings matching the query (optional, may not always be available)
          nullable: true
          example: 127
        searchAfter:
          type: array
          items: {}
          description:
            "Cursor for the next page (JSON value). Present when there are more results.

            Pass this value as the `searchAfter` query parameter to get the next page.

            This can be ANY heterogeneous array.

            "
          nullable: true
          example: '[2999, "pl_5xdb465tg1enarx2knf04mxbxj"]'
    ProductListingUserStateData:
      type: object
      description: User-specific state information for a product
      required:
        - watchlist
        - contentVisibility
        - notification
        - searchFilter
      properties:
        watchlist:
          $ref: "#/components/schemas/WatchlistUserStateData"
        contentVisibility:
          $ref: "#/components/schemas/ContentVisibilityUserStateData"
        notification:
          $ref: "#/components/schemas/NotificationUserStateData"
        searchFilter:
          $ref: "#/components/schemas/SearchFilterUserStateData"
    WatchlistUserStateData:
      type: object
      description: Watchlist-specific user state for a product
      required:
        - watching
        - notifications
      properties:
        watching:
          type: boolean
          description: Whether the product is on the user's watchlist
          example: true
        notifications:
          type: boolean
          description: Whether notifications are enabled for this watchlist product
          example: false
    ContentVisibilityUserStateData:
      type: object
      description: Stored viewer preference used when presenting unassessed or sensitive listing content.
      required:
        - showUnassessedOrSensitiveContent
      properties:
        showUnassessedOrSensitiveContent:
          type: boolean
          description: Whether unassessed or sensitive content may be shown to this viewer.
          example: false
    NotificationUserStateData:
      type: object
      description: Unseen notification IDs for this product, ordered newest first.
      required:
        - unseenNotificationIds
      properties:
        unseenNotificationIds:
          type: array
          description: Every unseen Notification ID for this product. Empty when none exist.
          default: []
          items:
            type: string
    SearchFilterUserStateData:
      type: object
      description: "User's saved-search-filter match state for a product.

        When `matched` is `true`, at least one of the user's saved search filters matched this product.

        `userSearchFilterId`, `userSearchFilterName`, `matchReason`, and `matchFeedback` are only

        present when `matched` is `true`.

        Defaults to `matched: false` when the user has no saved search filters or none of them matched.

        When `hidden` is `true`, the match exceeds the user's monthly search-filter match quota and the

        product data is anonymized (valid synthetic object IDs, placeholder title, unknown enums, nulled timestamps).

        Only matches ranked beyond the quota (by ascending match creation time) are hidden;

        the first N matches (where N is the user's tier quota) remain fully visible.

        "
      required:
        - matched
        - hidden
      properties:
        matched:
          type: boolean
          description: Whether any of the user's saved search filters matched this product. Defaults to `false`.
          default: false
          example: true
        hidden:
          type: boolean
          description:
            "Whether this match is hidden because the user has exceeded their monthly search-filter match quota.

            When `true`, the product data in the response is anonymized: object-ID fields are replaced with valid synthetic IDs using their documented prefixes,

            the title becomes a language-specific placeholder, enum fields are set to their unknown variants, optional fields are omitted, and

            timestamps are set to the Unix epoch.

            Defaults to `false`.

            "
          default: false
          example: false
        userSearchFilterId:
          type: string
          description:
            "The ID of the saved search filter that matched this product.

            Present only when `matched` is `true`; omitted otherwise.

            "
          example: sf_4hyqf0gyxveazss7nby5hve5x2
        userSearchFilterName:
          type: string
          description:
            "The user-defined name of the saved search filter that matched this product.

            Present only when `matched` is `true`; omitted otherwise.

            "
          example: Vintage Art Deco
        matchReason:
          type: string
          description:
            "A human-readable explanation of why the saved search filter matched this product.

            Only set for AI-enhanced filters (i.e. those with `search.enhancedSearchDescription`).

            Present only when `matched` is `true` and an enhanced match reason exists; omitted otherwise.

            "
          example: Product matches the vintage Art Deco style described in your search filter.
        matchFeedback:
          type: boolean
          description:
            "Optional feedback previously recorded by the authenticated user for this saved-search match.

            Present only when `matched` is `true` and feedback has been explicitly stored for the match.

            `true` marks the match as relevant, `false` marks it as not relevant.

            "
          example: true
    LocalizedTextData:
      type: object
      description: Text content with language information
      required:
        - text
        - language
      properties:
        text:
          type: string
          description: The text content
        language:
          $ref: "#/components/schemas/LanguageData"
    PriceData:
      type: object
      description: Price information with currency
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyData"
        amount:
          type: integer
          description: Price amount in minor currency units (e.g., cents for most supported currencies, whole yen for JPY)
          minimum: 0
          example: 2999
    ProductListingPriceData:
      oneOf:
        - type: object
          required:
            - type
            - currency
            - amount
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [MONETARY]
            currency:
              $ref: "#/components/schemas/CurrencyData"
            amount:
              type: integer
              minimum: 0
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              enum: [ON_REQUEST]
    ProductListingHistoryEntryData:
      type: object
      description: One immutable committed ProductListing domain-history entry.
      required:
        - eventType
        - productListingId
        - eventId
        - payload
        - timestamp
      properties:
        eventType:
          $ref: "#/components/schemas/ProductListingHistoryEntryTypeData"
        productListingId:
          type: string
          description: Unique internal ProductListing identifier
        eventId:
          type: string
          description: Unique identifier for this committed event
        payload:
          $ref: "#/components/schemas/ProductListingHistoryPayloadData"
        timestamp:
          type: string
          format: date-time
          description: When the event occurred (RFC3339 format)
    LanguageData:
      type: string
      enum:
        - de
        - en
        - fr
        - es
        - it
        - zh
        - pt
        - pl
        - tr
        - nl
        - cs
        - ja
        - ru
        - ar
      description: "Supported language codes (ISO 639-1 canonical values):

        - de: German (includes de-DE, de-AT, de-CH, de-LU, de-LI)

        - en: English (includes en-US, en-GB, en-AU, en-CA, en-NZ, and backend-specific accepted alias en_IE)

        - fr: French (includes fr-FR, fr-CA, fr-BE, fr-CH, fr-LU)

        - es: Spanish (includes es-ES, es-MX, es-AR, es-CO, es-CL, es-PE, es-VE)

        - it: Italian (includes it-IT, it-CH)

        - zh: Chinese (Simplified) (includes zh-CN, zh-Hans)

        - pt: Portuguese (includes pt-PT, pt-BR)

        - pl: Polish (includes pl-PL)

        - tr: Turkish (includes tr-TR)

        - nl: Dutch (includes nl-NL, nl-BE)

        - cs: Czech (includes cs-CZ)

        - ja: Japanese (includes ja-JP)

        - ru: Russian (includes ru-RU)

        - ar: Arabic (includes ar-SA, ar-EG, ar-AE)


        `de`, `en`, `fr`, `es`, and `it` are fully supported localization/translation-target languages.

        `zh`, `pt`, `pl`, `tr`, `nl`, `cs`, `ja`, `ru`, and `ar` are ingestion-only languages:

        they can appear in stored/native content and are accepted anywhere `LanguageData` is used,

        but backend-generated translations and fallback localized strings are not produced in these languages.

        "
      default: en
      example: de
    CurrencyData:
      type: string
      enum:
        - EUR
        - GBP
        - USD
        - AUD
        - CAD
        - NZD
        - CNY
        - BRL
        - PLN
        - TRY
        - JPY
        - CZK
        - RUB
        - AED
        - SAR
        - HKD
        - SGD
        - CHF
      description: "Supported currencies (ISO 4217 codes):

        - EUR: Euro

        - GBP: British Pound

        - USD: US Dollar

        - AUD: Australian Dollar

        - CAD: Canadian Dollar

        - NZD: New Zealand Dollar

        - CNY: Chinese Yuan

        - BRL: Brazilian Real

        - PLN: Polish Złoty

        - TRY: Turkish Lira

        - JPY: Japanese Yen

        - CZK: Czech Koruna

        - RUB: Russian Ruble

        - AED: UAE Dirham

        - SAR: Saudi Riyal

        - HKD: Hong Kong Dollar

        - SGD: Singapore Dollar

        - CHF: Swiss Franc

        "
      default: EUR
      example: EUR
    MeasurementUnitData:
      type: string
      enum:
        - METRIC
        - IMPERIAL
      description: "User preference for distance/size presentation:

        - METRIC: Metric units.

        - IMPERIAL: Imperial units.

        "
      default: METRIC
      example: METRIC
    ListingAvailabilityData:
      type: string
      enum:
        - AVAILABLE
        - IN_STOCK
        - LIMITED_AVAILABILITY
        - BACK_ORDER
        - MADE_TO_ORDER
        - PRE_ORDER
        - PRE_SALE
        - UNAVAILABLE
        - RESERVED
        - OUT_OF_STOCK
        - SOLD_OUT
      description:
        Current reliable source assertion of listing purchase availability. Omitted or `null` means Aura has no
        reliable current assertion.
      example: IN_STOCK
    ListingOrderabilityData:
      type: string
      enum:
        - ORDERABLE_NOW
        - ORDERABLE_CONDITIONALLY
        - NOT_ORDERABLE
      description: Broad classification derived from a concrete availability assertion; it is not independently stored.
      example: ORDERABLE_NOW
    ListingLifecycleData:
      type: string
      enum:
        - ACTIVE
        - WITHDRAWN
      description: "Source-catalog membership of a ProductListing:

        - ACTIVE: The listing is currently offered by its authoritative source.

        - WITHDRAWN: The listing is retained for history but is no longer offered.

        "
      example: ACTIVE
    AuctionData:
      type: object
      description:
        "Auction time window information for product-listings from auction houses.

        Contains optional start and end timestamps for scheduled auctions.

        At least one of the fields (start or end) must be present when this object is included.

        "
      properties:
        start:
          type: string
          format: date-time
          nullable: true
          description:
            "Start datetime of the auction window for this product (RFC3339 format).

            Only present for product-listings from auction houses with scheduled auction start times.

            Used to indicate when bidding begins or when the item will be auctioned.

            "
          example: "2025-05-01T12:00:00Z"
        end:
          type: string
          format: date-time
          nullable: true
          description:
            "End datetime of the auction window for this product (RFC3339 format).

            Only present for product-listings from auction houses with scheduled auction end times.

            Used to indicate when bidding ends or when the auction session concludes.

            "
          example: "2025-05-10T12:00:00Z"
    PriceEstimateData:
      type: object
      description: "Price estimate range for a product.

        Contains optional minimum and maximum estimated prices.

        "
      properties:
        min:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional minimum estimated price for the product
        max:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: Optional maximum estimated price for the product
    PricingData:
      type: object
      description: "Complete pricing information for a product.

        Contains both the offer price and optional price estimates.

        "
      properties:
        offer:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
          description: "The actual offer or asking price for the product.

            This is the price at which the product is currently being sold.

            "
        estimate:
          allOf:
            - $ref: "#/components/schemas/PriceEstimateData"
          nullable: true
          description: "Optional price estimate range.

            Common for auction items where an estimated value range is provided.

            "
    ProductListingImageData:
      type: object
      description: Product image after viewer-specific presentation.
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: URL to the product image, or `null` when it is not shown to this viewer.
          example: https://my-listing-source.com/images/product-1.jpg
    ContentPolicyData:
      oneOf:
        - type: object
          required:
            - decision
          properties:
            decision:
              type: string
              enum:
                - ALLOWED
        - type: object
          required:
            - decision
            - category
          properties:
            decision:
              type: string
              enum:
                - REQUIRES_CONSENT
            category:
              type: string
              enum:
                - NAZI_GERMANY
      description: Listing-level content decision. This schema is used only when the listing has an assessment.
    SortProductListingFieldData:
      type: string
      enum:
        - score
        - updated
        - created
      description: "Fields available for sorting:

        - score: Sort by relevance score (default, only available when searching with text query)

        - updated: Sort by last updated timestamp

        - created: Sort by creation timestamp

        "
      default: score
      example: updated
    ProductListingHistoryEntryTypeData:
      type: string
      enum:
        - PRODUCT_LISTING_DISCOVERED
        - PRODUCT_LISTING_CHANGED
      description: Canonical ProductListing domain-history entry type.
      example: PRODUCT_LISTING_CHANGED
    ProductListingHistoryPayloadData:
      oneOf:
        - $ref: "#/components/schemas/ProductListingDiscoveryHistoryPayloadData"
        - $ref: "#/components/schemas/ProductListingChangedHistoryPayloadData"
      description: Immutable semantic history payload. It never contains image URLs or enrichment data.
    ProductListingDiscoveryHistoryPayloadData:
      type: object
      required:
        - listingSourceId
        - sourceListingId
        - pricing
        - availability
        - url
        - imageCount
        - auction
      properties:
        listingSourceId:
          type: string
        sourceListingId:
          type: string
        title:
          $ref: "#/components/schemas/LocalizedTextData"
        description:
          $ref: "#/components/schemas/LocalizedTextData"
        pricing:
          $ref: "#/components/schemas/ProductListingPricingData"
        availability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
        url:
          type: string
          format: uri
        imageCount:
          type: integer
          format: int64
          minimum: 0
        auction:
          $ref: "#/components/schemas/AuctionData"
    ProductListingChangedHistoryPayloadData:
      type: object
      required:
        - changes
      properties:
        changes:
          type: array
          minItems: 1
          description: "Deterministic semantic-change order: main price, minimum estimate, maximum estimate, availability, URL, images, auction, lifecycle, sale observation."
          items:
            $ref: "#/components/schemas/ProductListingHistoryChangeData"
    ProductListingHistoryChangeData:
      oneOf:
        - $ref: "#/components/schemas/ProductListingMainPriceHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingPriceHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingAvailabilityHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingUrlHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingImagesHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingAuctionHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingWithdrawalHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingRestorationHistoryChangeData"
        - $ref: "#/components/schemas/ProductListingSaleObservationHistoryChangeData"
      description: Typed semantic change.
    ProductListingMainPriceHistoryChangeData:
      type: object
      required:
        - type
        - previous
        - current
      properties:
        type:
          type: string
          enum:
            - MAIN_PRICE_CHANGED
        previous:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
        current:
          allOf:
            - $ref: "#/components/schemas/ProductListingPriceData"
          nullable: true
    ProductListingPriceHistoryChangeData:
      type: object
      required:
        - type
        - previous
        - current
      properties:
        type:
          type: string
          enum:
            - MINIMUM_ESTIMATE_CHANGED
            - MAXIMUM_ESTIMATE_CHANGED
        previous:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
        current:
          allOf:
            - $ref: "#/components/schemas/PriceData"
          nullable: true
    ProductListingAvailabilityHistoryChangeData:
      type: object
      required:
        - type
        - previous
        - current
      properties:
        type:
          type: string
          enum:
            - AVAILABILITY_CHANGED
        previous:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
        current:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
    ProductListingUrlHistoryChangeData:
      type: object
      required:
        - type
        - previous
        - current
      properties:
        type:
          type: string
          enum:
            - URL_CHANGED
        previous:
          type: string
          format: uri
        current:
          type: string
          format: uri
    ProductListingImagesHistoryChangeData:
      type: object
      required:
        - type
        - previousCount
        - currentCount
      properties:
        type:
          type: string
          enum:
            - IMAGES_CHANGED
        previousCount:
          type: integer
          format: int64
          minimum: 0
        currentCount:
          type: integer
          format: int64
          minimum: 0
    ProductListingAuctionHistoryChangeData:
      type: object
      required:
        - type
        - previous
        - current
      properties:
        type:
          type: string
          enum:
            - AUCTION_CHANGED
        previous:
          $ref: "#/components/schemas/AuctionData"
        current:
          $ref: "#/components/schemas/AuctionData"
    ProductListingWithdrawalHistoryChangeData:
      type: object
      required:
        - type
        - previousAvailability
      properties:
        type:
          type: string
          enum:
            - WITHDRAWN
        previousAvailability:
          allOf:
            - $ref: "#/components/schemas/ListingAvailabilityData"
          nullable: true
    ProductListingRestorationHistoryChangeData:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - RESTORED
    ProductListingSaleObservationHistoryChangeData:
      type: object
      required:
        - type
        - observation
      properties:
        type:
          type: string
          enum:
            - SALE_OBSERVED
            - SALE_OBSERVATION_RETRACTED
        observation:
          type: object
          required:
            - observedAt
            - fxRateId
          properties:
            observedAt:
              type: string
              format: date-time
            fxRateId:
              type: string
    ApiError:
      type: object
      description: Standard error response format (RFC 9457)
      required:
        - status
        - title
        - error
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        title:
          type: string
          description: HTTP status code in human-readable form
          example: Bad Request
        error:
          type: string
          description: Error code identifier
          example: BAD_PARAMETER
        source:
          $ref: "#/components/schemas/ApiErrorSource"
        detail:
          type: string
          description: Human-readable error message
          example: "Expected any of: 'true' or 'false'. Got: 'invalid'"
    ApiErrorSource:
      type: object
      description: Information about the source of the error
      required:
        - field
        - type
      properties:
        field:
          type: string
          description: Name of the field that caused the error
          example: listingSourceId
        type:
          type: string
          enum:
            - QUERY
            - PATH
            - HEADER
            - BODY
          description: Type of parameter that caused the error
          example: PATH
    ProductListingSearchData:
      type: object
      description: ProductListing search criteria used by saved search filters.
      properties:
        language:
          $ref: "#/components/schemas/LanguageData"
        currency:
          $ref: "#/components/schemas/CurrencyData"
        productQuery:
          type: array
          items: &id001
            type: string
            minLength: 1
        enhancedSearchDescription:
          type: string
          minLength: 1
          maxLength: 1000
          nullable: true
        excludeProductId:
          type: array
          items:
            type: string
          uniqueItems: true
          description: ProductListing IDs to exclude.
        listingSourceId:
          type: array
          items: &id002
            type: string
          uniqueItems: true
          description: ListingSource IDs to include.
        excludeListingSourceId:
          type: array
          items: &id003
            type: string
          uniqueItems: true
          description: ListingSource IDs to exclude.
        price:
          allOf: &id004
            - $ref: "#/components/schemas/RangeQueryUInt64"
          nullable: true
        availability:
          type: array
          items: &id005
            $ref: "#/components/schemas/ListingAvailabilityData"
          uniqueItems: true
          nullable: true
        orderability:
          type: array
          items: &id006
            $ref: "#/components/schemas/ListingOrderabilityData"
          uniqueItems: true
          nullable: true
        includeUnspecifiedAvailability:
          type: boolean
          nullable: true
        created:
          allOf: &id007
            - $ref: "#/components/schemas/RangeQueryDateTime"
          nullable: true
        updated:
          allOf: &id008
            - $ref: "#/components/schemas/RangeQueryDateTime"
          nullable: true
        auctionStart:
          allOf: &id009
            - $ref: "#/components/schemas/RangeQueryDateTime"
          nullable: true
        auctionEnd:
          allOf: &id010
            - $ref: "#/components/schemas/RangeQueryDateTime"
          nullable: true
    PostUserSearchFilterData:
      type: object
      description: Request body for creating a new search filter
      required:
        - name
        - search
      properties:
        name:
          type: string
          description: User-defined name for the search filter (max 255 characters, will be truncated if longer)
          maxLength: 255
          example: My Tech Store Search
        search:
          $ref: "#/components/schemas/ProductListingSearchData"
    PatchUserSearchFilterData:
      type: object
      description: "Partial search filter update data.

        All fields are optional and only provided fields will be updated.

        Can update the search filter name, notifications preference, activation state, and/or the search filter criteria.

        "
      properties:
        name:
          type: string
          description: User-defined name for the search filter (max 255 characters, will be truncated if longer)
          maxLength: 255
          nullable: true
          example: Updated Filter Name
        notifications:
          type: boolean
          nullable: true
          description:
            "Whether to enable or disable email notifications for new product-listings matching this search filter.

            When `true`, the user will be notified when a new product matches this filter.

            When `false`, no notifications are sent for this filter.

            Omit to leave unchanged.

            "
          example: true
        state:
          allOf:
            - $ref: "#/components/schemas/PatchResourceStateData"
          nullable: true
          description:
            "Optional activation state update for this saved search filter.

            `ACTIVE` reactivates the filter if the current user tier still permits the configured search features and quota.

            `INACTIVE_BY_USER` manually disables the filter.

            Omit to leave the current state unchanged.

            "
        search:
          allOf:
            - $ref: "#/components/schemas/PatchProductListingSearchData"
          nullable: true
          description: Partial search filter criteria to update
    PatchUserSearchFilterMatchData:
      type: object
      description: "Partial update payload for a saved-search product match.

        Omitting `feedback` leaves the stored match feedback unchanged.

        "
      properties:
        feedback:
          type: boolean
          nullable: true
          description: "Optional relevance feedback for the matched product.

            `true` marks the product as relevant to the saved search filter, `false` marks it as not relevant.

            "
          example: true
    PatchProductListingSearchData:
      type: object
      description:
        Partial ProductListing search criteria. Omitted fields are unchanged. `enhancedSearchDescription`, price,
        date ranges, and the availability query may be cleared with `null`; availability, orderability, and includeUnspecifiedAvailability`
        must be supplied together or all be `null`.
      properties:
        language:
          $ref: "#/components/schemas/LanguageData"
          nullable: true
        currency:
          $ref: "#/components/schemas/CurrencyData"
          nullable: true
        productQuery:
          type: array
          items: *id001
          nullable: true
        enhancedSearchDescription:
          type: string
          minLength: 1
          maxLength: 1000
          nullable: true
        listingSourceId:
          type: array
          items: *id002
          uniqueItems: true
          description: ListingSource IDs to include.
          nullable: true
        excludeListingSourceId:
          type: array
          items: *id003
          uniqueItems: true
          description: ListingSource IDs to exclude.
          nullable: true
        price:
          allOf: *id004
          nullable: true
        availability:
          type: array
          items: *id005
          uniqueItems: true
          nullable: true
        orderability:
          type: array
          items: *id006
          uniqueItems: true
          nullable: true
        includeUnspecifiedAvailability:
          type: boolean
          nullable: true
        created:
          allOf: *id007
          nullable: true
        updated:
          allOf: *id008
          nullable: true
        auctionStart:
          allOf: *id009
          nullable: true
        auctionEnd:
          allOf: *id010
          nullable: true
    UserSearchFilterData:
      type: object
      description: Complete user search filter with metadata
      required:
        - userId
        - userSearchFilterId
        - name
        - notifications
        - state
        - search
        - createdBy
        - updatedBy
        - created
        - updated
      properties:
        userId:
          type: string
          description: Unique identifier of the user who owns this search filter
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        userSearchFilterId:
          type: string
          description: Unique identifier for this search filter
          example: sf_4hyqf0gyxveazss7nby5hve5x2
        name:
          type: string
          description: User-defined name for the search filter
          example: My Tech Store Search
        notifications:
          type: boolean
          description:
            "Whether notifications are enabled for this search filter.

            When `true`, the user will be notified when a new product matches this filter.

            When `false`, no notifications are sent for this filter.

            Defaults to `true` for newly created filters.

            "
          example: true
        state:
          $ref: "#/components/schemas/ResourceStateData"
        search:
          $ref: "#/components/schemas/ProductListingSearchData"
        createdBy:
          $ref: "#/components/schemas/ActorData"
        updatedBy:
          $ref: "#/components/schemas/ActorData"
        created:
          type: string
          format: date-time
          description: When the search filter was created (RFC3339 format)
          example: "2024-01-01T10:00:00Z"
        updated:
          type: string
          format: date-time
          description: When the search filter was last updated (RFC3339 format)
          example: "2024-01-01T12:00:00Z"
    ResourceStateData:
      type: string
      description:
        "Activation state of a stored user-owned resource such as a saved search filter.

        `ACTIVE` resources are eligible for their normal runtime behavior.

        `INACTIVE_BY_USER` resources were explicitly deactivated by the user.

        `INACTIVE_BY_RESTRICTED_PLAN` resources remain stored but are inactive because the user's current tier no longer
        allows them to stay active.

        "
      enum:
        - ACTIVE
        - INACTIVE_BY_USER
        - INACTIVE_BY_RESTRICTED_PLAN
      example: ACTIVE
    PatchResourceStateData:
      type: string
      description:
        "Client-settable activation state for resources that support manual activation toggles.

        Clients may reactivate a resource with `ACTIVE` or manually disable it with `INACTIVE_BY_USER`.

        `INACTIVE_BY_RESTRICTED_PLAN` is managed internally by the backend and is never accepted from clients.

        "
      enum:
        - ACTIVE
        - INACTIVE_BY_USER
      example: INACTIVE_BY_USER
    SearchFilterProductMatchData:
      type: object
      description: Persisted match record for one of a user's saved search filters.
      required:
        - userId
        - userSearchFilterId
        - productListingId
        - originEventId
        - created
        - updated
      properties:
        userId:
          type: string
          description: Unique identifier of the user who owns the matched search filter.
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        userSearchFilterId:
          type: string
          description: Unique identifier of the saved search filter that matched the product.
          example: sf_4hyqf0gyxveazss7nby5hve5x2
        userSearchFilterName:
          type: string
          description: Saved-search name captured with the match, when available.
          example: Golden Accessories
        productListingId:
          type: string
          description: Unique internal identifier of the matched product.
          example: pl_6zydvb8xqqfcntt760grgm41t4
        originEventId:
          type: string
          description: Product event that produced this match.
          example: evt_08nrsmex2je2dvsyh01v2kh78a
        enhancedMatchReason:
          type: string
          description: Enhanced-match explanation, when matching supplied one.
          example: The product matches the saved enhanced description.
        feedback:
          type: boolean
          description: Optional feedback recorded by the user for this saved-search match.
          example: true
        created:
          type: string
          format: date-time
          description: When the search-filter product match was originally created (RFC3339 format).
          example: "2024-01-01T10:00:00Z"
        updated:
          type: string
          format: date-time
          description: When the search-filter product match was last updated (RFC3339 format).
          example: "2024-01-01T12:30:00Z"
    RangeQueryUInt64:
      type: object
      description:
        Range query for numeric values in minor currency units for the selected indexed currency; no request-time
        conversion occurs
      properties:
        min:
          type: integer
          minimum: 0
          description: Minimum value (inclusive)
          example: 1000
        max:
          type: integer
          minimum: 0
          description: Maximum value (inclusive)
          example: 5000
    RangeQueryDateTime:
      type: object
      description: Range query for date and time values
      properties:
        min:
          type: string
          format: date-time
          description: Minimum date and time (inclusive, RFC3339 format)
          example: "2024-01-01T00:00:00Z"
        max:
          type: string
          format: date-time
          description: Maximum date and time (inclusive, RFC3339 format)
          example: "2024-12-31T23:59:59Z"

    UserSearchFilterCollectionData:
      type: object
      description: Paginated collection of user search filters with flattened pagination
      required:
        - items
        - from
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserSearchFilterData"
          description: Array of search filters in the current page
        from:
          type: integer
          minimum: 0
          description: Number of product-listings skipped (offset)
          example: 0
        size:
          type: integer
          minimum: 0
          description: Number of product-listings in the current page
          example: 21
        total:
          type: integer
          minimum: 0
          description: Total number of product-listings matching the query
          nullable: true
          example: 127

    AccessTokenScopeData:
      type: string
      enum:
        - product-listings:write
        - users:read
        - users:write
        - access-tokens:read
        - access-tokens:write
        - search-filters:write
        - watchlist:read
        - watchlist:write
      description: "Aura Historia access-token and OAuth scope string.

        The value is one of the capabilities supported by the canonical access-token and OAuth flows.

        "
      example: access-tokens:read
    AccessTokenTypeData:
      type: string
      enum:
        - BEARER
      description: Token type returned for Aura Historia access tokens.
      example: BEARER
    AdminAccessTokenCollectionData:
      type: object
      description:
        "Cursor-paginated, secret-free access-token metadata for an administrator's explicit target user.

        `searchAfter` is a `[created RFC3339 timestamp, AccessToken ID]` cursor and is omitted

        when the current page is terminal. The cursor timestamp is not returned as item metadata.

        This schema intentionally has no raw token, masked token, short-token, or token-hash property.

        "
      required:
        - items
        - size
      properties:
        items:
          type: array
          description: Access-token metadata returned for the target user, including expired and current tokens.
          items:
            $ref: "#/components/schemas/AdminAccessTokenData"
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: "`[created RFC3339 timestamp, AccessToken ID]` cursor for the next page, omitted when no more results are available."
          nullable: true
          example:
            - "2026-09-04T12:00:00Z"
            - at_4ck23tcv0meqqrbyjaka24ra6g
    AdminAccessTokenData:
      type: object
      description:
        "Secret-free Aura Historia access-token metadata returned by the admin target-user listing.

        The representation contains no raw token, masked token, short-token, or token-hash value.

        `expires` is omitted when the token has no expiration and is returned for both expired and current tokens.

        "
      required:
        - userId
        - accessTokenId
        - name
        - scopes
        - origin
      properties:
        userId:
          type: string
          description: Explicit target user who owns the access token.
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        accessTokenId:
          type: string
          description: Unique identifier of the access token.
          example: at_4ck23tcv0meqqrbyjaka24ra6g
        name:
          type: string
          maxLength: 128
          description: User-defined display name of the access token.
          example: Incident review token
        scopes:
          type: array
          uniqueItems: true
          description: Granted access-token scopes.
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          example:
            - users:read
        origin:
          type: string
          description: Origin recorded by the canonical access-token model.
          example: User
        expires:
          type: string
          format: date-time
          description: Optional RFC3339 expiration timestamp; expired and current tokens are both listed.
          nullable: true
          example: "2026-09-30T00:00:00Z"
    GetAccessTokenData:
      type: object
      description: "Access-token read model.

        `POST /api/v1/me/access-tokens` returns the plaintext bearer token once;

        list/get/update endpoints return the masked display value instead.

        "
      required:
        - accessTokenId
        - name
        - token
        - tokenType
        - createdBy
        - updatedBy
        - created
        - updated
      properties:
        accessTokenId:
          type: string
          description: Unique identifier of the access token.
          example: at_4ck23tcv0meqqrbyjaka24ra6g
        name:
          type: string
          maxLength: 128
          description: User-defined display name of the access token.
          example: Partner product sync
        scope:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          uniqueItems: true
          description: Granted access-token scopes. Omitted when the token has no scopes.
          example:
            - product-listings:write
        token:
          type: string
          description: "Plaintext or masked bearer token value.

            Create responses return the full token once; subsequent reads return a masked value such as `aurahistoria_abcdefghijk_****`.

            "
          example: aurahistoria_abcdefghijk_****
        tokenType:
          $ref: "#/components/schemas/AccessTokenTypeData"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional absolute expiration timestamp in RFC 3339 format.
          example: "2026-06-30T00:00:00Z"
        expiresIn:
          type: integer
          minimum: 0
          nullable: true
          description: Optional non-negative number of seconds remaining until expiry.
          example: 2851200
        createdBy:
          $ref: "#/components/schemas/ActorData"
          description: Actor who created this access token
        updatedBy:
          $ref: "#/components/schemas/ActorData"
          description: Actor who last updated this access token
        created:
          type: string
          format: date-time
          description: Timestamp when the access token was created.
          example: "2026-05-28T06:30:00Z"
        updated:
          type: string
          format: date-time
          description: Timestamp when the access token metadata was last updated.
          example: "2026-05-28T07:00:00Z"
    PostAccessTokenData:
      type: object
      description: Request body for creating an Aura Historia access token.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 128
          description: User-defined display name of the new access token.
          example: Partner product sync
        scope:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          uniqueItems: true
          description: Optional scopes granted to the access token. Defaults to an empty set.
          example:
            - product-listings:write
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration timestamp in RFC 3339 format.
          example: "2026-06-30T00:00:00Z"
    PatchAccessTokenData:
      type: object
      description: "Request body for updating access-token metadata.

        Omitted fields remain unchanged. `expires: null` clears the expiry; `name` and `scopes`

        reject null, and `scopes: []` replaces the scope set with an empty set.

        "
      required:
        - accessTokenId
      properties:
        accessTokenId:
          type: string
          description: Unique identifier of the access token to update.
          example: at_4ck23tcv0meqqrbyjaka24ra6g
        name:
          type: string
          maxLength: 128
          description: Omit to leave unchanged. Null is invalid.
          example: Renamed partner sync token
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          uniqueItems: true
          description: Omit to leave unchanged. Send `[]` to empty the set; null is invalid.
          example:
            - product-listings:write
        expires:
          type: string
          format: date-time
          nullable: true
          description: Omit to leave unchanged. Send null to clear the expiration timestamp.
          example: "2026-07-31T00:00:00Z"
    OAuthClientMetadataRequestData:
      type: object
      description: "Request body for creating OAuth client metadata.

        `redirect_uris` must contain at least one HTTPS redirect URI.

        "
      required:
        - client_name
        - tos_uri
        - policy_uri
        - client_uri
        - logo_uri
        - redirect_uris
      properties:
        client_name:
          type: string
          description: Display name of the OAuth client.
          example: Acceptance OAuth client
        tos_uri:
          type: string
          format: uri
          description: HTTPS URL of the OAuth client's terms-of-service document.
          example: https://client.example/tos
        policy_uri:
          type: string
          format: uri
          description: HTTPS URL of the OAuth client's privacy policy document.
          example: https://client.example/policy
        client_uri:
          type: string
          format: uri
          description: HTTPS URL of the OAuth client's homepage or product site.
          example: https://client.example
        logo_uri:
          type: string
          format: uri
          description: HTTPS URL of the OAuth client's logo image.
          example: https://client.example/logo.png
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          description: Registered HTTPS redirect URIs for the OAuth client.
          items:
            type: string
            format: uri
          example:
            - https://client.example/callback
        scope:
          type: array
          uniqueItems: true
          description: Optional allowed scopes for tokens issued to this OAuth client.
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          example:
            - product-listings:write
    OAuthClientMetadataPatchData:
      type: object
      description:
        "Request body for updating OAuth client metadata. Omitted properties remain unchanged;

        every explicit null is invalid because metadata values are non-nullable.

        "
      properties:
        client_name:
          type: string
          description: Optional replacement display name for the OAuth client.
          example: Updated acceptance OAuth client
        tos_uri:
          type: string
          format: uri
          description: Optional replacement terms-of-service document URL for the OAuth client.
          example: https://client.example/updated-tos
        policy_uri:
          type: string
          format: uri
          description: Optional replacement privacy-policy document URL for the OAuth client.
          example: https://client.example/updated-policy
        client_uri:
          type: string
          format: uri
          description: Optional replacement homepage or product-site URL for the OAuth client.
          example: https://updated-client.example
        logo_uri:
          type: string
          format: uri
          description: Optional replacement logo image URL for the OAuth client.
          example: https://updated-client.example/logo.png
        redirect_uris:
          type: array
          minItems: 1
          uniqueItems: true
          description: Optional replacement set of registered HTTPS redirect URIs.
          items:
            type: string
            format: uri
          example:
            - https://client.example/updated
        scope:
          type: array
          uniqueItems: true
          description: Omit to leave unchanged. Send `[]` to replace with an empty set; null is invalid.
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          example:
            - access-tokens:read
    OAuthClientMetadataResponseData:
      type: object
      description: "OAuth client metadata create response.

        `client_secret` contains the plaintext secret only in the create response.

        Admin list, detail, and update responses use `OAuthClientAdminData` and omit
        `client_secret` entirely.

        "
      required:
        - client_id
        - client_secret
        - client_name
        - tos_uri
        - policy_uri
        - client_uri
        - logo_uri
        - redirect_uris
        - scope
        - client_id_issued_at
      properties:
        client_id:
          type: string
          description: Canonical OAuthClient ID.
          example: oc_7b0gwc1x49e0mvbt3tfexfqgb5
        client_secret:
          type: string
          description:
            "Plaintext OAuth client secret returned only once by the create response.

            Admin list, detail, and update responses omit this property entirely.

            "
          example: aurahistoria_oauth_client_secret_abcdefghijk_abcdefghijklmnopqrstuvwxyz1234567
        client_name:
          type: string
          description: Display name of the OAuth client.
          example: Acceptance OAuth client
        tos_uri:
          type: string
          format: uri
          description: Terms-of-service document URL registered for the OAuth client.
          example: https://client.example/tos
        policy_uri:
          type: string
          format: uri
          description: Privacy-policy document URL registered for the OAuth client.
          example: https://client.example/policy
        client_uri:
          type: string
          format: uri
          description: Homepage or product-site URL registered for the OAuth client.
          example: https://client.example
        logo_uri:
          type: string
          format: uri
          description: Logo image URL registered for the OAuth client.
          example: https://client.example/logo.png
        redirect_uris:
          type: array
          uniqueItems: true
          description: Registered redirect URIs for the OAuth client.
          items:
            type: string
            format: uri
          example:
            - https://client.example/callback
        scope:
          type: array
          uniqueItems: true
          description: Allowed scopes for tokens issued to this OAuth client.
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          example:
            - product-listings:write
        client_id_issued_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the OAuth client was created and its client ID was issued.
          example: 1748539200
    OAuthClientAdminCollectionData:
      type: object
      description:
        "Cursor-paginated OAuth client summaries for the administrator collection endpoint.

        `searchAfter` is a `[created RFC3339 timestamp, OAuthClient ID]` cursor and is omitted

        when the current page is terminal. The collection and its items never contain client

        secret plaintext, secret hashes, or masked secret values.

        "
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OAuthClientAdminData"
          description: OAuth client summaries returned in the current page.
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: "`[created RFC3339 timestamp, OAuthClient ID]` cursor for the next page, omitted when no more results are available."
          nullable: true
          example:
            - "2026-09-04T12:00:00Z"
            - oc_7b0gwc1x49e0mvbt3tfexfqgb5
        total:
          type: integer
          format: int64
          minimum: 0
          description: Total matching OAuth clients when provided by the reader; omitted otherwise.
          nullable: true
          example: 42
    OAuthClientAdminData:
      type: object
      description:
        "Secret-free OAuth client metadata returned by the admin OAuth client collection,

        detail, and update endpoints under `/api/v1/admin/oauth-clients`.

        This schema intentionally has no `client_secret` property.

        "
      required:
        - client_id
        - client_name
        - tos_uri
        - policy_uri
        - client_uri
        - logo_uri
        - redirect_uris
        - scope
        - client_id_issued_at
      properties:
        client_id:
          type: string
          description: Canonical OAuthClient ID.
          example: oc_7b0gwc1x49e0mvbt3tfexfqgb5
        client_name:
          type: string
          description: Display name of the OAuth client.
          example: Dashboard integration
        tos_uri:
          type: string
          format: uri
          description: Terms-of-service document URL registered for the OAuth client.
          example: https://client.example/tos
        policy_uri:
          type: string
          format: uri
          description: Privacy-policy document URL registered for the OAuth client.
          example: https://client.example/policy
        client_uri:
          type: string
          format: uri
          description: Homepage or product-site URL registered for the OAuth client.
          example: https://client.example
        logo_uri:
          type: string
          format: uri
          description: Logo image URL registered for the OAuth client.
          example: https://client.example/logo.png
        redirect_uris:
          type: array
          uniqueItems: true
          description: Registered redirect URIs for the OAuth client.
          items:
            type: string
            format: uri
          example:
            - https://client.example/callback
        scope:
          type: array
          uniqueItems: true
          description: Allowed scopes for tokens issued to this OAuth client.
          items:
            $ref: "#/components/schemas/AccessTokenScopeData"
          example:
            - access-tokens:read
        client_id_issued_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the OAuth client was created and its client ID was issued.
          example: 1748539200
    OAuthTokenResponseData:
      type: object
      description: "Token response returned by `POST /api/v1/oauth/token` and

        `GET /api/v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`.

        The `access_token` is an Aura Historia bearer access token. `expires_in` is omitted

        (`null`) for non-expiring tokens. `third_party_exchange_code` is only present on the

        direct token exchange response.

        "
      required:
        - access_token
        - token_type
        - scope
      properties:
        access_token:
          type: string
          description: The issued Aura Historia access token (plaintext bearer value).
          example: aurahistoria_abcdefghijk_verylongtokenvalue
        token_type:
          $ref: "#/components/schemas/AccessTokenTypeData"
        expires_in:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Seconds until the access token expires. `null` when the token does not expire.
          example: null
        scope:
          type: string
          description: Space-separated list of scopes granted to the access token.
          example: product-listings:write
        third_party_exchange_code:
          type: string
          format: uuid
          description:
            "Optional one-time exchange code returned by `POST /api/v1/oauth/token`.

            It can be redeemed once via `GET /api/v1/oauth/tokens/by-third-party-code/{thirdPartyCode}`

            within 60 seconds to obtain the same access token.

            "
          example: 01970f22-2bf0-7000-8000-000000000099
    OAuthIntrospectionResponseData:
      type: object
      description:
        "Introspection response returned by `POST /api/v1/oauth/introspect` (RFC 7662).

        When `active` is `false` all other fields are omitted.

        When `active` is `true` the available token metadata is populated.

        "
      required:
        - active
      properties:
        active:
          type: boolean
          description: Whether the token is currently active (not expired, not revoked, and known to this server).
          example: true
        scope:
          type: string
          description: Space-separated list of scopes granted to the token. Present only when `active` is `true`.
          example: product-listings:write
        client_id:
          type: string
          description:
            OAuthClient ID that issued the token. Present only when `active` is `true` and the
            token was issued via the OAuth flow.
          example: oc_7b0gwc1x49e0mvbt3tfexfqgb5
        sub:
          type: string
          description: Subject — the Aura Historia user ID who authorized the token. Present only when `active` is `true`.
          example: usr_4hzreqwxgvef69j056bszwwm17
        token_type:
          type: string
          description: Token type. Always `"Bearer"` when `active` is `true`.
          example: Bearer
        exp:
          type: integer
          format: int64
          description:
            Unix timestamp (seconds) when the token expires. Present only when `active` is `true` and the token
            has an expiry.
          example: 1780000000
        iat:
          type: integer
          format: int64
          description:
            Unix timestamp (seconds) when the token was issued. Present only when `active` is `true` and the issue
            time is known.
          example: 1748400000
    PostWatchlistData:
      type: object
      description: Request body for creating a watchlist entry.
      required:
        - productListingId
      properties:
        productListingId:
          type: string
          description: Canonical identifier of the product to add to the watchlist.
          example: pl_5xdb465tg1enarx2knf04mxbxj
        notifications:
          type: boolean
          description: Whether notifications are enabled for this entry. Defaults to `true`.
          default: true
          example: true
    WatchlistEntryData:
      type: object
      description: A user's watchlist entry.
      required:
        - userId
        - productListingId
        - notifications
        - state
      properties:
        userId:
          type: string
          description: Identifier of the user who owns the entry.
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
        productListingId:
          type: string
          description: Canonical identifier of the watched product.
          example: pl_5xdb465tg1enarx2knf04mxbxj
        notifications:
          type: boolean
          description: Whether notifications are enabled for this entry.
          example: true
        state:
          $ref: "#/components/schemas/ResourceStateData"
        created:
          type: string
          format: date-time
          description: When the entry was created, when available.
          example: "2026-08-06T12:00:00Z"
        updated:
          type: string
          format: date-time
          description: When the entry was last updated, when available.
          example: "2026-08-06T12:00:00Z"
    WatchlistProductPatch:
      type: object
      description: Patch object for updating watchlist product settings
      properties:
        notifications:
          type: boolean
          description: Whether to enable or disable notifications for this watchlist product
          example: true
        state:
          allOf:
            - $ref: "#/components/schemas/PatchResourceStateData"
          nullable: true
          description:
            "Optional activation state update for this watchlist entry.

            `ACTIVE` reactivates the entry if the user's current tier still has watchlist quota.

            `INACTIVE_BY_USER` manually disables the entry.

            Omit to leave the current state unchanged.

            "
    SortListingSourceFieldData:
      type: string
      enum:
        - name
        - slug
        - created
        - updated
      description: "Fields available for sorting admin ListingSource-search results. ListingSource ID is always used as a deterministic tie-breaker."
      example: name
    SortPartyFieldData:
      type: string
      enum:
        - name
        - email
        - phone
        - created
        - updated
      description: "Fields available for sorting admin Party-search results. Party ID is always used as a deterministic tie-breaker; absent contact values sort last."
      example: name
    CreatePartyData:
      type: object
      description: Party name and optional contact information used to create an admin Party.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Party name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        phone:
          type: string
          description: Optional Party phone number.
        email:
          type: string
          format: email
          description: Optional Party email address.
    UpdatePartyData:
      type: object
      description: "Partial admin Party update. Omitted members remain unchanged; null clears only phone and email."
      properties:
        name:
          type: string
          maxLength: 255
          description: "Replacement Party name. Outer Unicode whitespace is trimmed; blank values, values over 255 UTF-8 bytes, and null are rejected."
        phone:
          type: string
          nullable: true
          description: "Replacement Party phone number; null clears it."
        email:
          type: string
          format: email
          nullable: true
          description: "Replacement Party email address; null clears it."
    PartyData:
      type: object
      description: Party representation returned after admin creation, update, and detail routes.
      required:
        - partyId
        - partySlugId
        - name
        - contact
        - created
        - updated
      properties:
        partyId:
          type: string
          description: Stable Party identifier.
        partySlugId:
          type: string
          description: Immutable Party slug identifier.
        name:
          type: string
          maxLength: 255
          description: Party name.
        contact:
          $ref: "#/components/schemas/PartyContactData"
        created:
          type: string
          format: date-time
          description: When the Party was created.
        updated:
          type: string
          format: date-time
          description: When the Party was last updated.
    PartyCollectionData:
      type: object
      description: "Cursor-paginated Party summaries for the admin search endpoint. `searchAfter` is a Party ID cursor and is omitted when the current page is terminal."
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartySummaryData"
          description: Party summaries returned in the current page.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: string
          description: Party ID cursor for the next page, omitted when no more results are available.
          example: pty_71m2jxjctefykb6crqka16yf6z
        total:
          type: integer
          minimum: 0
          description: Total matching Parties when provided by the reader; omitted otherwise.
          example: 42
    PartySummaryData:
      type: object
      description: Compact Party data returned by the administrator Party-search endpoint.
      required:
        - partyId
        - partySlugId
        - name
        - contact
        - created
        - updated
      properties:
        partyId:
          type: string
          description: Stable Party identifier.
        partySlugId:
          type: string
          description: Immutable Party slug identifier.
        name:
          type: string
          maxLength: 255
          description: Party name.
        contact:
          $ref: "#/components/schemas/PartyContactData"
        created:
          type: string
          format: date-time
          description: When the Party was created.
        updated:
          type: string
          format: date-time
          description: When the Party was last updated.
    PartyContactData:
      type: object
      description: Optional Party contact summary. Absent contact members are omitted.
      properties:
        phone:
          type: string
          description: Party phone number, omitted when absent.
        email:
          type: string
          format: email
          description: Party email address, omitted when absent.
    SortUserFieldData:
      type: string
      enum:
        - name
        - email
        - firstName
        - lastName
        - tier
        - role
        - updated
        - created
      description: "Fields available for sorting admin user-search results:

        - name: First name followed by last name

        - email: User email address

        - firstName: User first name

        - lastName: User last name

        - tier: User subscription tier

        - role: User role

        - updated: Last update timestamp

        - created: Creation timestamp

        Every sort uses user ID as a deterministic tie-breaker.

        "
      example: email
    SearchFilterMatchProductCollectionData:
      type: object
      description: Cursor-paginated personalized ProductListing details for persisted search-filter matches.
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
          description: Persisted matches in ascending match-creation order.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Effective page size after runtime defaulting and clamping.
          example: 21
        searchAfter:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: >-
            Next-page cursor, present only when another page is available. It contains `[RFC3339 persisted
            match creation timestamp, canonical ProductListing ID]`; serialize the returned array as the
            `searchAfter` query parameter for the next request.
          example:
            - "2026-08-05T12:30:00Z"
            - pl_6zydvb8xqqfcntt760grgm41t4
        total:
          type: integer
          minimum: 0
          description: Total number of persisted matches, when available.
          example: 127
    UserCollectionData:
      type: object
      description:
        "Cursor-paginated collection of users for the admin search endpoint.

        Items are compact admin user summaries. `searchAfter` is a User ID cursor for

        the next page and is omitted when the current page is terminal. The cursor must

        be sent with the same filters and sort as the page that returned it.

        "
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummaryData"
          description: Admin user summaries returned in the current page.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: string
          description: User ID cursor for the next page, omitted when more results are unavailable.
          example: usr_681w9znhe8eawrhebxd1046d44
        total:
          type: integer
          minimum: 0
          description: Total matching users when the reader provides it; omitted otherwise.
          example: 42
    AdminUserSummaryData:
      type: object
      description: Compact user account data returned by the administrator user-search endpoint.
      required:
        - userId
        - email
        - tier
        - role
      properties:
        userId:
          type: string
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          description: User's email address.
        firstName:
          type: string
          maxLength: 64
          description: User's first name, omitted when absent.
        lastName:
          type: string
          maxLength: 64
          description: User's last name, omitted when absent.
        tier:
          $ref: "#/components/schemas/UserTierData"
        role:
          $ref: "#/components/schemas/UserRoleData"
        stripeCustomerId:
          type: string
          description: Persisted Stripe customer identifier, omitted when absent.
    OwnUserAccountData:
      type: object
      description:
        User-owned account information for `/api/v1/me/account`. Role, tier, and Stripe customer ID are read-only
        here.
      required:
        - userId
        - email
        - showUnassessedOrSensitiveContent
        - tier
        - role
      properties:
        userId:
          type: string
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          description: User's email address.
        firstName:
          type: string
          maxLength: 64
          nullable: true
        lastName:
          type: string
          maxLength: 64
          nullable: true
        language:
          allOf:
            - $ref: "#/components/schemas/LanguageData"
          nullable: true
        currency:
          allOf:
            - $ref: "#/components/schemas/CurrencyData"
          nullable: true
        measurementUnit:
          allOf:
            - $ref: "#/components/schemas/MeasurementUnitData"
          nullable: true
        showUnassessedOrSensitiveContent:
          type: boolean
          description: Stored preference for showing unassessed or sensitive content.
        tier:
          $ref: "#/components/schemas/UserTierData"
        role:
          $ref: "#/components/schemas/UserRoleData"
        stripeCustomerId:
          type: string
          nullable: true
          description: Persisted Stripe customer identifier, omitted when absent.

    AdminUserAccountData:
      allOf:
        - $ref: "#/components/schemas/OwnUserAccountData"
        - type: object
          description: Admin user account view. Same read fields as own account; write permissions differ by endpoint.
    SuspendUserData:
      type: object
      description: Required administrator-supplied explanation for suspending a user.
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Non-empty, non-whitespace explanation for the suspension. This value is emitted to structured operational logs; do not include tokens, passwords, credentials, or other secrets. Common credential markers are rejected.
          example: Repeated policy violations
    SuspendUserResponseData:
      type: object
      required:
        - userId
        - suspended
      properties:
        userId:
          type: string
          description: Identifier of the target user.
        suspended:
          type: boolean
          description: Current suspension state; true after this operation, including an idempotent repeat.
          example: true
    UnsuspendUserResponseData:
      type: object
      required:
        - userId
        - suspended
      properties:
        userId:
          type: string
          description: Identifier of the target user.
        suspended:
          type: boolean
          description: Current suspension state; false after this operation, including an idempotent repeat.
          example: false
    PatchAdminUserData:
      type: object
      description: "Partial admin-only user update payload.

        All fields are optional. Omitted fields remain unchanged.

        Only one logical change category may be sent per request: profile/preferences fields, `role`, or `tier`.

        "
      properties:
        email:
          type: string
          format: email
          description: New email address. Null is invalid.
        firstName:
          type: string
          maxLength: 64
          nullable: true
          description: New first name.
          example: Ada
        lastName:
          type: string
          maxLength: 64
          nullable: true
          description: New last name.
          example: Lovelace
        language:
          allOf:
            - $ref: "#/components/schemas/LanguageData"
          nullable: true
          description: New preferred language.
        currency:
          allOf:
            - $ref: "#/components/schemas/CurrencyData"
          nullable: true
          description: New preferred currency.
        measurementUnit:
          allOf:
            - $ref: "#/components/schemas/MeasurementUnitData"
          nullable: true
          description: New preferred measurement unit system.
        showUnassessedOrSensitiveContent:
          type: boolean
          description:
            Omit to leave unchanged. Send `true` to show unassessed or sensitive content; send `false` to hide
            it. `null` is invalid.
          example: true
        tier:
          allOf:
            - $ref: "#/components/schemas/UserTierData"
          description: Omit to leave unchanged. Null is invalid.
        role:
          allOf:
            - $ref: "#/components/schemas/UserRoleData"
          description: Omit to leave unchanged. Null is invalid.
    PatchUserAccountData:
      type: object
      description: "Partial user account update data.

        All fields are optional - only provided fields will be updated.

        "
      properties:
        firstName:
          type: string
          maxLength: 64
          nullable: true
          description: New first name (max 64 characters)
          example: Jane
        lastName:
          type: string
          maxLength: 64
          nullable: true
          description: New last name (max 64 characters)
