          example: "2025-05-10T12:00:00Z"
    PartnerProductListingBatchFailuresResponse:
      type: array
      description:
        "Failed entries from a synchronous partner-product batch. This response body is returned

        with HTTP 200 only when at least one entry in a non-empty batch succeeded.

        "
      items:
        type: object
        required:
          - listingSourceId
          - sourceListingId
          - error
        properties:
          listingSourceId:
            type: string
            description: ListingSource that owns the failed product entry.
          sourceListingId:
