    UserTierData:
      type: string
      description:
        "The user's subscription tier, which determines limits and feature access (e.g. max watchlist entries,
        max search filters, allowed search filter fields).

        - `FREE`: Default tier for all users. Allows up to 20 watchlist entries, up to 1 search filter (limited to `productQuery`,
        `price`, `state`, `excludeProductId`, and `lifecycle` filter fields), and up to 10 product matches per filter.

        - `PRO`: Premium tier. Allows up to 100 watchlist entries, up to 5 search filters with access to all filter fields,
        and unlimited product matches per filter.

        - `ULTIMATE`: Highest tier. Allows unlimited watchlist entries, unlimited search filters with access to all filter
        fields, and unlimited product matches per filter.

