openapi: 3.0.0
info:
  title: Aura Historia API Reference
  description:
    "## Overview\n\nThe Aura Historia API powers the Aura Historia antiques platform and its partner-facing integrations.\n\
    It exposes product discovery, listing source discovery, personalization, partner onboarding, and integration\nworkflows\
    \ on top of Aura Historia's serverless AWS platform.\n\nThis reference is designed for two audiences:\n- **Internal developers**\
    \ building Aura Historia product-listings, operational tooling, and backoffice workflows\n- **External partners and integrators**\
    \ synchronizing inventory, consuming platform data, or\n  integrating with delegated access\n\n## Core API domains\n\n\
    - **ProductListings and listing-sources** — search, retrieve, and explore product-listings, related product-listings,\
    \ product\n  history, and listing source data\n- **Personalization** — manage watchlists, saved search filters, and user\
    \ notifications\n- **Partner workflows** — submit partnership applications, maintain partnerships, ingest catalog data\n\
    \  in batches, and receive WooCommerce webhooks\n- **Identity and access** — manage user accounts, Aura Historia access\
    \ tokens, and OAuth 2.0\n  clients and token flows\n- **Billing** — create Stripe checkout, billing-portal, and subscription-management\
    \ sessions\n\n## Authentication model\n\nThe API uses more than one authentication scheme depending on the route:\n\n\
    - **`BearerAuth`** — Cognito **access** JWT bearer tokens for authenticated user, admin, and\n  partner-user workflows.\
    \ Cognito ID tokens are not accepted as API credentials.\n- **`AccessTokenAuth`** — Aura Historia opaque bearer access\
    \ tokens created via\n  `/api/v1/me/access-tokens` or OAuth 2.0, primarily intended for partner automations and server-to-server\n\
    \  ingestion scenarios.\n\nWhen a route lists multiple security schemes, any one of the listed schemes may be accepted.\n\
    Some read endpoints can also be called without authentication, while a valid user token may enrich\nthe response with\
    \ personalized state such as watchlist, notification, or search-filter metadata.\n\n## Data and response conventions\n\
    \n- **PATCH:** an omitted request member remains unchanged. A documented nullable PATCH member\n  accepts `null` to clear\
    \ its value; `null` for any other member returns `400 BAD_BODY_VALUE`.\n  Use `[]`, not `null`, to replace a non-null\
    \ collection with an empty collection. Empty HTTP\n  bodies are invalid, `{}` is a valid object-PATCH no-op, and the partner-product\
    \ PATCH `[]`\n  remains a valid empty batch. Responses may omit absent optional values.\n- Product detail, watchlist,\
    \ and saved-search match reads accept optional **`language`** and\n  **`currency`** parameters. Currency defaults to `EUR`.\
    \ Detail pricing contains the seller's source\n  amounts, converted display amounts, and FX valuation metadata. Active\
    \ product-listings use the latest persisted\n  snapshot; sold product-listings use their immutable sale snapshot. Product\
    \ history remains immutable, source-only,\n  and is not localized.\n- Errors are returned as **`application/problem+json`**\
    \ using a consistent RFC 9457-style structure\n  with `status`, `title`, `error`, optional `source`, and optional `detail`\n\
    - Many list and search endpoints use **cursor-based pagination** via `searchAfter`\n- Every canonical API response includes\
    \ server-generated `X-Request-Id` and `X-Correlation-Id` headers. Clients may send `X-Correlation-Id` to preserve a trace\
    \ only when it is a 1–128-character ASCII value containing letters, digits, `.`, `_`, or `-`; invalid values are replaced.\
    \ Both headers are CORS-exposed.\n- Requests are limited to 1 MiB and time out after 30 seconds.\n- `GET /health` is a\
    \ process liveness check. `GET /ready` returns `204` only when the configured PostgreSQL and OpenSearch dependencies are\
    \ reachable; it otherwise returns `503`.\n- WooCommerce webhook ingestion responds with **`204 No Content`** after\
    \ signed validation. Events that map to raw capture are durably captured; `product.created` and `product.updated` events with missing or unsupported status are acknowledged as ignored. A capture `204` acknowledges a changed, unchanged, duplicate, or stale outcome—not necessarily a new raw revision; canonical normalization is asynchronous, while partner Product batch writes remain synchronous\n\n## Environment\
    \ endpoints\n\n- **Development:** `https://api.dev.aura-historia.com`\n- **Production:** `https://api.aura-historia.com`\n\
    \n## Notes for integrators\n\n- Treat Aura Historia identifiers such as `listingSourceId`, `productListingId`, `eventId`,\
    \ `userSearchFilterId`,\n  and `partnershipApplicationId` as opaque values\n- For partner product ingestion, `sourceListingId`\
    \ is the partner-controlled identifier and should\n  remain stable within a listing source\n- Endpoints marked `deprecated`\
    \ or `x-disabled` are retained for reference only and should not be\n  used for new integrations\n"
  version: 1.0.0
  contact:
    name: Aura-Historia Team
    url: https://aura-historia.com/
  license:
    name: License
    url: https://github.com/aura-historia/backend/blob/develop/LICENSE
servers:
  - url: https://api.dev.aura-historia.com
    description: Development environment
  - url: https://api.aura-historia.com
    description: Production environment
paths:
  /api/v1/listing-sources/{listingSourceId}/product-listings:
    post:
      summary: Batch create product-listings (Partner API)
      description:
        "Creates one or more product-listings for a listing source using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        Aura Historia access tokens on this endpoint must include the `product-listings:write` scope.

        Allowed callers are Aura Historia admins and users partnered with the target listing source.


        The request body is an array of `CreateProductListingData` objects. Each entry is created

        synchronously in its own PostgreSQL transaction.


        The response returns HTTP 200 with failures as `{ listingSourceId, sourceListingId, error }` objects when

        one or more entries succeed. `error` is the stable API error key for that entry. If every non-empty entry fails, the
        first failure is returned

        as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: postPartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product-listings to create synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/CreateProductListingData"
            example:
              - sourceListingId: baroque-violin-001
                title:
                  text: Baroque Violin
                  language: en
                description:
                  text: A beautiful 18th-century baroque violin in excellent condition.
                  language: en
                price:
                  currency: EUR
                  amount: 4500
                availability: IN_STOCK
                url: https://my-listing-source.com/product-listings/baroque-violin
                images:
                  - https://my-listing-source.com/images/violin-1.jpg
                  - https://my-listing-source.com/images/violin-2.jpg
      responses:
        "200":
          description:
            "Batch create completed synchronously. This response is returned when all entries

            succeed or when at least one entry succeeds; it lists only failed entries.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProductListingBatchFailuresResponse"
              examples:
                all_succeeded:
                  summary: All product-listings were created
                  value: []
                partial_failure:
                  summary: Some product-listings failed while at least one product was created
                  value:
                    - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
                      sourceListingId: baroque-violin-002
                      error: CONFLICT
        "400":
          description: Bad request — request body is missing, empty, or contains invalid JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
        "401":
          description:
            "Unauthorized — the bearer token is missing, invalid, expired, or the referenced

            Aura Historia access token no longer exists.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                access_token_not_found:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: ACCESS_TOKEN_NOT_FOUND
        "403":
          description: Forbidden — the authenticated caller is not allowed to ingest product-listings for this listing source
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the specified listing source does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "503":
          description: Service unavailable — all entries encountered a temporary product-write failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
    patch:
      summary: Batch update product-listings (Partner API)
      description:
        "Updates one or more existing product-listings for a listing source using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        Aura Historia access tokens on this endpoint must include the `product-listings:write` scope.

        Allowed callers are Aura Historia admins and users partnered with the target listing source.


        The request body is an array of `UpdateProductListingData` objects. Omitted fields are unchanged;

        `null` clears availability, price, and auction fields. `null` for `url` or `images` returns

        `400 BAD_BODY_VALUE`; send `[]` to remove all images. The complete batch contract is

        validated before any entry is applied synchronously in its own PostgreSQL transaction.


        The response returns HTTP 200 with failures as `{ listingSourceId, sourceListingId, error }` objects when

        one or more entries succeed. `error` is the stable API error key for that entry. If every non-empty entry fails, the
        first failure is returned

        as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: patchPartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product updates to apply synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/UpdateProductListingData"
            example:
              - sourceListingId: baroque-violin-001
                availability: null
              - sourceListingId: baroque-violin-002
                price:
                  currency: EUR
                  amount: 5000
                availability: IN_STOCK
      responses:
        "200":
          description:
            "Batch update completed synchronously. This response is returned when all entries

            succeed or when at least one entry succeeds; it lists only failed entries.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProductListingBatchFailuresResponse"
              examples:
                all_succeeded:
                  summary: All product-listings were updated
                  value: []
                partial_failure:
                  summary: Some product-listings failed while at least one product was updated
                  value:
                    - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
                      sourceListingId: baroque-violin-002
                      error: PRODUCT_LISTING_NOT_FOUND
        "400":
          description: Bad request — request body is missing, empty, or contains invalid JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
        "401":
          description:
            "Unauthorized — the bearer token is missing, invalid, expired, or the referenced

            Aura Historia access token no longer exists.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                access_token_not_found:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: ACCESS_TOKEN_NOT_FOUND
        "403":
          description: Forbidden — the authenticated caller is not allowed to ingest product-listings for this listing source
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the specified listing source does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "503":
          description: Service unavailable — all entries encountered a temporary product-write failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
    put:
      summary: Batch upsert product-listings (Partner API)
      description:
        "Creates new product-listings or updates existing ones for a listing source in a single batch call,\nusing\
        \ bearer authentication. This endpoint is intended for partnerships and accepts:\n- a Cognito bearer token for the\
        \ partner user linked to the listing source, or\n- an Aura Historia access token owned by that partner user.\n\nAura\
        \ Historia access tokens on this endpoint must include the `product-listings:write` scope.\nAllowed callers are Aura\
        \ Historia admins and users partnered with the target listing source.\n\nThe request body is an array of `UpsertProductListingData`\
        \ objects. Each entry is upserted\nsynchronously in its own PostgreSQL transaction. For each entry:\n- **New listing**\
        \ — omitted or `null` availability, price, estimates, and auction timestamps\n  create no value; a concrete value\
        \ sets it.\n- **Existing listing** — availability, price, each price estimate, and each auction timestamp\n  are tri-state:\
        \ omitted preserves, `null` clears, and a concrete value sets. A withdrawn\n  listing is restored before current facts\
        \ apply.\n- `title` and `description` apply only on creation. For an\n  existing\
        \ listing they preserve current state and emit no current-state history event.\n- `images` is separate: omit to preserve,\
        \ send `[]` to clear, or send an array to replace.\n  `null` is invalid. `url` is non-clearable: omit or send `null`\
        \ to preserve it; send a URL\n  value to replace it.\n\nThe response returns HTTP 200 with failures as `{ listingSourceId,\
        \ sourceListingId, error }` objects when\none or more entries succeed. `error` is the stable API error key for that\
        \ entry. If every non-empty entry fails, the first failure is returned\nas a problem response. An empty array is accepted\
        \ and returns `[]`.\n"
      operationId: putPartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product-listings to upsert synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/UpsertProductListingData"
            examples:
              create_new:
                summary: Create a new product
                value:
                  - sourceListingId: baroque-violin-001
                    title:
                      text: Baroque Violin
                      language: en
                    description:
                      text: A beautiful 18th-century baroque violin in excellent condition.
                      language: en
                    price:
                      currency: EUR
                      amount: 4500
                    availability: IN_STOCK
                    url: https://my-listing-source.com/product-listings/baroque-violin
                    images:
                      - https://my-listing-source.com/images/violin-1.jpg
              update_existing:
                summary: Update an existing product while leaving the current price unchanged
                value:
                  - sourceListingId: baroque-violin-001
                    availability: SOLD_OUT
                    priceEstimateMin:
                      currency: EUR
                      amount: 4200
                    priceEstimateMax:
                      currency: EUR
                      amount: 4800
                    url: https://my-listing-source.com/product-listings/baroque-violin?status=sold
                    images:
                      - https://my-listing-source.com/images/violin-1.jpg
                      - https://my-listing-source.com/images/violin-detail.jpg
                    auctionEnd: "2025-05-10T12:30:00Z"
              clear_images:
                summary: Clear an existing product's images
                value:
                  - sourceListingId: baroque-violin-001
                    images: []
      responses:
        "200":
          description:
            "Batch upsert completed synchronously. This response is returned when all entries

            succeed or when at least one entry succeeds; it lists only failed entries.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProductListingBatchFailuresResponse"
              examples:
                all_succeeded:
                  summary: All product-listings were upserted
                  value: []
                partial_failure:
                  summary: Some product-listings failed while at least one product was upserted
                  value:
                    - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
                      sourceListingId: baroque-violin-002
                      error: BAD_BODY_VALUE
        "400":
          description: Bad request — request body is missing, empty, or contains invalid JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
        "401":
          description:
            "Unauthorized — the bearer token is missing, invalid, expired, or the referenced

            Aura Historia access token no longer exists.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                access_token_not_found:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: ACCESS_TOKEN_NOT_FOUND
        "403":
          description: Forbidden — the authenticated caller is not allowed to ingest product-listings for this listing source
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the specified listing source does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "503":
          description: Service unavailable — all entries encountered a temporary product-write failure
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
    delete:
      summary: Batch delete product-listings (Partner API)
      description:
        "Soft-deletes product-listings for a listing source. Each entry writes its product lifecycle delete event
        and

        materialized PostgreSQL state synchronously in its own transaction.


        Allowed callers are Aura Historia admins and users partnered with the target listing source. Aura

        Historia access tokens must include the `product-listings:write` scope.


        The request body is an array of product identifiers. The response returns HTTP 200 with

        failures as `{ listingSourceId, sourceListingId, error }` objects when one or more entries succeed.

        `error` is the stable API error key for that entry. If every non-empty entry fails, the first

        failure is returned as a problem response. An empty array is accepted and returns `[]`.

        "
      operationId: deletePartnerProductListings
      tags:
        - ProductListings
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Array of at most 100 product-listings to delete synchronously. May be empty.
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/WithdrawProductListingData"
            example:
              - sourceListingId: baroque-violin-001
      responses:
        "200":
          description:
            "Batch delete completed synchronously. This response is returned when all entries

            succeed or when at least one entry succeeds; it lists only failed entries.

            "
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerProductListingBatchFailuresResponse"
              examples:
                all_succeeded:
                  value: []
                partial_failure:
                  value:
                    - listingSourceId: ls_6rd827eqfefsva9teecmwa3ate
                      sourceListingId: baroque-violin-002
                      error: PRODUCT_LISTING_NOT_FOUND
        "400":
          description: Bad request — request body is missing, empty, or contains invalid JSON
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized — the bearer token is missing, invalid, expired, or unknown.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description:
            Forbidden — caller is neither admin nor partnered with this listing source, or the access token lacks
            `product-listings:write`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — the specified listing source or product does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable — all entries encountered a temporary product-write failure.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/webhooks/woocommerce/{listingSourceId}:
    post:
      summary: Ingest a WooCommerce product webhook (Partner API)
      description:
        "Accepts a single WooCommerce product webhook event for a partnership using bearer authentication.

        This endpoint is intended for partnerships and accepts:

        - a Cognito bearer token for the partner user linked to the listing source, or

        - an Aura Historia access token owned by that partner user.


        The caller must provide:

        - the bearer token in the `Authorization` header,

        - the WooCommerce topic in `x-wc-webhook-topic`, and

        - the base64-encoded HMAC-SHA256 signature of the raw request body in `x-wc-webhook-signature`, and

        - optionally, the WooCommerce delivery identifier in `x-wc-webhook-delivery-id`.


        A supplied delivery identifier applies only when an event maps to raw capture. Its provider receipt retains only a

        canonical semantic source-payload SHA-256 evidence digest for 90 days. A captured-observation retry with the same

        digest receives `204`; reuse with different evidence returns `409 WOOCOMMERCE_PROVIDER_RECEIPT_DIGEST_CONFLICT`.

        Logical receipt expiry permits a new receipt but never removes or rewrites a captured raw revision or its provenance.

        A timestamp-free DELETE establishes a restore barrier. A later UPSERT without a provably newer `date_modified_gmt`

        returns `409 WOOCOMMERCE_PROVIDER_SOURCE_ORDER_AMBIGUOUS`; it creates neither a receipt nor a raw revision, so the

        original request remains recoverable for reconciliation and retry.

        Authorized ignored create/update events persist no receipt, even when they include a delivery identifier.


        Topic-specific payload requirements:

        - every topic requires `id`

        - `product.created` and `product.updated` with `status: publish` capture an UPSERT and require nonblank

        `name` and `permalink`

        - `product.created` and `product.updated` with `status: trash`, `draft`, `pending`, or `private` capture a

        DELETE and require only `id`; missing or unsupported statuses are authorized ignored events and also require

        only `id`

        - `product.deleted` captures a DELETE and requires only `id`


        The listing source identified by `listingSourceId` must have a stored `woocommerceWebhookSecret`

        and a configured `woocommerceLanguage`.

        A nonblank `price` maps to a `SET` and requires the listing source to have `woocommerceCurrency` configured.

        "
      operationId: postWoocommerceWebhook
      tags:
        - ProductListings
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: listingSourceId
          in: path
          required: true
          description: Unique identifier of the target ListingSource that should receive the WooCommerce webhook
          schema:
            type: string
            example: ls_6rd827eqfefsva9teecmwa3ate
        - name: x-wc-webhook-topic
          in: header
          required: true
          description:
            "WooCommerce webhook topic that determines how the payload is interpreted.

            Only the listed topic values are accepted.

            "
          schema:
            type: string
            enum:
              - product.created
              - product.updated
              - product.deleted
          example: product.created
        - name: x-wc-webhook-signature
          in: header
          required: true
          description:
            "Base64-encoded HMAC-SHA256 signature of the raw HTTP request body, calculated with the

            listing source's configured `woocommerceWebhookSecret`.

            "
          schema:
            type: string
          example: wqW/6B0S9myGxVQ8l3PPX2f6s4HWtY6q9KAr4m+Jv3E=
        - name: x-wc-webhook-delivery-id
          in: header
          required: false
          description: "Optional WooCommerce delivery identifier. For an event that maps to raw capture, its receipt retains only a canonical semantic source-payload SHA-256 evidence digest for 90 days and deduplicates retries. Reusing the identifier with a different digest returns `409 WOOCOMMERCE_PROVIDER_RECEIPT_DIGEST_CONFLICT`. Logical receipt expiry permits a new receipt but never removes or rewrites a captured raw revision or its provenance. Authorized ignored create/update status events persist no receipt and receive no receipt-based retry-deduplication, even when this header is supplied. When absent, no provider receipt or receipt-based retry-deduplication guarantee is made."
          schema:
            type: string
            minLength: 1
            maxLength: 512
          example: 4d1f0a18-ec5e-4e97-8cf8-ff4edc8b2e31
      requestBody:
        required: true
        description: "Topic-specific WooCommerce product payload.

          Every topic requires `id`. For `product.created` and `product.updated`, `status: publish` captures an UPSERT and requires nonblank `name` and `permalink`; `status: trash`, `draft`, `pending`, or `private` captures a DELETE and requires only `id`. Missing or unsupported create/update statuses are authorized ignored events and require only `id`. `product.deleted` captures a DELETE and requires only `id`; its other fields are optional and ignored when absent.

          When present on an event that maps to raw capture, WooCommerce `date_modified_gmt` is the source ordering timestamp. It accepts a no-offset GMT value interpreted as UTC, RFC3339 `Z`, or RFC3339 `+00:00`; malformed or nonzero-offset values return `400 BAD_BODY_VALUE`. `product.created` and `product.updated` events with missing or unsupported status are ignored only after capability and source authorization, then acknowledge `204` without parsing `date_modified_gmt` or constructing a provider receipt; a denied ignored event returns `403 FORBIDDEN`. An authorized ignored event persists no provider receipt even if a delivery ID is supplied. Omit it when source order is unavailable; an omitted timestamp provides no source-ordering guarantee.

          "
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/WoocommerceProductWebhookUpsertData"
                - $ref: "#/components/schemas/WoocommerceProductWebhookDeleteData"
            examples:
              created:
                summary: Product created webhook
                value:
                  id: 17
                  name: Test Produkt Titel
                  permalink: http://aura-historia-test.local/product/test-produkt-titel/
                  description: "<p>Hayde yallah test beschreibung</p>

                    "
                  short_description:
                    "<p>Hayde yallah kurze test beschreibung</p>

                    "
                  price: "42.69"
                  status: publish
                  stock_status: instock
                  images: []
              updated:
                summary: Product updated webhook
                value:
                  id: 17
                  name: Test Produkt Titel
                  permalink: http://aura-historia-test.local/product/test-produkt-titel/
                  description: "<p>Hayde yallah test beschreibung</p>

                    "
                  short_description:
                    "<p>Hayde yallah kurze test beschreibung</p>

                    "
                  price: "123.45"
                  status: publish
                  stock_status: instock
                  images: []
              deleted:
                summary: Product deleted webhook
                value:
                  id: 17
      responses:
        "204":
          description:
            "Webhook capability, signature, and source authorization are validated. A `204` acknowledges an authorized ignored create/update event with missing or unsupported status, or a durably captured changed, unchanged, duplicate, or stale outcome; it does not mean a new raw revision was written. Ignored events do not parse `date_modified_gmt` or construct a provider receipt. A provider receipt exists only for an event that maps to raw capture and carries a delivery ID; authorized ignored events persist no receipt even when a delivery ID is supplied. Source ordering is evaluated only for an event that maps to raw capture with a valid `date_modified_gmt`. When a delivery ID or source timestamp is omitted, no corresponding receipt or source-ordering guarantee is made. Canonical ProductListing normalization runs asynchronously. The backend returns no response body on success.

            "
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description:
            "Bad request — invalid or missing listing source ID, missing body, malformed JSON, unsupported

            WooCommerce topic, an invalid `date_modified_gmt` source timestamp (including a nonzero offset) for an event that maps to raw capture, or a missing field required by the selected capture operation.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_listing_source_id:
                  summary: Missing listing source ID path parameter
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_PATH_PARAMETER_VALUE
                    source:
                      field: listingSourceId
                      type: PATH
                    detail: Missing field 'listingSourceId'.
                invalid_listing_source_id:
                  summary: Invalid listing source ID format
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: listingSourceId
                      type: PATH
                    detail: must be a valid ListingSource ID
                missing_body:
                  summary: Request body is absent or empty
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty.
                invalid_json:
                  summary: Request body is not valid JSON
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: expected value at line 1 column 1
                missing_topic:
                  summary: WooCommerce topic header is missing
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-topic
                      type: HEADER
        "401":
          description:
            "Unauthorized — missing or invalid bearer credentials use `INVALID_CREDENTIALS`. A missing or invalid

            WooCommerce signature uses `BAD_HEADER_VALUE`.

            "
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_authorization:
                  summary: Authorization header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                    source:
                      field: Authorization
                      type: HEADER
                invalid_access_token:
                  summary: Aura Historia access token is unknown or expired
                  value:
                    status: 401
                    title: Unauthorized
                    error: INVALID_CREDENTIALS
                missing_signature:
                  summary: WooCommerce signature header is missing
                  value:
                    status: 401
                    title: Unauthorized
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-signature
                      type: HEADER
                    detail: WooCommerce signature header is required.
                signature_mismatch:
                  summary: WooCommerce signature does not match the request body
                  value:
                    status: 401
                    title: Unauthorized
                    error: BAD_HEADER_VALUE
                    source:
                      field: x-wc-webhook-signature
                      type: HEADER
                    detail: WooCommerce signature is invalid.
        "403":
          description: Forbidden — the caller lacks the required ProductListing write capability or exact source partnership grant, including for ignored status events
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: Not found — the specified listing source does not exist
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: LISTING_SOURCE_NOT_FOUND
        "409":
          description: Conflict — a delivery receipt conflicts with its retained evidence digest (`WOOCOMMERCE_PROVIDER_RECEIPT_DIGEST_CONFLICT`), distinct evidence has the same `date_modified_gmt` timestamp (`WOOCOMMERCE_PROVIDER_SOURCE_ORDER_CONFLICT`), or an UPSERT cannot safely cross a delete ordering boundary (`WOOCOMMERCE_PROVIDER_SOURCE_ORDER_AMBIGUOUS`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                receipt_digest_conflict:
                  summary: Delivery ID conflicts with its retained evidence digest
                  value:
                    status: 409
                    title: Conflict
                    error: WOOCOMMERCE_PROVIDER_RECEIPT_DIGEST_CONFLICT
                source_order_conflict:
                  summary: Source timestamp conflicts with distinct prior evidence
                  value:
                    status: 409
                    title: Conflict
                    error: WOOCOMMERCE_PROVIDER_SOURCE_ORDER_CONFLICT
                source_order_ambiguous:
                  summary: Source timestamp cannot prove a post-delete restore is newer
                  value:
                    status: 409
                    title: Conflict
                    error: WOOCOMMERCE_PROVIDER_SOURCE_ORDER_AMBIGUOUS
        "503":
          description: Service unavailable — this route emits only `AUTH_TEMPORARILY_UNAVAILABLE`, `LISTING_SOURCE_TEMPORARILY_UNAVAILABLE`, or `PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                auth_temporarily_unavailable:
                  summary: Authentication is temporarily unavailable
                  value:
                    status: 503
                    title: Service Unavailable
                    error: AUTH_TEMPORARILY_UNAVAILABLE
                listing_source_temporarily_unavailable:
                  summary: ListingSource access is temporarily unavailable
                  value:
                    status: 503
                    title: Service Unavailable
                    error: LISTING_SOURCE_TEMPORARILY_UNAVAILABLE
                product_listing_temporarily_unavailable:
                  summary: Raw ProductListing capture is temporarily unavailable
                  value:
                    status: 503
                    title: Service Unavailable
                    error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error — this route emits only `AUTH_INTERNAL_ERROR`, `LISTING_SOURCE_INTERNAL_ERROR`, or `PRODUCT_LISTING_INTERNAL_ERROR`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                auth_internal_error:
                  summary: Authentication failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: AUTH_INTERNAL_ERROR
                listing_source_internal_error:
                  summary: ListingSource access failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: LISTING_SOURCE_INTERNAL_ERROR
                product_listing_internal_error:
                  summary: Raw ProductListing capture failed internally
                  value:
                    status: 500
                    title: Internal Server Error
                    error: PRODUCT_LISTING_INTERNAL_ERROR
  /api/v1/product-listings/by-slug/{productListingTitleSlugId}:
    get:
      summary: Get a single product by title slug
      description: >-
        Retrieves an active ProductListing by its immutable Aura-owned
        `productListingTitleSlugId`, derived from its title. Withdrawn listings
        return `404 PRODUCT_LISTING_NOT_FOUND`; this endpoint never returns `410`.
      operationId: getProductListingByTitleSlug
      tags:
        - ProductListings
      parameters:
        - name: productListingTitleSlugId
          in: path
          required: true
          description: Immutable Aura-owned public locator derived from the listing title
          schema:
            type: string
            minLength: 8
            maxLength: 120
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*-[0-9a-f]{6}$"
            example: museum-cabinet-18-19-century-a1b2c3
        - name: language
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: ProductListing found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
        "400":
          description: Invalid path or query parameter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ProductListing not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Product detail temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/product-listings/{productListingId}:
    get:
      summary: Get a single product
      description:
        "Retrieves a single product by its `productListingId`. Withdrawn listings return
        `404 PRODUCT_LISTING_NOT_FOUND`; this endpoint never returns `410`.


        `pricing.source` preserves seller-supplied source amounts and currencies. `pricing.display` contains

        HalfUp-converted amounts in the requested currency, and `pricing.valuation` identifies the persisted

        snapshot used. A sold Product may have no main price; then display prices are omitted while its immutable

        `SALE` valuation remains present. Currency defaults to `EUR`.


        Anonymous responses use freshness caching only: no `ETag` or `Last-Modified` validator is emitted because

        current display pricing may change when the selected persisted FX snapshot changes.


        Responses always contain `item`, the product data. A valid user or delegated-user bearer token

        adds optional top-level `userState`; authenticated responses are not cached.

        "
      operationId: getProductListing
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique identifier of the ProductListing
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: language
          in: query
          required: false
          description:
            Requested current title and description language. Defaults to `en`; unavailable translations fall back
            to stored content.
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          description: Display currency. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: ProductListing found and returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalizedProductListingDetailsData"
          headers:
            Content-Language:
              description: The language of the returned content
              schema:
                $ref: "#/components/schemas/LanguageData"
              example: de
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
        "400":
          description: Bad request - invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: ProductListing not found, including a withdrawn listing
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
        "503":
          description: Product detail or notification state is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
  /api/v1/product-listings/{productListingId}/history:
    get:
      summary: Get ProductListing history
      description:
        "Retrieves immutable domain history for one ProductListing by `productListingId`.

        Each array item is one committed `PRODUCT_LISTING_DISCOVERED` or
        `PRODUCT_LISTING_CHANGED` event, ordered by occurrence time and event ID. A changed
        item contains a deterministic ordered `changes` array; it is never split into synthetic
        entries. Discovery exposes image count, never source image URLs.

        Price snapshots preserve stored source amounts and currencies. Sale observations retain
        their immutable source provenance. This endpoint performs no currency conversion.

        "
      operationId: getProductListingHistory
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique ProductListing identifier
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
      responses:
        "200":
          description: Product history retrieved successfully
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=180, s-maxage=900
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductListingHistoryEntryData"
              examples:
                product_history:
                  summary: Example ProductListing history
                  value:
                    - eventType: PRODUCT_LISTING_DISCOVERED
                      productListingId: pl_5xdb465tg1enarx2knf04mxbxj
                      eventId: evt_7s35w34ftcew1r4cransc55rt4
                      payload:
                        listingSourceId: ls_6ckwc632p2e2q86nv92g9eyw9q
                        sourceListingId: source-6ba7b810
                        pricing:
                          price:
                            currency: EUR
                            amount: 3000
                        availability: IN_STOCK
                        url: https://listing-source.example/product-listings/6ba7b810
                        imageCount: 3
                        auction:
                          start: null
                          end: null
                      timestamp: "2026-09-01T10:00:00Z"
                    - eventType: PRODUCT_LISTING_CHANGED
                      productListingId: pl_5xdb465tg1enarx2knf04mxbxj
                      eventId: evt_2mdmwstjvvfn3rmbakmarshhqg
                      payload:
                        changes:
                          - type: MAIN_PRICE_CHANGED
                            previous:
                              currency: EUR
                              amount: 3000
                            current:
                              currency: EUR
                              amount: 2999
                          - type: AVAILABILITY_CHANGED
                            previous: IN_STOCK
                            current: SOLD_OUT
                      timestamp: "2026-09-01T10:15:00Z"
        "400":
          description: Bad request - Invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
        "503":
          description: ProductListing history is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: ProductListing history contains invalid stored event data
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: PRODUCT_LISTING_INTERNAL_ERROR
  /api/v1/product-listings/{productListingId}/similar:
    get:
      summary: Get similar product-listings
      description:
        "Retrieves product-listings similar to the specified product using KNN search over text embeddings.

        When the product embedding is ready, the endpoint returns matching product-listings. If it is absent,

        the endpoint returns `202 Accepted` with a polling location.


        Ready entries return `displayPrice` in the requested currency and `priceValuation` metadata.

        Active ProductListings use one persisted snapshot pinned for the request; sold ProductListings use immutable

        sale-time values. Every ready entry contains `item`; a valid user or delegated-user bearer token adds

        `userState`. Personalized KNN results use `Cache-Control: no-store`.

        "
      operationId: getSimilarProductListings
      tags:
        - ProductListings
      parameters:
        - name: productListingId
          in: path
          required: true
          description: Unique identifier of the product
          schema:
            type: string
            example: pl_5xdb465tg1enarx2knf04mxbxj
        - name: language
          in: query
          required: false
          description: Language used for localized KNN result titles. Defaults to `en`.
          schema:
            $ref: "#/components/schemas/LanguageData"
        - name: currency
          in: query
          required: false
          description: Display currency for KNN result prices. Defaults to `EUR`.
          schema:
            $ref: "#/components/schemas/CurrencyData"
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: Similar product-listings found and returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalizedProductListingSummaryData"
        "202":
          description: Product embedding is not available yet. Poll the Location URL for KNN results.
          headers:
            Location:
              description: URL to poll for similar product-listings once the embedding is available
              schema:
                type: string
                format: uri
              example: /api/v1/product-listings/pl_5xdb465tg1enarx2knf04mxbxj/similar
        "400":
          description: Bad request - invalid parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: PRODUCT_LISTING_NOT_FOUND
                detail:
                  ProductListing with ListingSourceId 'ls_6rd827eqfefsva9teecmwa3ate' and SourceListingId '6ba7b810'
                  not found.
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
  /api/v1/product-listings:
    get:
      summary: Simple product search via query parameters
      description:
        "Performs canonical ProductListing search with query parameters. Text queries combine BM25 and embedding
        KNN retrieval when embedding generation succeeds; otherwise the backend falls back to BM25. Explicit non-score sorts
        use BM25. A valid bearer token adds user state and makes the response `Cache-Control: no-store`. `language` defaults
        to `en` and `currency` defaults to `EUR`."
      operationId: simpleSearchProductListings
      tags:
        - ProductListings
      parameters:
        - name: language
          in: query
          required: false
          description: Language used for search matching and localized response fields; defaults to `en`
          schema:
            $ref: "#/components/schemas/LanguageData"
          example: de
        - name: currency
          in: query
          required: false
          description:
            Currency used to select the indexed price field; defaults to `EUR`; no request-time currency conversion
            occurs
          schema:
            $ref: "#/components/schemas/CurrencyData"
          example: EUR
        - name: productQuery
          in: query
          required: false
          description: Optional text queries for product-listings. Multiple entries are ORed together.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              minLength: 1
          example:
            - test
            - example
        - name: enhancedSearchDescription
          in: query
          required: false
          description: Optional natural-language description used to refine matching.
          schema:
            type: string
            minLength: 1
            maxLength: 1000
        - name: excludeProductId
          in: query
          required: false
          description: Optional product IDs to exclude from results.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
          example:
            - pl_5xdb465tg1enarx2knf04mxbxj
        - name: listingSourceId
          in: query
          required: false
          description: Optional ListingSource IDs to include. A result must belong to one of the supplied sources.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: excludeListingSourceId
          in: query
          required: false
          description: Optional ListingSource IDs to exclude from results.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
            uniqueItems: true
        - name: price
          in: query
          required: false
          description:
            "Optional price range filter in minor currency units (e.g. cents for most supported currencies, whole
            yen for JPY).

            Use `price[min]` and/or `price[max]` to specify the range bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: integer
                minimum: 0
                description: Minimum price (inclusive) in minor currency units for the selected indexed currency
                example: 1000
              max:
                type: integer
                minimum: 0
                description: Maximum price (inclusive) in minor currency units for the selected indexed currency
                example: 50000
        - name: availability
          in: query
          required: false
          description: Optional exact availability assertions. Values are ORed.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ListingAvailabilityData"
            uniqueItems: true
          example:
            - IN_STOCK
            - LIMITED_AVAILABILITY
        - name: created
          in: query
          required: false
          description:
            "Optional filter by product creation date range (RFC3339 format).

            Use `created[min]` and/or `created[max]` to specify the datetime bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum creation datetime (inclusive, RFC3339 format)
                example: "2024-01-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum creation datetime (inclusive, RFC3339 format)
                example: "2024-12-31T23:59:59Z"
        - name: updated
          in: query
          required: false
          description:
            "Optional filter by product last-updated date range (RFC3339 format).

            Use `updated[min]` and/or `updated[max]` to specify the datetime bounds.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum last-updated datetime (inclusive, RFC3339 format)
                example: "2024-01-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum last-updated datetime (inclusive, RFC3339 format)
                example: "2024-12-31T23:59:59Z"
        - name: auctionStart
          in: query
          required: false
          description:
            "Optional filter by auction start datetime range (RFC3339 format).

            Use `auctionStart[min]` and/or `auctionStart[max]` to specify the bounds.

            Only matches product-listings that have an auction start time set.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum auction start datetime (inclusive, RFC3339 format)
                example: "2025-05-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum auction start datetime (inclusive, RFC3339 format)
                example: "2025-05-31T23:59:59Z"
        - name: auctionEnd
          in: query
          required: false
          description:
            "Optional filter by auction end datetime range (RFC3339 format).

            Use `auctionEnd[min]` and/or `auctionEnd[max]` to specify the bounds.

            Only matches product-listings that have an auction end time set.

            "
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              min:
                type: string
                format: date-time
                description: Minimum auction end datetime (inclusive, RFC3339 format)
                example: "2025-05-01T00:00:00Z"
              max:
                type: string
                format: date-time
                description: Maximum auction end datetime (inclusive, RFC3339 format)
                example: "2025-05-31T23:59:59Z"
        - name: sort
          in: query
          required: false
          description: Field to sort results by
          schema:
            $ref: "#/components/schemas/SortProductListingFieldData"
          example: created
        - name: order
          in: query
          required: false
          description: Sort order (only valid when sort is specified)
          schema:
            type: string
            enum:
              - asc
              - desc
          example: desc
        - name: searchAfter
          in: query
          required: false
          description:
            "Opaque ProductListing cursor for pagination. Pass the complete JSON object returned as

            `searchAfter` in the previous response as one query value. It pins the FX snapshot

            for the full cursor chain.

            "
          schema:
            $ref: "#/components/schemas/ProductListingSearchCursorData"
          example: '{"fxRateId":"fx_0cwktgjtwnf4tb6hf2f8zm0x5k","searchAfter":[2999,"pl_5xdb465tg1enarx2knf04mxbxj"]}'
        - name: size
          in: query
          required: false
          description: Number of product-listings to return per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 21
          example: 5
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: Simple search results returned successfully
          headers:
            Cache-Control:
              description: Shared/public cache directives for GET simple-search responses
              schema:
                type: string
              example: public, max-age=60, s-maxage=300
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListingSearchResultData"
        "400":
          description: Bad request - invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_query:
                  summary: Invalid query parameter payload
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                invalid_sort_field:
                  summary: Invalid sort field
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: sort
                      type: QUERY
                    detail: "Expected any of: 'score', 'price', 'updated', 'created'. Got: 'invalid'"
                invalid_order:
                  summary: Invalid sort order
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_QUERY_PARAMETER_VALUE
                    source:
                      field: order
                      type: QUERY
                    detail: "Expected any of: 'asc' or 'desc'. Got: 'invalid'"
        "503":
          description: Product search or required personalized state is temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: PRODUCT_LISTING_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
  /api/v1/me/search-filters:
    get:
      summary: List user search filters
      description: "Retrieves all search filters for the authenticated user.

        Uses the service's fixed collection ordering.

        Requires a Cognito JWT or an Aura access token with `search-filters:write`.

        "
      operationId: getUserSearchFilters
      tags:
        - Search Filters
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: Search filters retrieved successfully
          headers:
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchFilterCollectionData"
              example:
                items:
                  - userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                    userSearchFilterId: sf_4hyqf0gyxveazss7nby5hve5x2
                    name: My Tech Store Search
                    notifications: true
                    state: ACTIVE
                    search:
                      language: en
                      currency: USD
                      productQuery:
                        - antique clock
                        - vintage clock
                      price:
                        min: 1000
                        max: 5000
                      availability:
                        - IN_STOCK
                      listingSourceId:
                        - ls_6rd827eqfefsva9teecmwa3ate
                    created: "2024-01-01T10:00:00Z"
                    updated: "2024-01-01T12:00:00Z"
                from: 0
                size: 1
                total: 1
        "401":
          description: Unauthorized - missing or invalid Cognito JWT or Aura access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - Aura access token lacks the required `search-filters:write` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
    post:
      summary: Create a new search filter
      description: "Creates a new search filter for the authenticated user.

        The search filter configuration is provided in the request body.

        Returns the created search filter with generated ID and metadata.

        Requires a Cognito JWT or an Aura access token with `search-filters:write`.


        The number of allowed search filters and the set of usable search filter fields depend on the user's tier:

        - `FREE`: Up to 1 search filter. Allowed fields are `productQuery`, `price`, `state`, `excludeProductId`, and `lifecycle`.
        Other fields are forbidden and return `SEARCH_FILTER_RESTRICTED_FEATURE`.

        - `PRO`: Up to 5 search filters. All filter fields are allowed.

        - `ULTIMATE`: Unlimited search filters. All filter fields are allowed.

        "
      operationId: createUserSearchFilter
      tags:
        - Search Filters
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        description: Search filter configuration with name and filter criteria
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUserSearchFilterData"
            example:
              name: My Tech Store Search
              search:
                language: en
                currency: USD
                productQuery:
                  - antique clock
                  - vintage clock
                price:
                  min: 1000
                  max: 5000
                availability:
                  - IN_STOCK
                created:
                  min: "2024-01-01T00:00:00Z"
                  max: "2024-12-31T23:59:59Z"
                listingSourceId:
                  - ls_6rd827eqfefsva9teecmwa3ate
      responses:
        "201":
          description: Search filter created successfully
          headers:
            Location:
              description: URL of the created search filter
              schema:
                type: string
                format: uri
              example: https://api.aura-historia.com/api/v1/me/search-filters/sf_4hyqf0gyxveazss7nby5hve5x2
            Content-Language:
              description: The language of the returned content
              schema:
                $ref: "#/components/schemas/LanguageData"
              example: en
            Last-Modified:
              description: When the search filter was created/updated
              schema:
                type: string
                format: http-date
              example: Wed, 01 Jan 2024 12:00:00 GMT
            Access-Control-Allow-Origin:
              description: CORS header
              schema:
                type: string
              example: "*"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchFilterData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                userSearchFilterId: sf_4hyqf0gyxveazss7nby5hve5x2
                name: My Tech Store Search
                notifications: true
                state: ACTIVE
                search:
                  language: en
                  currency: USD
                  productQuery:
                    - antique clock
                    - vintage clock
                  price:
                    min: 1000
                    max: 5000
                  availability:
                    - IN_STOCK
                  listingSourceId:
                    - ls_6rd827eqfefsva9teecmwa3ate
                created: "2024-01-01T12:00:00Z"
                updated: "2024-01-01T12:00:00Z"
        "400":
          description: Bad request - invalid request body
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                missing_body:
                  summary: Missing request body
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Body cannot be empty
                invalid_json:
                  summary: Invalid JSON format
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Invalid JSON format
        "401":
          description: Unauthorized - missing or invalid Cognito JWT or Aura access token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: Forbidden - Aura access token lacks the required `search-filters:write` scope
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
        "404":
          description: User not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "422":
          description: Unprocessable Entity - search filter quota exceeded or restricted feature used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                quota_exceeded:
                  summary: Search filter quota exceeded
                  value:
                    status: 422
                    title: Unprocessable Content
                    error: SEARCH_FILTER_QUOTA_EXCEEDED
                    detail: Exceeded the maximum amount of search filters. There are already 1/1 search filters occupied.
                restricted_feature:
                  summary: Search filter contains a field not available for the user's tier
                  value:
                    status: 422
                    title: Unprocessable Content
                    error: SEARCH_FILTER_RESTRICTED_FEATURE
                    detail:
                      Search filter contains forbidden search field 'listingSourceName' which requires a higher user
                      tier.
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: INTERNAL_SERVER_ERROR
