      description: Availability counts include ACTIVE listings only.
      required:
        [total, byLifecycle, activeAvailability, activeWithoutAvailability]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        byLifecycle:
          $ref: "#/components/schemas/AdminOverviewProductListingLifecycleCountsData"
        activeAvailability:
          $ref: "#/components/schemas/AdminOverviewActiveListingAvailabilityCountsData"
        activeWithoutAvailability:
          type: integer
          format: int64
          minimum: 0
    AdminOverviewProductListingLifecycleCountsData:
      type: object
      required: [active, withdrawn]
      properties:
        active: { type: integer, format: int64, minimum: 0 }
        withdrawn: { type: integer, format: int64, minimum: 0 }
    AdminOverviewActiveListingAvailabilityCountsData:
      type: object
      required:
        [
          available,
          inStock,
          limitedAvailability,
          backOrder,
          madeToOrder,
          preOrder,
          preSale,
          unavailable,
          reserved,
          outOfStock,
          soldOut,
        ]
      properties:
        available: { type: integer, format: int64, minimum: 0 }
        inStock: { type: integer, format: int64, minimum: 0 }
        limitedAvailability: { type: integer, format: int64, minimum: 0 }
        backOrder: { type: integer, format: int64, minimum: 0 }
        madeToOrder: { type: integer, format: int64, minimum: 0 }
        preOrder: { type: integer, format: int64, minimum: 0 }
        preSale: { type: integer, format: int64, minimum: 0 }
        unavailable: { type: integer, format: int64, minimum: 0 }
        reserved: { type: integer, format: int64, minimum: 0 }
        outOfStock: { type: integer, format: int64, minimum: 0 }
        soldOut: { type: integer, format: int64, minimum: 0 }
    AdminPartnershipCollectionData:
      type: object
      description: "Cursor-paginated safe Partnership summaries for the admin collection. `searchAfter` is omitted on the terminal page; no total is returned."
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPartnershipSummaryData"
          description: Partnership summaries returned in the current page.
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: Partnership cursor for the next page, omitted when no more results are available.
          example:
            - "2026-09-04T12:00:00Z"
            - psh_3q65ndcw7wfxqswjtrv1kfhwd1
    AdminPartnershipDetailsData:
      type: object
      description: "Administrator Partnership detail. Member and ListingSource reference arrays are ordered by ID and capped at 100 entries; count fields are complete."
      required:
        - partnershipId
        - party
        - memberUserIds
        - listingSourceIds
        - memberCount
        - listingSourceGrantCount
        - created
        - updated
      properties:
        partnershipId:
          type: string
          description: Stable Partnership identifier.
        party:
          $ref: "#/components/schemas/PartnershipPartySummaryData"
        memberUserIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Current member User IDs in deterministic ascending ID order. At most 100 references are returned.
          items:
            type: string
        listingSourceIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Current ListingSource grant IDs in deterministic ascending ID order. At most 100 references are returned.
          items:
            type: string
        memberCount:
          type: integer
          format: int64
          minimum: 0
          description: Complete number of current Partnership members.
        listingSourceGrantCount:
          type: integer
          format: int64
          minimum: 0
          description: Complete number of current ListingSource grants.
        created:
          type: string
          format: date-time
          description: When the Partnership was created.
        updated:
          type: string
          format: date-time
          description: When the Partnership was last updated.
    AdminPartnershipSummaryData:
      type: object
      description: "Safe administrator Partnership summary. Member/grant identities, Party contact data, persistence versions, and credentials are excluded."
      required:
        - partnershipId
        - party
        - memberCount
        - listingSourceGrantCount
        - created
        - updated
      properties:
        partnershipId:
          type: string
          description: Stable Partnership identifier.
        party:
          $ref: "#/components/schemas/PartnershipPartySummaryData"
        memberCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of users in the Partnership.
        listingSourceGrantCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of ListingSource grants in the Partnership.
        created:
          type: string
          format: date-time
          description: When the Partnership was created.
        updated:
          type: string
          format: date-time
          description: When the Partnership was last updated.
    PartnershipPartySummaryData:
      type: object
      description: Party summary embedded in an administrator Partnership result.
      required:
        - partyId
        - partySlugId
        - name
      properties:
        partyId:
          type: string
          description: Stable Party identifier.
        partySlugId:
          type: string
          description: Immutable Party slug identifier.
        name:
          type: string
          maxLength: 255
          description: Party name.
    PartnershipApplicationStateData:
      type: string
      enum:
        - SUBMITTED
        - IN_REVIEW
        - APPROVED
        - REJECTED
        - WITHDRAWN
    OwnPartnershipApplicationData:
      type: object
      required:
        - id
        - state
        - proposal
      properties:
        id:
          type: string
        state:
          $ref: "#/components/schemas/PartnershipApplicationStateData"
        proposal:
          $ref: "#/components/schemas/PartnershipApplicationProposalData"
    AdminPartnershipApplicationData:
      type: object
      required:
        - id
        - applicantUserId
        - state
        - proposal
        - approvedPartnershipId
        - approvedListingSourceId
      properties:
        id:
          type: string
        applicantUserId:
          type: string
        state:
          $ref: "#/components/schemas/PartnershipApplicationStateData"
        proposal:
          $ref: "#/components/schemas/PartnershipApplicationProposalData"
        approvedPartnershipId:
          type: string
          nullable: true
        approvedListingSourceId:
          type: string
          nullable: true
    PartnershipProposalTypeData:
      type: string
      enum:
        - EXISTING_LISTING_SOURCE
        - PROPOSED_LISTING_SOURCE
    AdminPartnershipApplicationSummaryData:
      type: object
      required:
        - id
        - applicantUserId
        - state
        - proposal
        - approvedPartnershipId
        - approvedListingSourceId
        - created
        - updated
      properties:
        id:
          type: string
        applicantUserId:
          type: string
        state:
          $ref: "#/components/schemas/PartnershipApplicationStateData"
        proposal:
          $ref: "#/components/schemas/PartnershipApplicationProposalData"
        approvedPartnershipId:
          type: string
          nullable: true
        approvedListingSourceId:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    AdminPartnershipApplicationCollectionData:
      type: object
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPartnershipApplicationSummaryData"
        size:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        searchAfter:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
          description: JSON cursor containing the sort timestamp followed by the PartnershipApplication ID.
        total:
          type: integer
          format: int64
          minimum: 0
          nullable: true
    ListingSourceReferenceData:
      type: object
      required:
        - listingSourceId
        - listingSourceSlugId
      properties:
        listingSourceId:
          type: string
        listingSourceSlugId:
          type: string
          example: ada-antiques
    ListingSourceData:
      type: object
      required:
        - listingSourceId
        - listingSourceSlugId
        - name
        - operator
        - ingestionMethods
        - created
        - updated
      properties:
        listingSourceId:
          type: string
        listingSourceSlugId:
          type: string
        name:
          type: string
          description: ListingSource name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        operator:
          $ref: "#/components/schemas/OperatorPartyData"
        ingestionMethods:
          type: array
          items:
            $ref: "#/components/schemas/ListingIngestionMethodData"
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    AdministeredListingSourceData:
      type: object
      required:
        - listingSourceId
        - listingSourceSlugId
        - name
      properties:
        listingSourceId:
          type: string
        listingSourceSlugId:
          type: string
        name:
          type: string
    ListingSourceSearchCollectionData:
      type: object
      description: "Cursor-paginated safe ListingSource summaries for the admin search endpoint. `searchAfter` is a ListingSource ID cursor and is omitted when the current page is terminal."
      required:
        - items
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListingSourceSearchSummaryData"
          description: ListingSource summaries returned in the current page.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size after server-side clamping.
          example: 21
        searchAfter:
          type: string
          description: ListingSource ID cursor for the next page, omitted when no more results are available.
          example: ls_11j55nbvjfe7ds34s7gya899a9
        total:
          type: integer
          minimum: 0
          description: Total matching ListingSources when provided by the reader; omitted otherwise.
          example: 42
    ListingSourceSearchSummaryData:
      type: object
      description: Safe ListingSource administration summary. Provider credentials, webhook secrets, and crawler-local configuration are excluded.
      required:
        - listingSourceId
        - listingSourceSlugId
        - name
        - operator
        - ingestionMethods
        - presentation
        - created
        - updated
      properties:
        listingSourceId:
          type: string
          description: Stable ListingSource identifier.
        listingSourceSlugId:
          type: string
          description: Immutable ListingSource slug identifier.
        name:
          type: string
          description: ListingSource name.
        operator:
          $ref: "#/components/schemas/OperatorPartyData"
        ingestionMethods:
          type: array
          items:
            $ref: "#/components/schemas/ListingIngestionMethodData"
          description: Active canonical ingestion methods.
        presentation:
          $ref: "#/components/schemas/ListingSourcePresentationData"
        referralConfiguration:
          allOf:
            - $ref: "#/components/schemas/ReferralConfigurationData"
          nullable: true
          description: Safe referral summary; provider credentials are never included.
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    ListingSourcePresentationData:
      type: object
      description: Optional public presentation URLs for a ListingSource.
      properties:
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
    ListingIngestionMethodData:
      type: string
      enum:
        - WEB_CRAWL
        - SHOPIFY
        - WOOCOMMERCE
        - PARTNER_API
    ListingIngestionConfigurationData:
      oneOf:
        - type: object
          required:
            - type
            - ingestionMethod
          properties:
            type:
              type: string
              enum:
                - UNCONFIGURED
            ingestionMethod:
              $ref: "#/components/schemas/ListingIngestionMethodData"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - WEB_CRAWL
            fallbackCurrency:
              type: string
              description: Optional ISO 4217 fallback used only when crawler-extracted price text contains no currency hint.
        - type: object
          required:
            - type
            - domain
          properties:
            type:
              type: string
              enum:
                - SHOPIFY
            domain:
              type: string
            currency:
              type: string
            language:
              type: string
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - WOOCOMMERCE
            currency:
              type: string
            language:
              type: string
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - PARTNER_API
    ReferralConfigurationData:
      type: object
      required:
        - type
        - camref
      properties:
        type:
          type: string
          enum:
            - PARTNERIZE
        camref:
          type: string
    OperatorPartyData:
      type: object
      required:
        - partyId
        - partySlugId
        - name
      properties:
        partyId:
          type: string
        partySlugId:
          type: string
        name:
          type: string
    ListingSourceOperatorInputData:
      oneOf:
        - type: object
          required:
            - type
            - partyId
          properties:
            type:
              type: string
              enum:
                - EXISTING
            partyId:
              type: string
        - type: object
          required:
            - type
            - name
          properties:
            type:
              type: string
              enum:
                - NEW
            name:
              type: string
              description: Party name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
            phone:
              type: string
            email:
              type: string
              format: email
    CreateListingSourceData:
      type: object
      required:
        - name
        - operator
        - ingestionConfiguration
      properties:
        name:
          type: string
          description: ListingSource name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        operator:
          $ref: "#/components/schemas/ListingSourceOperatorInputData"
        ingestionConfiguration:
          type: array
          items:
            $ref: "#/components/schemas/ListingIngestionConfigurationData"
        woocommerceWebhookSecret:
          type: string
          writeOnly: true
          description: Optional WooCommerce webhook secret. Accepted only when WOOCOMMERCE ingestion is configured; never returned or logged.
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
        referralConfiguration:
          $ref: "#/components/schemas/ReferralConfigurationData"
    UpdateListingSourceData:
      type: object
      description: Omitted fields are unchanged. `null` clears only `woocommerceWebhookSecret`, `url`, `image`, and `referralConfiguration`.
      properties:
        name:
          type: string
          description: ListingSource name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        ingestionConfiguration:
          type: array
          items:
            $ref: "#/components/schemas/ListingIngestionConfigurationData"
        woocommerceWebhookSecret:
          type: string
          nullable: true
          writeOnly: true
          description: Optional WooCommerce webhook secret. Never returned or logged.
        url:
          type: string
          format: uri
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
        referralConfiguration:
          allOf:
            - $ref: "#/components/schemas/ReferralConfigurationData"
          nullable: true
    PartnershipApplicationProposalData:
      oneOf:
        - type: object
          required:
            - type
            - listingSourceId
          properties:
            type:
              type: string
              enum:
                - EXISTING_LISTING_SOURCE
            listingSourceId:
              type: string
        - type: object
          required:
            - type
            - party
            - listingSource
          properties:
            type:
              type: string
              enum:
                - PROPOSED_LISTING_SOURCE
            party:
              $ref: "#/components/schemas/ProposedPartyData"
            listingSource:
              $ref: "#/components/schemas/ProposedListingSourceData"
    ProposedPartyData:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Party name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        phone:
          type: string
        email:
          type: string
          format: email
    ProposedListingSourceData:
      type: object
      required:
        - name
        - requestedIngestionMethods
      properties:
        name:
          type: string
          description: ListingSource name. Outer Unicode whitespace is trimmed; blank values and values over 255 UTF-8 bytes are rejected.
        url:
          type: string
          format: uri
        image:
          type: string
          format: uri
        requestedIngestionMethods:
          type: array
          items:
            $ref: "#/components/schemas/ListingIngestionMethodData"
    SubmitPartnershipApplicationData:
      type: object
      required:
        - proposal
      properties:
        proposal:
          $ref: "#/components/schemas/PartnershipApplicationProposalData"
    DecidePartnershipApplicationData:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - APPROVE
            - REJECT
    ProductListingSourceData:
      type: object
      description: ListingSource presentation hydrated for a ProductListing response.
      required:
        - listingSourceId
        - name
        - slugId
      properties:
        listingSourceId:
          type: string
        name:
          type: string
        slugId:
          type: string
x-tagGroups:
  - name: Discovery
    tags:
      - ProductListings
      - ListingSources
  - name: User Experience
    tags:
      - Search Filters
      - Watchlist
      - Notifications
      - User Account
      - Billing
      - Newsletter
  - name: Partner & Platform Integrations
    tags:
      - Partnerships
      - PartnershipApplications
      - OAuth

tags:
  - name: ProductListings
    description:
      Product retrieval, product history, similar-product discovery, product search, and partner catalog ingestion
      workflows.
  - name: ListingSources
    description: ListingSource retrieval, authenticated creation and update, and caller-administered listing sources.
  - name: Search Filters
    description: Saved search creation, maintenance, persisted matches, and match-feedback workflows.
  - name: Watchlist
    description: Watchlist membership, notification preferences, and watchlist-specific product state for authenticated users.
  - name: Notifications
    description: In-app notification retrieval, bulk updates, single-notification updates, and notification cleanup workflows.
  - name: User Account
    description:
      Authenticated user profile management, admin user management, access-token lifecycle management, and partnership
      listing.
  - name: Billing
    description: Stripe checkout, billing-portal, and subscription-management session creation for authenticated users.
  - name: Newsletter
    description: Newsletter subscription upsert workflows for website or product-surface sign-up flows.
  - name: Partnerships
    description: Partnership administration, safe summary reads, and membership/ListingSource count workflows.
  - name: PartnershipApplications
    description: Partnership application submission, review tracking, administration, and decision workflows.
  - name: OAuth
    description: OAuth 2.0 authorization, token, revocation, introspection, and OAuth client metadata management.
