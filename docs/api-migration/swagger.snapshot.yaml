                title: Service Unavailable
                error: PARTNERSHIP_TEMPORARILY_UNAVAILABLE
  /api/v1/admin/partnerships/{partnershipId}/listing-source-grants/{listingSourceId}:
    put:
      summary: Grant a ListingSource to a Partnership
      description: |
        Idempotently grants an existing ListingSource to an existing Partnership for an
        authenticated administrator. The Partnership and ListingSource must belong to the same
        Party; a mismatched Party is rejected with `409 CONFLICT`. An existing grant is a
        successful no-op. The operation is committed in one PostgreSQL transaction and returns no
        response body. All success and error responses use `Cache-Control: no-store`.
      operationId: adminGrantPartnershipListingSource
      tags:
        - Partnerships
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: partnershipId
          in: path
          required: true
          description: Stable Partnership ID.
          schema:
            type: string
          example: psh_3q65ndcw7wfxqswjtrv1kfhwd1
        - name: listingSourceId
          in: path
          required: true
          description: Existing ListingSource ID to grant to the Partnership.
          schema:
            type: string
          example: ls_1jy6kc0gpnecws80wddqee2rtq
      responses:
        "204":
          description: ListingSource grant created, or ListingSource grant already existed.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only mutation.
              schema:
                type: string
              example: no-store
        "400":
          description: Bad request - invalid Partnership or ListingSource ID.
