  /api/v1/admin/users/{userId}/suspension:
    put:
      summary: Suspend a user as admin
      description: |
        Suspends the explicit target user with an administrator-supplied reason.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `users:write`.
        Authorization is enforced in the User service, not only at the HTTP route.

        `userId` must be a valid User ID. `reason` is required, must not be empty or whitespace-only, and
        is limited to 1,000 bytes. It is emitted to structured operational logs, so it must not
        contain tokens, passwords, credentials, or other secrets. Common credential markers are
        rejected.
        Suspension is idempotent: a repeated request returns the target's suspended state. The final
        active administrator cannot be suspended. Once committed, a suspended user is rejected as
        `401 INVALID_CREDENTIALS` by all later Cognito JWT and Aura access-token authentication.
        Every response sends `Cache-Control: no-store`.
      operationId: adminSuspendUser
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user to suspend.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserData"
            example:
              reason: Repeated policy violations
      responses:
        "200":
          description: User is suspended, including after an idempotent repeat.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only user mutation.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuspendUserResponseData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                suspended: true
        "400":
          description: Invalid target User ID or missing, empty, oversized, or secret-bearing suspension reason.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                invalid_user_id:
                  value:
                    status: 400
                    title: Bad Request
                    error: INVALID_OBJECT_ID
                    source:
                      field: userId
                      type: PATH
                    detail: must be a valid User ID
                missing_reason:
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Suspension reason is required.
                invalid_reason:
                  value:
                    status: 400
                    title: Bad Request
                    error: BAD_BODY_VALUE
                    detail: Suspension reason is invalid.
        "401":
          description: Invalid or missing bearer credentials, including a credential for a suspended user.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: The caller is not an administrator or a delegated credential lacks users:write.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "404":
          description: Target user was not found.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "409":
          description: The target is the final active administrator.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 409
                title: Conflict
                error: CONFLICT
                detail: At least one active administrator must remain.
        "503":
          description: Authentication, authorization, or user persistence is temporarily unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                authentication:
                  value:
                    status: 503
                    title: Service Unavailable
                    error: AUTH_TEMPORARILY_UNAVAILABLE
                suspension:
                  value:
                    status: 503
                    title: Service Unavailable
                    error: USER_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal authentication or user persistence failure.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                authentication:
                  value:
                    status: 500
                    title: Internal Server Error
                    error: AUTH_INTERNAL_ERROR
                suspension:
                  value:
                    status: 500
                    title: Internal Server Error
                    error: USER_INTERNAL_ERROR

    delete:
      summary: Reactivate a user as admin
      description: |
        Removes the durable suspension state for the explicit target user. No request body is accepted.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `users:write`.
        Authorization is enforced in the User service, not only at the HTTP route.

        `userId` must be a valid User ID and the target user must exist. Reactivation is idempotent: a
        repeated request for an active user returns its active state without another write. The
        operation changes only suspension state; it preserves the user's profile, tier, role,
        credentials, and partnership relationships. Once committed, valid existing credentials can
        authenticate normally again. Every response sends `Cache-Control: no-store`.
      operationId: adminUnsuspendUser
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user to reactivate.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "200":
          description: User is active, including after an idempotent repeat.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only user mutation.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnsuspendUserResponseData"
              example:
                userId: usr_5pvhvpxyhve6ts31n9x8c2y513
                suspended: false
        "400":
          description: Invalid target User ID or a nonempty request body.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 400
                title: Bad Request
                error: INVALID_OBJECT_ID
                source:
                  field: userId
                  type: PATH
                detail: must be a valid User ID
        "401":
          description: Invalid or missing bearer credentials, including a credential for a suspended user.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 401
                title: Unauthorized
                error: INVALID_CREDENTIALS
        "403":
          description: The caller is not an administrator or a delegated credential lacks users:write.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 403
                title: Forbidden
                error: FORBIDDEN
                detail: Operation is not permitted.
        "404":
          description: Target user was not found.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 404
                title: Not Found
                error: USER_NOT_FOUND
        "409":
          description: User reactivation conflicts with concurrent state.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 409
                title: Conflict
                error: CONFLICT
        "503":
          description: Authentication, authorization, or user persistence is temporarily unavailable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 503
                title: Service Unavailable
                error: USER_TEMPORARILY_UNAVAILABLE
        "500":
          description: Internal authentication or user persistence failure.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                status: 500
                title: Internal Server Error
                error: USER_INTERNAL_ERROR

  /api/v1/admin/users/{userId}/sessions/revoke:
    post:
      summary: Revoke a user's Cognito sessions as admin
      description: |
        Invalidates the explicit target user's Cognito sessions with Cognito global sign-out. No request body is accepted.

        Cognito JWTs and Aura Historia access tokens are accepted. The caller's persisted user role
        must be `ADMIN`; delegated Aura Historia access tokens must also have `users:write`.
        Authorization and the target-user check are enforced in the User service, not only at the
        HTTP route. The PostgreSQL authorization check completes before the external Cognito call.

        `userId` must be a valid User ID and the target user must exist. Cognito global sign-out is safe to
        retry: it succeeds when there are no active sessions. The operation does not change the
        Aura user's profile, tier, role, suspension state, Aura access tokens, or partnerships.
        Every response sends `Cache-Control: no-store`.
      operationId: adminRevokeUserSessions
      tags:
        - User Account
      parameters:
        - name: userId
          in: path
          required: true
          description: Unique User ID for the user whose Cognito sessions are revoked.
          schema:
            type: string
          example: usr_5pvhvpxyhve6ts31n9x8c2y513
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      responses:
        "204":
          description: Cognito sessions were invalidated, including after a retry with no active sessions.
          headers:
            Cache-Control:
              description: Responses are never stored because this is an administrator-only security operation.
              schema:
