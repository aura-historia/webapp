            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Party persistence failed internally.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      summary: Update a Party as admin
      description: |
        Updates the name and/or contact information for a Party for an authenticated administrator.

        Only `name`, `phone`, and `email` are supported. Omitted members remain unchanged;
        `null` clears `phone` or `email`; `name` is not nullable and `name: null` is rejected.
        Party names trim outer Unicode whitespace, reject blank values, and reject values over 255
        UTF-8 bytes. Renaming a Party never changes its immutable slug.

        The response is the resulting Party representation and uses `Cache-Control: no-store`
        because contact data is returned. An empty object is a valid no-op PATCH; an empty HTTP
        body is invalid.
      operationId: adminUpdateParty
      tags:
        - Party
      security:
        - BearerAuth: []
        - AccessTokenAuth: []
      parameters:
        - name: partyId
          in: path
          required: true
          description: Stable Party identifier.
          schema:
            type: string
          example: pty_4k4snxc3pkecc9yw66heemzyp0
      requestBody:
        required: true
        description: Party name/contact patch. Omit unchanged members; null clears phone/email only.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartyData"
            examples:
              rename:
                summary: Rename without changing the Party slug
                value:
                  name: Antiques and More
              set_contact:
                summary: Set optional contact values
                value:
                  phone: "+49 30 123456"
                  email: contact@example.com
              clear_contact:
                summary: Clear optional contact values
                value:
                  phone: null
                  email: null
              no_op_patch:
                summary: Leave the Party unchanged
                value: {}
      responses:
        "200":
          description: Party updated successfully.
          headers:
